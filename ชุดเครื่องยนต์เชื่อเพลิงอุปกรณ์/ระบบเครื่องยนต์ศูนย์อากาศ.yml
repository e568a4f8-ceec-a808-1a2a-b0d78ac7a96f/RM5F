* 1912: บริษัท MAN สร้างเครื่องยนต์ดีเซลสองจังหวะสองทาง (double-acting piston two-stroke) ตัวแรก<ref name="Sass_1962_545" />
* 1912: [[รถจักร]]ที่ใช้เครื่องยนต์ดีเซลคันแรกถูกนำมาใช้ในเส้นทางรถไฟสวิสเซอร์แลนด์ [[Winterthur–Romanshorn railway|Winterthur–Romanshorn]]<ref name="Klooster2009" />
* 1912: เรือ [[MS Selandia|MS ''Selandia'']] เป็นเรือเดินสมุทรลำแรกที่ใช้เครื่องยนต์ดีเซล<ref name="Tschöke_2018_9" />
* 1913: เครื่องยนต์ดีเซล NELSECO ถูกติดตั้งในเรือเชิงพาณิชย์และเรือดำน้ำของ[[กองทัพเรือสหรัฐ]]<ref name="RiversHarbors" />
* 1913: 29 กันยายน รูด็อล์ฟ ดีเซิล เสียชีวิตอย่างลึกลับขณะโดยสารเรือ [[SS Dresden (1896)|SS ''Dresden'']] ข้าม[[ช่องแคบอังกฤษ]]<ref name="Solomon" />
* 1914: บริษัท MAN สร้างเครื่องยนต์สองจังหวะขนาด 900 แรงม้า (662 กิโลวัตต์) สำหรับเรือดำน้ำของเนเธอร์แลนด์<ref name="Sass_1962_541" />
* 1919: พรอสเปอร์ ลอเรนจ์ ได้รับสิทธิบัตรสำหรับส่วนประกอบ[[ระบบฉีดเชื้อเพลิงอ้อม#ห้องเผาไหม้ช่วย|ห้องเผาไหม้ช่วย]]ซึ่งรวม[[ระบบฉีดเชื้อเพลิง|หัวฉีดเข็ม]]<ref name="Pease2003" /><ref name="AutomobileQuarterly" /><ref name="Merker_2014_382" /> และเป็นปีที่เครื่องยนต์ดีเซลตัสแรกจากบริษัท [[Cummins]] ถือกำเนิดขึ้น<ref name="Bennett2016" /><ref name="DictionaryCH" />
==== ทศวรรษ 1920 ====
[[File:Fairbanks Morse model 32.jpg|thumb|Fairbanks Morse model 32]]
* 1923: ในงานแสดงสินค้า DLG ที่เคอนิชส์แบร์ค มีการเปิดตัวรถแทรกเตอร์การเกษตรคันแรกที่ใช้เครื่องยนต์ดีเซล Benz-Sendling S6 ต้นแบบ<ref name="Agritechnica_2017" />{{Better source needed|date=กุมภาพันธ์ 2019}}
