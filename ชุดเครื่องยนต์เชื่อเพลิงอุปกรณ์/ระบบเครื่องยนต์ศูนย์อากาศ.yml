===รถยนต์นั่ง===
{{See also|ประวัติศาสตร์รถยนต์ดีเซล}}

เครื่องยนต์ดีเซลได้รับความนิยมในรถยนต์ขนาดใหญ่มาอย่างยาวนานและถูกนำมาใช้ในรถยนต์ขนาดเล็ก เช่น รถยนต์[[ซูเปอร์มินิ]]ในยุโรปตั้งแต่ทศวรรษ 1980 เครื่องยนต์ดีเซลได้รับความนิยมในรถยนต์ขนาดใหญ่ก่อนหน้านั้น เนื่องจากข้อเสียด้านน้ำหนักและค่าใช้จ่ายไม่เป็นที่สังเกตได้มากนัก<ref name="AG125">{{Cite journal |last=Pirotte |first=Marcel |date=1984-07-05 |title=Gedetailleerde Test: Citroën BX19 TRD |trans-title=Detailed Test |journal=De AutoGids |language=nl-be |location=Brussels, Belgium |volume=5 |page=6 |ref=AG125 |number=125}}</ref> การทำงานที่ราบรื่นและแรงบิดสูงในรอบต่ำถือเป็นสิ่งสำคัญสำหรับรถยนต์นั่งและรถเพื่อการพาณิชย์ขนาดเล็ก การเปิดตัวการฉีดควบคุมอิเล็กทรอนิกส์ช่วยเพิ่มความราบรื่นในการสร้างแรงบิดได้อย่างมาก และตั้งแต่ต้นทศวรรษ 1990 ผู้ผลิตรถยนต์เริ่มนำเสนอรถยนต์หรูระดับไฮเอนด์ของตนด้วยเครื่องยนต์ดีเซล เครื่องยนต์ดีเซลสำหรับรถยนต์นั่งมักมีจำนวนสูบระหว่าง 3 ถึง 12 สูบ และมีความจุตั้งแต่ 0.8 ถึง 6.0 ลิตร เครื่องยนต์สมัยใหม่มักมีเทอร์โบชาร์จและการฉีดตรง<ref name="Reif_2014_11" />

เครื่องยนต์ดีเซลไม่มีปัญหาการจำกัดอากาศเข้า ทำให้กินเชื้อเพลิงต่ำมากโดยเฉพาะเมื่อมีภาระบางส่วนต่ำ<ref name="Reif_2014_23" /> (เช่น การขับขี่ด้วยความเร็วในเมือง) หนึ่งในห้าของรถยนต์นั่งทั่วโลกใช้เครื่องยนต์ดีเซล โดยส่วนใหญ่จะอยู่ในยุโรป ซึ่งประมาณ 47% ของรถยนต์นั่งทั้งหมดใช้เครื่องยนต์ดีเซล<ref name="Tschöke_2018_1000" /> [[ไดม์เลอร์|Daimler-Benz]] ร่วมกับ [[บ๊อช|Robert Bosch GmbH]] ผลิตรถยนต์นั่งที่ใช้เครื่องยนต์ดีเซลมาตั้งแต่ ค.ศ. 1936<ref name="Tschöke_2018_10" /> ความนิยมของรถยนต์นั่งที่ใช้เครื่องยนต์ดีเซลในตลาดอย่างอินเดีย เกาหลีใต้ และญี่ปุ่นกำลังเพิ่มขึ้น (ข้อมูล ณ ค.ศ. 2018)<ref name="Tschöke_2018_981" />

===รถเพื่อการพาณิชย์และรถบรรทุก===
ใน ค.ศ. 1893 รูด็อล์ฟ ดีเซิล เสนอว่าเครื่องยนต์ดีเซลอาจใช้เป็นพลังงานขับเคลื่อน "เกวียน" (รถบรรทุก) ได้<ref name="Diesel_1893_91" /> รถบรรทุกคันแรกที่ใช้เครื่องยนต์ดีเซลออกสู่ตลาดใน ค.ศ. 1924<ref name="Tschöke_2018_10" />

เครื่องยนต์ดีเซลสมัยใหม่สำหรับรถบรรทุกต้องมีความน่าเชื่อถือสูงมากและประหยัดเชื้อเพลิงได้ดีเยี่ยม การฉีดตรงคอมมอนเรล เทอร์โบชาร์จ และสี่ลิ้นต่อสูบถือเป็นมาตรฐาน ความจุเครื่องยนต์มีตั้งแต่ 4.5 ถึง 15.5 ลิตร โดยมี[[อัตราส่วนกำลังต่อน้ำหนัก]] 2.5–3.5&nbsp;kg·kW<sup>−1</sup> สำหรับงานหนักและ 2.0–3.0&nbsp;kg·kW<sup>−1</sup> สำหรับงานกลาง [[เครื่องยนต์ V|เครื่องยนต์ V6 และ V8]] เคยเป็นที่นิยมเนื่องจากโครงแบบ V ทำให้เครื่องยนต์มีน้ำหนักค่อนข้างน้อย แต่ในปัจจุบัน โครงแบบ V ได้ถูกเลิกใช้และหันมาใช้เครื่องยนต์สูบเรียงแทน โดยปกติแล้วจะเป็น 6 สูบเรียงสำหรับงานหนักและกลาง และ 4 สูบเรียงสำหรับงานกลาง การออกแบบ[[อันเดอร์สแควร์]]ทำให้ความเร็วลูกสูบโดยรวมต่ำลง ซึ่งส่งผลให้อายุการใช้งานยาวนานขึ้นถึง {{convert| 1200000| km|mi}}<ref name="Merker_2014_48" /> เมื่อเทียบกับเครื่องยนต์ดีเซลในทศวรรษ 1970 อายุการใช้งานที่คาดหวังของเครื่องยนต์ดีเซลสำหรับรถบรรทุกสมัยใหม่เพิ่มขึ้นกว่าเท่าตัว<ref name="Merker_2014_264" />

===ล้อขับเคลื่อนรถไฟ===
เครื่องยนต์ดีเซลสำหรับรถจักรถูกสร้างขึ้นเพื่อการทำงานอย่างต่อเนื่องระหว่างการเติมเชื้อเพลิงและอาจต้องได้รับการออกแบบมาเพื่อใช้เชื้อเพลิงคุณภาพต่ำในบางสถานการณ์<ref name="Reif_2014_12" /> รถจักรบางรุ่นใช้เครื่องยนต์ดีเซลสองจังหวะ<ref name="Merker_2014_284" /> เครื่องยนต์ดีเซลได้เข้ามาแทนที่[[เครื่องจักรไอน้ำ]]บนทางรถไฟที่ไม่ใช้ไฟฟ้าทั่วโลก [[รถจักรดีเซล]]คันแรกปรากฏใน ค.ศ. 1913<ref name="Tschöke_2018_10" /> และ[[ตู้รถไฟดีเซล]]ตามมาในไม่ช้า รถจักรดีเซลสมัยใหม่เกือบทั้งหมดเป็นที่รู้จักในชื่อที่ถูกต้องกว่าคือ[[รถจักร#ประเภทของรถจักร|รถจักรดีเซล–ไฟฟ้า]]เนื่องจากใช้ชุดส่งกำลังไฟฟ้า โดยเครื่องยนต์ดีเซลจะขับเคลื่อนเครื่องกำเนิดไฟฟ้าเพื่อส่งพลังงานให้กับมอเตอร์ฉุดลาก <ref name="vB_2017_1289" /> ขณะที่[[รถจักรไฟฟ้า]]ได้เข้ามาแทนที่รถจักรดีเซลสำหรับบริการผู้โดยสารในหลายพื้นที่ แต่ระบบฉุดลากดีเซลยังคงถูกนำมาใช้อย่างแพร่หลายสำหรับการลาก[[รถไฟบรรทุกสินค้า]]และบนรางรถไฟที่การติดตั้งไฟฟ้าไม่คุ้มค่าทางเศรษฐกิจ

ในทศวรรษ 1940 เครื่องยนต์ดีเซลสำหรับยานพาหนะบนท้องถนนที่มีกำลัง 150–200 แรงม้าเมตริก (110–150 กิโลวัตต์; 150–200 แรงม้า) ถือว่าเหมาะสมสำหรับรถดีเซลราง (DMU) โดยทั่วไปจะใช้เครื่องยนต์จากรถบรรทุกปกติ ความสูงของเครื่องยนต์เหล่านี้ต้องน้อยกว่า 1 เมตร (3 ฟุต 3 นิ้ว) เพื่อให้สามารถติดตั้งใต้พื้นรถได้ โดยปกติแล้วเครื่องยนต์จะถูกจับคู่กับกระปุกเกียร์เชิงกลควบคุมด้วยลม เนื่องจากมีขนาดเล็ก มวลเบา และต้นทุนการผลิตต่ำกว่าการออกแบบอื่น รถดีเซลรางบางรุ่นใช้ทอร์กคอนเวอร์เตอร์ไฮดรอลิกแทน ชุดส่งกำลังดีเซล–ไฟฟ้าไม่เหมาะสำหรับเครื่องยนต์ขนาดเล็กเช่นนี้<ref name="Kremser_1942_22" /> ในทศวรรษ 1930 [[การรถไฟแห่งชาติเยอรมัน]] (Deutsche Reichsbahn) ได้กำหนดมาตรฐานเครื่องยนต์รถดีเซลรางฉบับแรก เป็นเครื่องยนต์ 12 สูบนอน ขนาด 30.3 ลิตร (1,850 ลูกบาศก์นิ้ว) ให้กำลัง 275 แรงม้าเมตริก (202 กิโลวัตต์; 271 แรงม้า) ผู้ผลิตชาวเยอรมันหลายรายได้ผลิตเครื่องยนต์ตามมาตรฐานนี้<ref name="Kremser_1942_23" />

===พาหนะทางน้ำ===
[[File:8 cylinder Burmeister & Wain Diesel engine for MS Glenapp 1920.png|thumb|หนึ่งในเครื่องยนต์ดีเซลแปดสูบ 3200 I.H.P. ของ Harland and Wolff – Burmeister & Wain ที่ติดตั้งในเรือยนต์ ''Glenapp'' ซึ่งเป็นเครื่องยนต์ดีเซลที่มีกำลังสูงสุดที่เคยติดตั้งในเรือ ณ ขณะนั้น (1920) โปรดสังเกตผู้ชายที่ยืนอยู่ด้านล่างขวาเพื่อเทียบขนาด]]
[[File:InleHandCrank.webm|thumb|right|การติดเครื่องยนต์ดีเซลเรือด้วยมือใน[[ทะเลสาบอี้นเล่]] ([[ประเทศพม่า]])]]
ความต้องการเครื่องยนต์ดีเซลทางทะเลแตกต่างกันไปตามการใช้งาน สำหรับการใช้งานทางทหารและเรือขนาดกลาง เครื่องยนต์ดีเซลสี่จังหวะรอบกลางมีความเหมาะสมที่สุด เครื่องยนต์เหล่านี้มักมีมากถึง 24 สูบและมีกำลังขับอยู่ในระดับหลักหน่วยเมกะวัตต์<ref name="Reif_2014_12" /> เรือขนาดเล็กอาจใช้เครื่องยนต์ดีเซลของรถบรรทุก เรือขนาดใหญ่ใช้เครื่องยนต์ดีเซลสองจังหวะรอบต่ำที่มีประสิทธิภาพสูงมาก สามารถทำประสิทธิภาพได้สูงถึง 55% เครื่องยนต์เรือสองจังหวะต่างจากเครื่องยนต์ดีเซลทั่วไปส่วนใหญ่ตรงที่ใช้[[น้ำมันเตา]]ที่มีความหนืดสูง<ref name="Reif_2014_13" /> เรือดำน้ำมักใช้ดีเซล–ไฟฟ้า<ref name="vB_2017_1289" />

เครื่องยนต์ดีเซลสำหรับเรือตัวแรกผลิตโดย A. B. Diesels Motorer Stockholm ใน ค.ศ. 1903 เครื่องยนต์เหล่านี้เป็นแบบสามสูบ 120 แรงม้าเมตริก (88 กิโลวัตต์) และแบบสี่สูบ 180 แรงม้าเมตริก (132 กิโลวัตต์) และถูกนำไปใช้กับเรือของรัสเซีย ในสงครามโลกครั้งที่หนึ่ง การพัฒนาเครื่องยนต์ดีเซล โดยเฉพาะเครื่องยนต์สำหรับเรือดำน้ำมีความก้าวหน้าอย่างรวดเร็ว เมื่อสิ้นสุดสงคราม เครื่องยนต์สองจังหวะลูกสูบสองทางที่มีกำลังสูงสุดถึง 12,200 แรงม้าเมตริก (9 เมกะวัตต์) ได้ถูกสร้างขึ้นเพื่อใช้ในทะเล<ref name="Mau_1984_9_11" />

===การบิน===
{{Main|เครื่องยนต์ดีเซลอากาศยาน}}

====ช่วงต้น====
เครื่องยนต์ดีเซลเคยถูกนำไปใช้ในอากาศยานก่อนสงครามโลกครั้งที่สอง ตัวอย่างเช่น ในเรือเหาะ ''[[เอ็ลเซ็ท 129 ฮินเดินบวร์ค|LZ 129 Hindenburg]]'' ซึ่งใช้เครื่องยนต์ดีเซล [[Daimler-Benz DB 602]] จำนวน 4 ตัว<ref>Kyrill von Gersdorff, Kurt Grasmann: ''Flugmotoren und Strahltriebwerke: Entwicklungsgeschichte der deutschen Luftfahrtantriebe von den Anfängen bis zu den internationalen Gemeinschaftsentwicklungen'', Bernard & Graefe, 1985, {{ISBN|9783763752836}}, p. 14</ref> หรือในเครื่องบิน Junkers หลายลำที่ติดตั้งเครื่องยนต์ [[Junkers Jumo 205|Jumo 205]]<ref name="Reif_2012_103" />

ใน ค.ศ. 1929 ที่สหรัฐ บริษัท [[Packard Motor Company]] ได้พัฒนาเครื่องยนต์ดีเซลอากาศยานตัวแรกของอเมริกา [[Packard DR-980]] ซึ่งเป็น[[เครื่องยนต์แฉกดาว]] 9 สูบ ระบายความร้อนด้วยอากาศ พวกเขานำไปติดตั้งในเครื่องบินหลายรุ่นในยุคนั้น บางลำถูกใช้ในการทำสถิติบินระยะทางไกลหรือบินทน<ref name="flies_700_miles_1929_05_15_nytimes_com">[https://www.nytimes.com/1929/05/15/archives/flies-700-miles-fuel-cost-468-dieselmotored-packard-plane-goes-from.html "FLIES 700 MILES; FUEL COST $4.68; Diesel-Motored Packard Plane Goes From Michigan to Langley Field in Under Seven Hours. ENGINE HAS NINE CYLINDERS Oil Burner Is Exhibited Before Aviation Leaders, Met for Conference. Woolson Reports on Flight. Packard Motor Stocks Rise,"] May 15, 1929, ''[[New York Times]],'' retrieved December 5, 2022</ref><ref name="packard_2019_05_24_dieselworldmag_com">[https://www.dieselworldmag.com/diesel-engines/first-in-flight/ "The Packard DR-980 Radial Aircraft Diesel"] "First in Flight," "Diesel Engines," May 24, 2019, ''Diesel World'' magazine, retrieved December 5, 2022</ref><ref name="packard_diesel_buhl_earlyaviators_com">[https://www.earlyaviators.com/pimage26.htm "Packard-Diesel Powered Buhl Air Sedan, 1930"] (reproductions of early media articles and photos, with added information), ''Early Birds of Aviation,'' retrieved December 5, 2022</ref><ref name="enginehistory">[http://www.enginehistory.org/Diesels/CH1.pdf Aircraft Engine Historical Society – Diesels] {{webarchive|url=https://web.archive.org/web/20120212213152/http://www.enginehistory.org/Diesels/CH1.pdf |date=2012-02-12 }} Retrieved: 30 มกราคม 2009</ref> และในการสาธิตการสื่อสารด้วยวิทยุโทรศัพท์จากพื้นดินสู่อากาศที่ประสบความสำเร็จเป็นครั้งแรก (วิทยุสื่อสารด้วยเสียงก่อนหน้านี้ไม่สามารถเข้าใจได้ในเครื่องบินที่ใช้เครื่องยนต์จุดระเบิดด้วยประกายไฟ เนื่องจากมี[[การรบกวนทางแม่เหล็กไฟฟ้า]])<ref name="packard_2019_05_24_dieselworldmag_com" /><ref name="packard_diesel_buhl_earlyaviators_com" /> ข้อดีเพิ่มเติมที่ถูกกล่าวถึงในขณะนั้น ได้แก่ ความเสี่ยงที่ลดลงของการเกิดเพลิงไหม้หลังเครื่องตก และสมรรถนะที่เหนือกว่าเมื่อบินในระดับความสูง<ref name="packard_2019_05_24_dieselworldmag_com" />

วันที่ 6 มีนาคม ค.ฬ. 1930 เครื่องยนต์ดังกล่าวได้รับ[[ใบรับรองประเภทผ่านการรับรอง]] (Approved Type Certificate) จาก[[กระทรวงพาณิชย์สหรัฐ]] นับเป็นครั้งแรกสำหรับเครื่องยนต์ดีเซลอากาศยาน<ref name="diesel_aviation_engines_1940_enginehistory_org">Wilkinson, Paul H.: [https://www.enginehistory.org/Piston/Diesels/diesels.shtml "Diesel Aviation Engines,"] 1940, reproduced at Aviation Engine Historical Society, retrieved December 5, 2022</ref>  อย่างไรก็ดี ปัญหาควันไอเสียที่เป็นพิษ ปัญหาการสตาร์ตในอากาศเย็นจัด ปัญหาการสั่นสะเทือน ความล้มเหลวของโครงสร้างเครื่องยนต์ การเสียชีวิตของนักพัฒนา และ[[ภาวะเศรษฐกิจตกต่ำครั้งใหญ่]]ได้รวมกันเป็นสาเหตุที่ทำให้โครงการนี้ต้องยุติลง<ref name="packard_2019_05_24_dieselworldmag_com" />

====สมัยใหม่====
นับจากนั้นจนถึงปลายทศวรรษ 1970 ยังไม่มีการนำเครื่องยนต์ดีเซลมาใช้กับอากาศยานมากนัก ใน ค.ศ. 1978 คาร์ล เอช. เบอร์จีย์ ผู้ร่วมออกแบบ [[Piper Cherokee]] ได้ให้เหตุผลว่า "ความเป็นไปได้ที่เครื่องยนต์ดีเซลอากาศยานทั่วไปจะเกิดขึ้นในอนาคตอันใกล้นั้นเป็นเรื่องห่างไกล"<ref>Karl H. Bergey: ''[https://books.google.com/books?id=av85AQAAMAAJ Assessment of New Technology for General Aviation Aircraft]'', Report for U.S. Department of Transportation, September 1978, p. 19</ref>

อย่างไรก็ดี ด้วย[[วิกฤตพลังงานทศวรรษ +970|วิกฤตพลังงาน]]และ[[ขบวนการสิ่งแวดล้อม]]ในทศวรรษ 1970 และแรงกดดันที่ตามมาในเรื่องความต้องการการประหยัดเชื้อเพลิงที่มากขึ้น การลดคาร์บอนและสารตะกั่วในบรรยากาศ รวมถึงประเด็นอื่น ๆ ทำให้เกิดความสนใจในเครื่องยนต์ดีเซลอากาศยานขึ้นมาอีกครั้ง เครื่องยนต์อากาศยานลูกสูบอัดสูงที่ใช้น้ำมันเบนซินอากาศยาน ("[[avgas]]") โดยทั่วไปจำเป็นต้องเติมสารพิษ[[เททระเอทิลเลดลง]]ไปใน avgas เพื่อเลี่ยง[[การชิงจุดระเบิด]]และการน็อกของเครื่องยนต์ แต่เครื่องยนต์ดีเซลไม่จำเป็นต้องใช้เชื้อเพลิงผสมสารตะกั่ว นอกจากนี้ ในทางทฤษฎีแล้ว [[ไบโอดีเซล]]สามารถช่วยลดปริมาณคาร์บอนในบรรยากาศได้เมื่อเทียบกับ avgas ด้วยเหตุผลเหล่านี้ ชุมชน[[อากาศยานทั่วไป]]จึงเริ่มหวั่นเกรงว่าอาจมีการสั่งห้ามหรือยกเลิกการใช้ avgas ที่มีสารตะกั่ว<ref name="inside_2018_08_01_flyingmag_com" /><ref name="congressman_2012_10_24_generalaviationnews">Wood, Janice (editor): [https://generalaviationnews.com/2012/10/24/congressman-calls-on-faa-to-expand-use-of-unleaded-fuel/ Congressman urges FAA to expand use of existing unleaded fuel,"] October 24, 2012, ''General Aviation News,'' retrieved December 6, 2022</ref><ref name="hanke_2006_07_21_g_a_news">[https://www.linkedin.com/in/kurt-hanke-6bb24ab Hanke, Kurt F., engineer] ([https://www.turbocraft.com/ Turbocraft, Inc.]), [https://generalaviationnews.com/2006/07/21/diesels-are-the-way-for-ga-to-go/ "Diesels are the Way for GA to Go,"] July 21, 2006, ''Ge eral Aviation News,'' retrieved December 6, 2022</ref><ref name="biodiesel_basics_2003_energy_gov">{{cite journal|title=Biodiesel – Just the Basics|version=Final|year=2003|publisher=United States Department of Energy|url=http://www.eere.energy.gov/vehiclesandfuels/pdfs/basics/jtb_biodiesel.pdf|access-date=2007-08-24|url-status=dead|archive-url=https://web.archive.org/web/20070918122719/http://www1.eere.energy.gov/vehiclesandfuels/pdfs/basics/jtb_biodiesel.pdf|archive-date=2007-09-18}}</ref>

นอกจากนี้ avgas ยังเป็นเชื้อเพลิงเฉพาะที่มีความต้องการต่ำมาก (และลดลงเรื่อย ๆ) เมื่อเทียบกับเชื้อเพลิงอื่น และผู้ผลิตก็เสี่ยงต่อการถูกฟ้องร้องจากอุบัติเหตุเครื่องบินตกที่มีค่าใช้จ่ายสูง ทำให้ผู้กลั่นน้ำมันมีความสนใจในการผลิตน้อยลง นอกสหรัฐ avgas เริ่มหาได้ยากขึ้นที่สนามบิน (และโดยทั่วไป) เมื่อเทียบกับเชื้อเพลิงที่ราคาถูกกว่าและเข้ากันได้กับดีเซล เช่น Jet-A และ[[เชื้อเพลิงไอพ่น]]อื่น ๆ<ref name="inside_2018_08_01_flyingmag_com" /><ref name="congressman_2012_10_24_generalaviationnews" /><ref name="hanke_2006_07_21_g_a_news" /><ref name="biodiesel_basics_2003_energy_gov" />

ภายในปลายทศวรรษ 1990 ถึงต้นทศวรรษ 2000 เครื่องยนต์ดีเซลเริ่มปรากฏในอากาศยานเบา ที่โดดเด่นที่สุดคือ[[Thielert|แฟรงค์ ทีเลิร์ต และบริษัทเครื่องยนต์สัญชาติออสเตรียของเขา]] ได้เริ่มพัฒนาเครื่องยนต์ดีเซลเพื่อมาแทนที่เครื่องยนต์เบนซิน/ลูกสูบขนาด {{convert|100|hp|kW}} - {{convert|350|hp|kW}} ที่ใช้กันทั่วไปในอากาศยานเบา<ref name="powerplant_ch7_phak_faa_gov">[https://www.faa.gov/regulations_policies/handbooks_manuals/aviation/phak/media/09_phak_ch7.pdf "Powerplant"], in Chapter 7: "Aircraft Systems," ''Pilot's Handbook of Aeronautical Knowledge,'' [[Federal Aviation Administration]], retrieved December 5, 2022</ref> การนำ Theilerts มาใช้กับเครื่องบินที่ผลิตจริงเป็นครั้งแรกที่ประสบความสำเร็จคือใน [[ไดมอนด์ DA42 ทวินสตาร์|Diamond DA42 Twin Star]] ซึ่งเป็นเครื่องบินแฝดเบา ที่แสดงให้เห็นถึงประสิทธิภาพการใช้เชื้อเพลิงที่ยอดเยี่ยมเหนือกว่าเครื่องบินใด ๆ ในระดับเดียวกัน<ref name="inside_2018_08_01_flyingmag_com" /><ref name="diamond_2020_12_30_avweb_com" /><ref name="diamond_da42_2004_05_12_flightglobal_com">Collins, Peter: [https://www.flightglobal.com/flight-test-diamond-aircraft-da42-sparkling-performer/55396.article "FLIGHT TEST: Diamond Aircraft DA42 - Sparkling performer,"] July 12, 2004, ''[[FlightGLobal]]'' retrieved December 5, 2022</ref> และในรุ่นก่อนหน้าที่เป็นที่นั่งเดี่ยวอย่าง [[Diamond DA40 Diamond Star]]<ref name="inside_2018_08_01_flyingmag_com" /><ref name="diamond_2020_12_30_avweb_com" /><ref name="powerplant_ch7_phak_faa_gov" />

ในปีต่อ ๆ มา บริษัทอื่นอีกหลายแห่งได้พัฒนาเครื่องยนต์ดีเซลอากาศยาน หรือได้เริ่มต้นที่จะพัฒนา<ref name="powerplant_ch7_phak_faa_gov" /> ที่โดดเด่นที่สุดคือ [[Continental Aerospace Technologies]] ซึ่งใน ค.ศ. 2018 รายงานว่าได้ขายเครื่องยนต์ดังกล่าวไปแล้วกว่า 5,000 ตัวทั่วโลก<ref name="inside_2018_08_01_flyingmag_com" /><ref name="diamond_2020_12_30_avweb_com" /><ref name="certified_jet_a_engines_continental_aero">[https://www.continental.aero/diesel/diesel-engines.aspx "Certified Jet-A Engines,"], [[Continental Aerospace Technologies]], retrieved December 5, 2022</ref>

[[องค์การบริหารการบินแห่งชาติ]]สหรัฐรายงานว่า "ภายใน ค.ศ. 2007 เครื่องบินลูกสูบที่ใช้เชื้อเพลิงไอพ่นหลายรุ่นได้บันทึกชั่วโมงการบินไปแล้วกว่า 600,000 ชั่วโมง"<ref name="powerplant_ch7_phak_faa_gov" /> ในช่วงต้น ค.ศ. 2019 [[สมาคมเจ้าของเครื่องบินและนักบิน|AOPA]] รายงานว่าเครื่องยนต์ดีเซลอากาศยานทั่วไปกำลัง "เข้าสู่เส้นชัย"<ref name="eps_update_2019_01_23_aopa_org">[https://www.aopa.org/news-and-media/all-news/2019/january/23/eps-gives-certification-update-on-diesel-engine ''EPS gives certification update on diesel engine,''], January 23, 2019, [[Aircraft Owners and Pilots Association|AOPA]]. Retrieved November 1, 2019.</ref> ภายในปลาย ค.ศ. 2022 Continental รายงานว่าเครื่องยนต์ที่ใช้เชื้อเพลิง "Jet-A" ของพวกเขาได้มีจำนวนเกิน "2,000 เครื่องที่กำลังใช้งานอยู่ในปัจจุบัน" พร้อมชั่วโมงการบินกว่า "9 ล้านชั่วโมง" และถูก "กำหนดโดย OEM รายใหญ่" สำหรับอากาศยาน [[Cessna Aircraft|Cessna]], [[Piper Aircraft|Piper]],  [[Diamond Aircraft|Diamond]], [[Mooney Aircraft|Mooney]], [[Tecnam Aircraft|Tecnam]], [[Glasair]] และ [[Avions Pierre Robin|Robin]]<ref name="certified_jet_a_engines_continental_aero" />

ในช่วงไม่กี่ปีที่ผ่านมา (ค.ศ. 2016) เครื่องยนต์ดีเซลยังถูกนำมาใช้ในอากาศยานไร้คนขับ (UAV) เนื่องจากความน่าเชื่อถือ ความทนทาน และการกินเชื้อเพลิงต่ำ<ref name="knock_criteria_2017_meininger_doi_org">Rik D Meininger et al.: "Knock criteria for aviation diesel engines", ''International Journal of Engine Research,'' Vol 18, Issue 7, 2017, [https://doi.org/10.1177/1468087416669882 doi/10.1177]</ref><ref name="Arnews2005">{{cite news |title=Army awards 'Warrior' long-range UAV contract |date=2005-08-05 |publisher=Army News Service |url=http://www4.army.mil/news/article.php?story=7722 |url-status=dead |archive-url=https://web.archive.org/web/20070102153829/http://www4.army.mil/news/article.php?story=7722 |archive-date=2 มกราคม 2007  }}</ref><ref name="defenseupdate2006">{{cite news |title= ERMP Extended-Range Multi-Purpose UAV |publisher= Defense Update |date= 2006-11-01 |url= http://www.defense-update.com/products/e/ermpUAV.htm |access-date= 11 May 2007 |archive-url= https://web.archive.org/web/20080513125340/http://www.defense-update.com/products/e/ermpUAV.htm |archive-date= 13 พฤษภาคม 2008 |url-status= dead |df= dmy-all }}</ref>

===เครื่องยนต์ดีเซลนอกถนน===
[[File:Porsche F 218.jpg|thumb|เครื่องยนต์ดีเซลระบายความร้อนด้วยอากาศของ Porsche 218 ปี 1959]]

[[เครื่องยนต์ดีเซลนอกถนน]] (non-road diesel engine) มักใช้กับ[[อุปกรณ์ก่อสร้าง]]และ[[เครื่องจักรเกษตรกรรม]] ประสิทธิภาพการใช้เชื้อเพลิง ความน่าเชื่อถือ และการบำรุงรักษาง่ายเป็นสิ่งสำคัญมากสำหรับเครื่องยนต์ประเภทนี้ ในขณะที่กำลังขับสูงและการทำงานที่เงียบนั้นไม่สำคัญ ดังนั้นการฉีดเชื้อเพลิงเควบคุมด้วยกลไกและการระบายความร้อนด้วยอากาศจึงยังคงเป็นที่นิยมอย่างมาก กำลังขับของเครื่องยนต์ดีเซลนอกถนนนั้นมีความหลากหลายมาก โดยเครื่องยนต์ขนาดเล็กสุดมีกำลังเริ่มต้นที่ 3 กิโลวัตต์ และเครื่องยนต์ที่ทรงพลังที่สุดคือเครื่องยนต์ที่ใช้กับรถบรรทุกหนัก<ref name="Reif_2014_12" />

===เครื่องยนต์ดีเซลอยู่กับที่===
[[File:The National Archives UK - CO 1069-182-9.jpg|thumb|ชุดเครื่องกำเนิดไฟฟ้าดีเซล-อัลเทอร์เนเตอร์ English Electric รุ่น 7SRL จำนวน 3 ตัว กำลังติดตั้งที่สถานีไฟฟ้าซาเตนี; [[แซนซิบาร์]], ค.ศ. 1955]]

เครื่องยนต์ดีเซลอยู่กับที่มักใช้สำหรับผลิตไฟฟ้า แต่ก็ใช้สำหรับขับเคลื่อนคอมเพรสเซอร์ตู้เย็น หรือคอมเพรสเซอร์หรือปั๊มประเภทอื่น ๆ ได้เช่นกัน โดยปกติแล้ว เครื่องยนต์เหล่านี้จะทำงานอย่างต่อเนื่องด้วยภาระเพียงบางส่วน หรือทำงานเป็นช่วง ๆ ด้วยภาระเต็มที่ เครื่องยนต์ดีเซลอยู่กับที่ที่ขับเคลื่อนเครื่องกำเนิดไฟฟ้ากระแสสลับมักทำงานด้วยภาระที่เปลี่ยนแปลง แต่มีความถี่การหมุนคงที่ ทั้งนี้เป็นเพราะความถี่ของระบบสายส่งไฟฟ้าหลักที่คงที่ไว้ที่ 50 Hz (ยุโรป) หรือ 60 Hz (สหรัฐ) ความถี่การหมุนเพลาข้อเหวี่ยงของเครื่องยนต์จึงถูกเลือกให้เป็นพหุคูณของความถี่ของระบบสายส่งหลัก ด้วยเหตุผลทางปฏิบัติ ทำให้ความถี่การหมุนของเพลาข้อเหวี่ยงอยู่ที่ 25 Hz (1500 รอบต่อนาที) หรือ 30 Hz (1800 รอบต่อนาที)<ref name="Tschöke_2018_1066" />

=== เครื่องยนต์ดีเซลพร้อมเพลาข้อเหวี่ยงยืดหยุ่น ===
เครื่องยนต์ดีเซลพร้อมเพลาข้อเหวี่ยงยืดหยุ่น (flexible crankshaft) หมายถึงเครื่องยนต์สันดาปภายในที่เพลาข้อเหวี่ยงแสดงคุณสมบัติความยืดหยุ่นในระดับหนึ่ง เนื่องจากความเค้นจากการทำงาน ค่าความคลาดเคลื่อนในการผลิต และสมบัติของวัสดุ ต่างจากเพลาข้อเหวี่ยงแข็งเกร็งโดยสมบูรณ์ เพลาข้อเหวี่ยงยืดหยุ่นจะเกิดการเปลี่ยนรูปทรงแบบไดนามิกอันเนื่องมาจากแรงจากการเผาไหม้ที่เป็นวัฏจักร แรงเฉื่อย และผลกระทบจากการหล่อลื่น ซึ่งอาจนำไปสู่การเคลื่อนที่แบบไม่สมมาตรและแรงสั่นสะเทือน ความยืดหยุ่นนี้สามารถส่งผลกระทบต่อประสิทธิภาพเครื่องยนต์โดยมีอิทธิพลต่อภาระของรองลื่น การกระจายของชั้นฟิล์มน้ำมันหล่อลื่น และการสึกหรอทางกลไก ซึ่งอาจลดประสิทธิภาพและอายุการใช้งานได้ เทคนิคการสร้างแบบจำลองขั้นสูง เช่น การวิเคราะห์ไฟไนต์เอลิเมนต์ (Finite Element Analysis - FEA) และพลศาสตร์หลายส่วน (Multi-Body Dynamics - MBD) ถูกนำมาใช้เพื่อทำนายและลดผลกระทบเหล่านี้ ซึ่งช่วยให้สามารถออกแบบเครื่องยนต์ได้ดีขึ้น เพิ่มประสิทธิภาพการใช้เชื้อเพลิง และเพิ่มความทนทาน ความยืดหยุ่นของเพลาข้อเหวี่ยงจะลดอัตราการไหลของมวลอากาศที่เข้าสู่กระบอกสูบ ซึ่งส่งผลให้อัตราการปล่อยไอเสียอย่าง CO สูงขึ้นอย่างไม่พึงประสงค์<ref>{{Cite journal |last1=Elmoselhy |first1=Salah A. M. |last2=Faris |first2=Waleed F. |last3=Rakha |first3=Hesham A. |date=2021-02-26 |title=Validated Analytical Modeling of Diesel Engines Intake Manifold with a Flexible Crankshaft |journal=Energies |language=en |volume=14 |issue=5 |pages=1287 |doi=10.3390/en14051287 |doi-access=free |issn=1996-1073|hdl=10919/102459 |hdl-access=free }}</ref>

== การพัฒนาในอนาคต ==
ในวรรณกรรมช่วงกลางทศวรรษ 2010 เป้าหมายหลักในการพัฒนาเครื่องยนต์ดีเซลในอนาคตถูกอธิบายว่าเป็นการปรับปรุงการปล่อยไอเสีย การลดการกินเปลืองเชื้อเพลิง และการเพิ่มอายุการใช้งาน (2014)<ref name="Merker_2014_58" /><ref name="Reif_2014_11" /> มีการกล่าวกันว่าเครื่องยนต์ดีเซล โดยเฉพาะเครื่องยนต์ดีเซลสำหรับรถเพื่อการพาณิชย์ จะยังคงเป็นขุมพลังสำคัญที่สุดสำหรับยานยนต์ไปจนถึงกลางทศวรรษ 2030 บรรณาธิการบางคนสันนิษฐานว่าความซับซ้อนของเครื่องยนต์ดีเซลจะเพิ่มขึ้นอีก (2014)<ref name="Merker_2014_273" /> บรรณาธิการบางคนคาดว่าในอนาคตหลักการทำงานของเครื่องยนต์ดีเซลและ[[เครื่องยนต์ออตโต]]จะมาบรรจบกันเนื่องจากพัฒนาการของเครื่องยนต์ออตโตที่ก้าวไปสู่[[การจุดระเบิดด้วยการอัดประจุเนื้อเดียวกัน]] (2017)<ref name="Stan_2017_252" />

