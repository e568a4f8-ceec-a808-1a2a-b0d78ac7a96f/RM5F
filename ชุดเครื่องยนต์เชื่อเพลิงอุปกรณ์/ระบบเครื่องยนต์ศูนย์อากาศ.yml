* 1894: 18 มกราคม หลังการปรับปรุงเครื่องยนต์ต้นแบบตัวแรกให้เป็นเครื่องยนต์ต้นแบบตัวที่สอง การทดสอบด้วยเครื่องต้นแบบตัวที่สองก็เริ่มต้นขึ้น<ref name="Diesel_1913_17" />
* 1894: 17 กุมภาพันธ์ เครื่องยนต์ต้นแบบตัวที่สองทำงานได้เป็นครั้งแรก<ref name="Diesel_1913_22" />
* 1895: 30 มีนาคม ดีเซิลยื่นขอสิทธิบัตร (RP 86633) สำหรับกระบวนการสตาร์ตเครื่องยนต์ด้วยอากาศอัด<ref name="Diesel_1913_38" />
* 1895: 26 มิถุนายน เครื่องยนต์ต้นแบบตัวที่สองผ่านการทดสอบด้วยเบรกเป็นครั้งแรก<ref name="Tschöke_2018_6" />
