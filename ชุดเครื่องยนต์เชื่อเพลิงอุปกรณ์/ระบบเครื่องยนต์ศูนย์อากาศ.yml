* 1925: บริษัท Sendling เริ่มผลิตรถแทรกเตอร์การเกษตรที่ใช้เครื่องยนต์ดีเซลออกสู่ตลาดเป็นจำนวนมาก<ref name="Sass_1962_644" />
* 1927: บริษัท [[บ๊อช|Bosch]] เปิดตัวปั๊มตัวฉีดแถวเรียง (inline injection pump) ตัวแรกสำหรับเครื่องยนต์ดีเซลในยานยนต์<ref name="Reif_2014_31" />
* 1929: รถยนต์นั่งคันแรกที่ใช้เครื่องยนต์ดีเซลได้ปรากฏขึ้น เครื่องยนต์ของรถคันนี้เป็นเครื่องยนต์ออตโตที่ถูกดัดแปลงให้ใช้หลักการของดีเซิลและติดตั้งปั๊มตัวฉีด Bosch หลังจากนั้นก็มีรถยนต์ต้นแบบดีเซลอื่น ๆ ตามมาอีกหลายรุ่น<ref name="vFersen_1986_274" />
==== ทศวรรษ 1930 ====
* 1933: บริษัท [[Junkers Motorenwerke]] ในเยอรมนี เริ่มผลิตเครื่องยนต์ดีเซลอากาศยานที่ประสบความสำเร็จสูงสุดในประวัติศาสตร์ [[Jumo 205]] ซึ่งเมื่อ[[สงครามโลกครั้งที่สอง]]เริ่มต้นขึ้น มีการผลิตออกมาแล้วกว่า 900 ตัว โดยมีพิกัดกำลังขณะบินขึ้นที่ 645 กิโลวัตต์<ref name="Reif_2012_103" />
* 1933: บริษัท General Motors ใช้เครื่องยนต์ดีเซลสองจังหวะ Winton 201A รุ่นใหม่ที่มี roots-blown และหัวฉีดรวมเพื่อขับเคลื่อนนิทรรศการสายการผลิตรถยนต์ในงานชิคาโกเวิล์ดแฟร์ (''[[A Century of Progress]]'')<ref name="EuDaly_2016_160" /> เครื่องยนต์รุ่นนี้มีให้เลือกหลายขนาดตั้งแต่ 600-900 แรงม้า (447–671 กิโลวัตต์)<ref name="Kremser_1942_24" />
* 1934: บริษัท [[Budd Company|Budd]] สร้างรถไฟโดยสารดีเซล-ไฟฟ้าขบวนแรกในสหรัฐ ชื่อว่า ''[[Pioneer Zephyr]]'' ''9900'' โดยใช้เครื่องยนต์วินตัน<ref name="EuDaly_2016_160" />
* 1935: รถยนต์ [[Citroën Rosalie]] ได้รับการติดตั้งเครื่องยนต์ดีเซล[[ห้องหมุนวน]]รุ่นแรก ๆ เพื่อวัตถุประสงค์ในการทดสอบ<ref name="Cole_2014_64" /> ขณะที่ [[ไดม์เลอร์ อาเก|Daimler-Benz]] เริ่มผลิตเครื่องยนต์ [[Mercedes-Benz OM 138]] ซึ่งเป็นเครื่องยนต์ดีเซลสำหรับรถยนต์นั่งผลิตจำนวนมากตัวแรก และเป็นหนึ่งในเครื่องยนต์ดีเซลสำหรับรถยนต์นั่งเพียงไม่กี่รุ่นในยุคนั้นที่ประสบความสำเร็จในเชิงพาณิชย์ โดยมีกำลัง 45 แรงม้า (33 กิโลวัตต์)<ref name="Kremser_1942_125" />
* 1936: 4 มีนาคม เรือเหาะ [[เอ็ลเซ็ท 129 ฮินเดินบวร์ค|LZ 129 Hindenburg]] อากาศยานขนาดใหญ่ที่สุดเท่าที่เคยสร้างมา ได้ทะยานขึ้นเป็นครั้งแรก โดยขับเคลื่อนด้วยเครื่องยนต์ดีเซล V16 Daimler-Benz LOF 6 จำนวน 4 ตัว แต่ละตัวมีกำลัง 1,200 แรงม้า (883 กิโลวัตต์)<ref name="Waibel_2016_159" />
* 1936: เริ่มผลิตรถยนต์นั่งผลิตจำนวนมากรุ่นแรกที่ใช้เครื่องยนต์ดีเซล ([[Mercedes-Benz 260 D]])<ref name="vFersen_1986_274" />
* 1937: [[คอนสแตนติน ฟีโอโดโรวิช เชลปัน]] ได้พัฒนาเครื่องยนต์ดีเซล [[Kharkiv Model V-2|V-2]] ซึ่งต่อมาถูกนำไปใช้ในรถถังโซเวียต [[ที-34|T-34]] ที่ได้รับการยอมรับอย่างกว้างขวางว่าเป็นรถถังที่มีแชสซีดีที่สุดในสงครามโลกครั้งที่สอง<ref name="Tucker-Jones_2015_36" />
* 1938: บริษัท [[เจเนรัลมอเตอร์|General Motors]] ก่อตั้งแผนก GM Diesel ซึ่งต่อมาเปลี่ยนชื่อเป็น [[Detroit Diesel]] และเปิดตัวเครื่องยนต์สองจังหวะรอบสูงกำลังปานกลาง[[เครื่องยนต์สูบเรียง|สูบเรียง]] [[Series 71]] ที่เหมาะสำหรับรถยนต์บนถนนและการใช้งานทางทะเล<ref name="FleetOwner_1964_107" />
==== ทศวรรษ 1940 ====
* 1946: [[เคลสซี คัมมินส์]] ได้รับสิทธิบัตรสำหรับ ''ตัวป้อนและฉีดเชื้อเพลิงสำหรับเครื่องยนต์เผาไหม้น้ำมัน'' ที่ประกอบด้วยส่วนประกอบแยกกันสำหรับสร้างแรงดันการฉีดและกำหนดจังหวะการฉีด<ref name="Cummins_1946" />
* 1946: บริษัท [[Klöckner-Humboldt-Deutz]] (KHD) นำเครื่องยนต์ดีเซลระบายความร้อนด้วยอากาศผลิตจำนวนมากออกสู่ตลาด<ref name="Flatz_1946" />
==== ทศวรรษ 1950 ====
[[File:ZT 303 Motor.jpg|thumb|ลูกสูบของเครื่องยนต์ดีเซลห้องเผาไหม้ทรงกลมตรงกลาง MAN [[M-System]] ([[4 VD 14,5/12-1 SRW]])]]
* 1950: [[Klöckner-Humboldt-Deutz|KHD]] กลายเป็นผู้นำตลาดเครื่องยนต์ดีเซลระบายความร้อนด้วยอากาศของโลก<ref name="Tschöke_2018_666" />
* 1951: เจ. ซีกฟรีด เมอเรอร์  ได้รับสิทธิบัตร ''[[M-System]]'' การออกแบบห้องเผาไหม้ทรงกลมตรงกลางลูกสูบ (DBP 865683)<ref name="MAN_465" />
* 1953: เครื่องยนต์ดีเซลรถยนต์นั่งแบบฉีดเข้า[[ระบบฉีดเชื้อเพลิงอ้อม#ห้องหมุนวน|ห้องหมุนวน]]รุ่นแรกที่ผลิตในเชิงพาณิชย์ (Borgward/Fiat)<ref name="Tschöke_2018_10" />
* 1954: Daimler-Benz เปิดตัวเครื่องยนต์ [[Mercedes-Benz OM 312|Mercedes-Benz OM 312 A]] เครื่องยนต์ดีเซลอุตสาหกรรมหกสูบเรียงขนาด 4.6 ลิตรพร้อมเทอร์โบชาร์จเจอร์ ให้กำลัง 115 แรงม้า (85 กิโลวัตต์) แต่พิสูจน์แล้วว่าไม่น่าเชื่อถือ<ref name="Daimler_2009_2" />
* 1954: [[วอลโว่|Volvo]] ผลิตเครื่องยนต์ TD 96 เทอร์โบชาร์จจำนวน 200 เครื่อง เครื่องยนต์ขนาด 9.6 ลิตรนี้ให้กำลัง 185 แรงม้า (136 กิโลวัตต์)<ref name="vFersen_1987_156" />
* 1955: การใช้เทอร์โบชาร์จสำหรับเครื่องยนต์ดีเซลทางทะเลสองจังหวะของ MAN กลายเป็นมาตรฐาน<ref name="Mau_1984_17" />
* 1959: รถยนต์ [[Peugeot 403]] กลายเป็นรถเก๋งที่ผลิตในเชิงพาณิชย์นอก[[เยอรมนีตะวันตก]]คันแรกที่มีตัวเลือกเครื่องยนต์ดีเซล<ref name="Peugeot403gazole">{{Cite web |last=Andrew Roberts |date=10 กรกฎาคม 2007 |title=Peugeot 403 |url=https://www.independent.co.uk/life-style/motoring/features/peugeot-403-5529921.html |access-date=28 กุมภาพันธ์ 2019 |website=The 403, launched half a century ago, established Peugeot as a global brand. |publisher=[[The Independent]], [[London]]}}</ref>

==== ทศวรรษ 1960 ====
[[File:OM 352.jpg|thumb|[[Mercedes-Benz OM352 engine|Mercedes-Benz OM 352]] หนึ่งในเครื่องยนต์ดีเซลฉีดตรงรุ่นแรก ๆ ของ Mercedes-Benz เปิดตัวใน ค.ศ. 1963 แต่การผลิตจำนวนมากเพิ่งเริ่มในฤดูร้อน ค.ศ. 1964<ref name="Vogler_2016_34" />]]
* 1964: ฤดูร้อน Daimler-Benz เปลี่ยนจาก[[ระบบฉีดเชื้อเพลิงอ้อม#ห้องเผาไหม้ช่วย|การฉีดเข้าห้องเผาไหม้ช่วย]]มาเป็นการฉีดตรงแบบควบคุมด้วยเกลียว<ref name="Daimler_2009" /><ref name="MAN_465" />
* 1962–65: [[ระบบเบรกกำลังอัดดีเซล]] (diesel compression braking system) ซึ่งในที่สุดผลิตโดยบริษัท [[Jacobs Manufacturing Company|Jacobs Manufacturing]] และมีชื่อเล่นว่า "Jake Brake" ได้ถูกคิดค้นและจดสิทธิบัตรโดยเคลสซี คัมมินส์<ref name="Cummins_1965" />

==== ทศวรรษ 1970 ====
* 1972: KHD เปิดตัวระบบ [[AD-System]] (''Allstoff-Direkteinspritzung'') หรือการฉีดตรง "ทุกเชื้อเพลิง" สำหรับเครื่องยนต์ดีเซลของตน เครื่องยนต์ดีเซลที่ใช้ระบบ AD สามารถทำงานได้ด้วยเชื้อเพลิงเหลวแทบทุกชนิด แต่มีการติดตั้งหัวเทียนเสริมที่จะทำงานหากคุณภาพการจุดระเบิดของเชื้อเพลิงต่ำเกินไป<ref name="vBasshuysen_2017_24" />
* 1976: การพัฒนาการฉีดแบบ[[คอมมอนเรล]] (common rail) เริ่มต้นขึ้นที่[[สถาบันเทคโนโลยีแห่งสหพันธ์สวิส ซือริช]] (ETH Zürich)<ref name="vBasshuysen_2017_141" />
* 1976: [[Volkswagen Golf Mk1#Golf Diesel|Volkswagen Golf]] กลายเป็นรถยนต์นั่งขนาดเล็กรุ่นแรกที่มีเครื่องยนต์ดีเซลให้เลือก<ref name="GoDilautSpiegel401976">{{Cite magazine |date=27 กันยายน 1976 |title=Blauer Rauch |url=http://www.spiegel.de/spiegel/print/d-41136373.html |magazine=Der VW-Konzern präsentiert seine neuesten Golf-Variante – den ersten Wolfsburger Personenwagen mit Dieselmotor. |publisher=[[Der Spiegel]] (online) |volume=40/1976 |access-date=28 กุมภาพันธ์ 2019}}</ref><ref name="GoDivolgensGA">{{Cite web |last=Georg Auer |date=21 พฤษภาคม 2001 |title=How Volkswagen built a diesel dynasty |url=https://europe.autonews.com/article/20010521/ANE/105210844/how-volkswagen-built-a-diesel-dynasty |access-date=28 กุมภาพันธ์ 2019 |website=Automotive News Europe |publisher=Crain Communications, Inc., Detroit MI}}</ref>
* 1978: Daimler-Benz ผลิตเครื่องยนต์ดีเซลสำหรับรถยนต์นั่งรุ่นแรกที่มีเทอร์โบชาร์จเจอร์ ([[เครื่องยนต์เมอร์เซเดส-เบนซ์ โอเอ็ม617|เครื่องยนต์ Mercedes-Benz OM617]])<ref name="Merker_2014_179" />
* 1979:  มีการสร้างต้นแบบเครื่องยนต์ครอสเฮด (crosshead) สองจังหวะรอบต่ำตัวแรกที่ใช้การฉีดแบบคอมมอนเรล<ref name="Merker_2014_276" />

==== ทศวรรษ 1980 ====
* 1981/82: การไล่ไอเสียไหลทางเดียวสำหรับเครื่องยนต์ดีเซลทางทะเลสองจังหวะกลายเป็นมาตรฐาน<ref name="Mau_1984_16" />
* 1982: สิงหาคม Toyota เปิดตัว[[ชุดควบคุมเครื่องยนต์]] (ECU) ควบคุมด้วยไมโครโพรเซสเซอร์สำหรับเครื่องยนต์ดีเซลสู่ตลาดญี่ปุ่น<ref name="Kawai Miyagi Nakano Kondo 1985 pp. 289–293">{{cite journal | last1=Kawai | first1=Mitsuo | last2=Miyagi | first2=Hideo | last3=Nakano | first3=Jiro | last4=Kondo | first4=Yoshihiko | title=Toyota's New Microprocessor-Based Diesel Engine Control System for Passenger Cars | journal=IEEE Transactions on Industrial Electronics | volume=IE-32 | issue=4 | date=1985 | issn=0278-0046 | doi=10.1109/TIE.1985.350099 | pages=289–293}}</ref>
* 1985: ธันวาคม มีการทดสอบการฉีดคอมมอนเรลสำหรับรถบรรทุกบนถนนโดยใช้เครื่องยนต์ 6VD 12,5/12 GRF-E ที่ดัดแปลงในรถ [[IFA W50]]<ref name="Diehl_2013_100" />
* 1987: Daimler-Benz เปิดตัวปั๊มตัวฉีดควบคุมด้วยอิเล็กทรอนิกส์สำหรับเครื่องยนต์ดีเซลรถบรรทุก<ref name="Tschöke_2018_10" />
* 1988:  [[Fiat Croma]] กลายเป็นรถยนต์นั่งผลิตจำนวนมากคันแรกของโลกที่มีเครื่องยนต์ดีเซล[[ระบบฉีดเชื้อเพลิง#ระบบฉีดตรง|ฉีดตรง]]<ref name="Tschöke_2018_10" />
* 1989: [[Audi 100]] เป็นรถยนต์นั่งคันแรกของโลกที่มีเครื่องยนต์ดีเซลเทอร์โบอินเตอร์คูลเลอร์ ฉีดตรง และควบคุมด้วยอิเล็กทรอนิกส์<ref name="Tschöke_2018_10" /> มี [[ความดันยังผลเฉลี่ย|BMEP]] (ความดันประสิทธิเฉลี่ยสำหรับแรงม้าเพลา) 1.35 เมกะปาสกาล และ [[การกินเชื้อเพลิงจำเพาะสำหรับแรงม้าเพลา|BSFC]] (การกินเชื้อเพลิงจำเพาะสำหรับแรงม้าเพลา) 198 กรัม/(กิโลวัตต์·ชั่วโมง) <ref name="Stock Bauder 1990 p. 87">{{cite conference | last1=Stock | first1=Dieter | last2=Bauder | first2=Richard | title=SAE Technical Paper Series | chapter=The New Audi 5-Cylinder Turbo Diesel Engine: The First Passenger Car Diesel Engine with Second Generation Direct Injection | date=1990-02-01 | volume=1 | doi=10.4271/900648 | page=87}}</ref>

==== ทศวรรษ 1990 ====
* 1992: 1 กรกฎาคม มาตรฐานไอเสีย [[Euro 1]] มีผลบังคับใช้<ref name="Reif_2014_182" />
* 1993: เครื่องยนต์ดีเซลรถยนต์นั่งตัวแรกที่มีสี่ลิ้นต่อหนึ่งสูบคือ Mercedes-Benz OM 604<ref name="Merker_2014_179" />
* 1994: ระบบหัวฉีดรวมโดยบริษัท Bosch สำหรับเครื่องยนต์ดีเซลของรถบรรทุก<ref name="Reif_2012_271" />
* 1996: เครื่องยนต์ดีเซลตัวแรกที่มีการฉีดตรงและสี่ลิ้นต่อหนึ่งสูบใช้ในรถยนต์ [[Opel Vectra]]<ref name="Zhao_2009_8" /><ref name="Tschöke_2018_10" />
* 1996: ปั๊มตัวฉีดแบบจานจ่ายลูกสูบแฉกดาวรุ่นแรกโดยบริษัท Bosch<ref name="Reif_2012_271" />
* 1997: เครื่องยนต์ดีเซล[[คอมมอนเรล]]ผลิตจำนวนมากรุ่นแรกสำหรับรถยนต์นั่งคือ Fiat 1.9 JTD<ref name="Tschöke_2018_10" /><ref name="Merker_2014_179" />
* 1998: รถยนต์ [[BMW E36]] ที่ได้รับการดัดแปลงสามารถชนะการแข่งขัน [[24 Hours Nürburgring]] รถคันนี้มีชื่อว่า 320d ใช้เครื่องยนต์ดีเซลสี่สูบเรียงขนาด 2 ลิตรพร้อมการฉีดตรงและปั๊มตัวฉีดแบบจานจ่ายควบคุมด้วยเกลียว (Bosch VP 44) ให้กำลัง 180 กิโลวัตต์ (240 แรงม้า) การกินเปลืองเชื้อเพลิงอยู่ที่ 23 ลิตร/100 กิโลเมตร ใช้เพียงครึ่งหนึ่งของรถยนต์ที่ใช้เครื่องยนต์ออตโต (เบนซิน) ที่มีสมรรถนะใกล้เคียงกัน<ref name="Reif_2012_223" />
* 1998: [[ฟ็อลคส์วาเกิน|Volkswagen]] เปิดตัวเครื่องยนต์ [[VW EA188 Pumpe-Düse]] (1.9 TDI) พร้อม[[ตัวฉีดรวม]]ควบคุมด้วยอิเล็กทรอนิกส์พัฒนาโดย Bosch<ref name="Merker_2014_179" />
* 1999: Daimler-Chrysler นำเสนอเครื่องยนต์ดีเซลสามสูบคอมมอนเรลตัวแรกในรถยนต์นั่ง ([[Smart City Coupé]])<ref name="Tschöke_2018_10" />

==== ทศวรรษ 2000 ====
[[File:Neckarsulm-AudiForum-Audi-R10-TDI.jpg|thumb|Audi R10 TDI ผู้ชนะการแข่งขัน 2006 24 Hours of Le Mans]]
* 2000: [[เปอโยต์|Peugeot]] เปิดตัวตัวกรองอนุภาคดีเซล (diesel particulate filter) สำหรับรถยนต์นั่ง<ref name="Tschöke_2018_10" /><ref name="Merker_2014_179" />
* 2002: เทคโนโลยีตัวฉีด[[ไพอีโซอิเล็กทริก]]โดย<ref name="Egger_2002" />
* 2003: เทคโนโลยีตัวฉีดไพอีโซอิเล็กทริกโดย Bosch<ref name="Speck_2005" /> และ Delphi<ref name="TheEngineer_2003" />
* 2004: BMW เปิดตัวระบบเทอร์โบชาร์จสองขั้น (dual-stage turbocharging) ด้วยเครื่องยนต์ [[BMW M57]]<ref name="Merker_2014_179" />
* 2006: เครื่องยนต์ดีเซลที่ทรงพลังที่สุดในโลก [[Wärtsilä-Sulzer RTA96-C]] ถูกผลิตขึ้น มีกำลัง 80,080 กิโลวัตต์<ref name="Tschöke_2018_1110" />
* 2006: [[Audi R10 TDI]] ซึ่งติดตั้งเครื่องยนต์ V12-TDI ขนาด 5.5 ลิตร กำลัง 476 กิโลวัตต์ (638 แรงม้า) คว้าแชมป์การแข่งขัน [[2006 24 Hours of Le Mans]]<ref name="Tschöke_2018_10" />
* 2006: Daimler-Chrysler เปิดตัวเครื่องยนต์สำหรับรถยนต์นั่งผลิตจำนวนมากตัวแรกที่ใช้การบำบัดไอเสียด้วย[[การรีดิวซ์เร่งปฏิกิริยาแบบเลือก]] (selective catalytic reduction) [[Mercedes-Benz OM 642]] และเป็นไปตามมาตรฐานไอเสีย Tier2Bin8 อย่างสมบูรณ์<ref name="Merker_2014_179" />
* 2008: Volkswagen เปิดตัว[[ตัวดูดกลืน NOx|ตัวเร่งปฏิกิริยา LNT]] สำหรับเครื่องยนต์ดีเซลในรถยนต์นั่งด้วย[[List of Volkswagen Group diesel engines#EA189|เครื่องยนต์ VW 2.0 TDI]]<ref name="Merker_2014_179" />
* 2008: Volkswagen เริ่มการผลิตเครื่องยนต์ดีเซลสำหรับรถยนต์นั่งที่ใหญ่ที่สุด Audi 6-litre V12 TDI<ref name="Merker_2014_179" />
* 2008: [[ซูบารุ|Subaru]] เปิดตัวเครื่องยนต์ดีเซลสูบนอนชน (horizontally opposed diesel engine) ตัวแรกที่ติดตั้งในรถยนต์นั่ง โดยเป็นเครื่องยนต์คอมมอนเรลขนาด 2 ลิตร กำลัง 110 กิโลวัตต์<ref name="Zhao_2009_45" />

==== ทศวรรษ 2010 ====
* 2010: [[มิตซูบิชิ มอเตอร์ส|Mitsubishi]] พัฒนาและเริ่มผลิตเครื่องยนต์ดีเซลสำหรับรถยนต์นั่ง [[เครื่องยนต์มิตซูบิชิ 4N1|4N13]] 1.8 ลิตร DOHC I4 เครื่องยนต์ดีเซลตัวแรกของโลกที่ใช้[[การตั้งจังหวะเปิดปิดลิ้นแปรผัน|ระบบลิ้นแปรผัน]] (variable valve timing)<ref name="Long_2013" />
* 2012: BMW เปิดตัวเทอร์โบชาร์จสองขั้นพร้อมเทอร์โบชาร์จเจอร์สามตัวสำหรับเครื่องยนต์ [[BMW N57]]<ref name="Merker_2014_179" />
* 2015: เปิดตัวระบบ[[คอมมอนเรล]]ที่ทำงานด้วยความดัน 2,500 บาร์<ref name="Tschöke_2018_10" />
* 2015: ใน[[เรื่องอื้อฉาวการปล่อยไอเสียของ Volkswagen]] [[สำนักงานคุ้มครองสิ่งแวดล้อมสหรัฐ]] (US EPA) ออกประกาศการละเมิด[[รัฐบัญญัติอากาศสะอาด (สหรัฐ)|รัฐบัญญัติอากาศสะอาด]]ต่อ [[ฟ็อลคส์วาเกินกรุ๊ป|Volkswagen Group]] หลังพบว่า Volkswagen จงใจตั้งโปรแกรมเครื่องยนต์ดีเซลเทอร์โบฉีดตรง (TDI) ให้เปิดใช้งานการควบคุม[[ไอเสีย]]บางอย่างเฉพาะในระหว่าง[[การทดสอบไอเสีย]]ในห้องปฏิบัติการ<ref name="Jordans_2015" /><ref name="EPA_2015" /><ref name="NPR_2015" /><ref name="Spiegel_2015" />

== หลักการทำงาน ==
=== ภาพรวม ===
คุณลักษณะของเครื่องยนต์ดีเซลมีดังนี้:<ref name="Pischinger_2016_348" />
* ใช้[[การจุดระเบิดด้วยการอัด]] (compression ignition) แทนการใช้เครื่องสำเร็จจุดระเบิด เช่น [[หัวเทียน]]
* การผสมเชื้อเพลิงภายใน ในเครื่องยนต์ดีเซล สารผสมของอากาศกัยเชื้อเพลิงจะเกิดขึ้นภายในห้องเผาไหม้เท่านั้น
* การควบคุมแรงบิดคุณภาพ (quality torque control) ปริมาณแรงบิดที่เครื่องยนต์ดีเซลสร้างขึ้นไม่ได้ถูกควบคุมโดยการลดอากาศเข้า (ต่างจากเครื่องยนต์เบนซินจุดระเบิดด้วยประกายไฟทั่วไป ซึ่งลดอากาศไหลเพื่อควบคุมแรงบิดที่ผลิต) แต่ปริมาตรของอากาศที่เข้าสู่เครื่องยนต์จะถูกทำให้มากที่สุดตลอดเวลา และผลผลิตแรงบิดจะถูกควบคุมโดยการควบคุมปริมาณเชื้อเพลิงที่ฉีดเข้าไปเพียงอย่างเดียว
* [[อัตราส่วนอากาศต่อเชื้อเพลิง]]สูง เครื่องยนต์ดีเซลทำงานที่อัตราส่วนอากาศต่อเชื้อเพลิงโดยรวมที่บางกว่า[[อัตราส่วนปริมาณสัมพันธ์]] (stoichiometric ratio) อย่างมีนัยสำคัญ
* [[เปลวไฟแบบแพร่กระจาย]] (diffusion flame) ในระหว่างการเผาไหม้ ออกซิเจนจะต้องแพร่เข้าไปในเปลวไฟก่อน แทนที่จะมีออกซิเจนและเชื้อเพลิงผสมกันอยู่แล้วก่อนการเผาไหม้ ซึ่งจะทำให้เกิด[[เปลวไฟแบบผสมล่วงหน้า]] (premixed flame)
* สารผสมอากาศกับเชื้อเพลิง[[วิวิธพันธุ์|ไม่เป็นเนื้อเดียวกัน]] ในเครื่องยนต์ดีเซล ไม่มีการกระจายตัวของเชื้อเพลิงและอากาศอย่างสม่ำเสมอภายในกระบอกสูบ นั่นเป็นเพราะกระบวนการเผาไหม้จะเริ่มขึ้นเมื่อสิ้นสุดระยะการฉีด ก่อนสารผสมอากาศกับเชื้อเพลิงที่เป็นเนื้อเดียวกันจะสามารถก่อตัวขึ้นได้
* คุณสมบัติเชื้อเพลิงที่ต้องการ คือ ประสิทธิภาพการจุดระเบิดสูง ([[เลขซีเทน]]) แทนที่จะเป็นคุณสมบัติต้านทานการน็อกสูง ([[เลขออกเทน]]) ซึ่งเป็นที่ต้องการสำหรับเครื่องยนต์เบนซิน
=== วัฏจักรเทอร์โมไดนามิกส์ ===
[[File:Model Engine Luc Viatour.jpg|thumb|แบบจำลองเครื่องยนต์ดีเซล ด้านซ้าย]]
[[File:Model Engine B Luc Viatour.jpg|thumb|แบบจำลองเครื่องยนต์ดีเซล ด้านขวา]]
{{See also|วัฏจักรดีเซล|เครื่องยนต์สันดาปภายใน#เครื่องยนต์ลูกสูบ{{!}}เครื่องยนต์สันดาปภายในลูกสูบ}}

เครื่องยนต์สันดาปภายในดีเซลต่างจากเครื่องยนต์ที่ใช้น้ำมันเบนซินแบบ[[วัฏจักรออตโต]]โดยใช้อากาศร้อนที่ถูกอัดด้วยความดันสูงในการจุดระเบิดเชื้อเพลิงแทนการใช้หัวเทียน (เป็น ''การจุดระเบิดด้วยการอัด'' แทน ''การจุดระเบิดด้วยประกายไฟ'')

ในเครื่องยนต์ดีเซล ในตอนแรกจะมีเพียงแค่อากาศเท่านั้นที่ถูกนำเข้าสู่ห้องเผาไหม้ จากนั้นอากาศจะถูกอัดด้วยอัตราส่วนการอัดระหว่าง 15:1 ถึง 23:1 การอัดที่สูงนี้ทำให้อุณหภูมิอากาศสูงขึ้น เมื่อลูกสูบเคลื่อนที่ขึ้นไปเกือบถึงจุดสูงสุดของจังหวะอัด เชื้อเพลิงจะถูกฉีดเข้าไปในอากาศที่ถูกอัดในห้องเผาไหม้โดยตรง ซึ่งอาจเป็นการฉีดเข้าไปในช่องโล่ง (โดยทั่วไปจะเป็นรูป[[ห่วงยาง]]) ที่อยู่ด้านบนของลูกสูบหรือใน ''ห้องเผาไหม้ช่วย'' ขึ้นอยู่กับการออกแบบเครื่องยนต์ ตัวฉีดเชื้อเพลิงจะช่วยให้เชื้อเพลิงแตกตัวออกเป็นละอองเล็ก ๆ และกระจายเชื้อเพลิงได้อย่างทั่วถึง ความร้อนของอากาศที่ถูกอัดจะทำให้เชื้อเพลิงที่ผิวของละอองระเหยเป็นไอ จากนั้นไอน้ำมันจะถูกจุดระเบิดด้วยความร้อนจากอากาศที่ถูกอัดในห้องเผาไหม้ ส่วนละอองที่เหลือจะยังคงระเหยจากผิวและเผาไหม้ไปเรื่อย ๆ จนมีขนาดเล็กลง จนกระทั่งเชื้อเพลิงทั้งหมดในละอองนั้นถูกเผาไหม้ การเผาไหม้จะเกิดขึ้นภายใต้ความดันที่ค่อนข้างคงตัวในช่วงเริ่มต้นของจังหวะกำลัง การเริ่มต้นระเหยของเชื้อเพลิงทำให้เกิดการหน่วงเวลาก่อนการจุดระเบิดและเป็นที่มาของเสียงเคาะ (knocking) เฉพาะของเครื่องยนต์ดีเซลเนื่องจากไอน้ำมันถึงจุดติดไฟและทำให้ความดันเหนือลูกสูบเพิ่มขึ้นอย่างกะทันหัน (ไม่แสดงในแผนภาพดัชนี P-V) เมื่อการเผาไหม้เสร็จสมบูรณ์ แก๊สจากการเผาไหม้จะขยายตัวเมื่อลูกสูบเคลื่อนที่ลงต่อไป ความดันสูงในกระบอกสูบจะดันลูกสูบลงด้านล่าง เพื่อส่งกำลังไปยัง[[เพลาข้อเหวี่ยง]]

นอกจากระดับการอัดที่สูงซึ่งทำให้เกิดการเผาไหม้ได้โดยไม่ต้องใช้ระบบจุดระเบิดแยกต่างหากแล้ว [[อัตราส่วนการอัด]]ที่สูงยังช่วยเพิ่มประสิทธิภาพของเครื่องยนต์ได้อย่างมากอีกด้วย การเพิ่มอัตราส่วนการอัดในเครื่องยนต์จุดระเบิดด้วยประกายไฟซึ่งมีการผสมเชื้อเพลิงและอากาศก่อนเข้าสู่กระบอกสูบนั้นมีข้อจำกัด เนื่องจากจำเป็นต้องป้องกัน[[การชิงจุดระเบิด]] (pre-ignition) ซึ่งจะทำให้เครื่องยนต์เสียหายได้ แต่เนื่องจากในเครื่องยนต์ดีเซลจะมีการอัดอากาศเพียงอย่างเดียว และเชื้อเพลิงจะไม่ถูกฉีดเข้าไปในกระบอกสูบจนกว่าจะถึงช่วงก่อนจุดศูนย์ตายบน ([[ศูนย์ตาย|TDC]]) เล็กน้อย การระเบิดรุนแรงก่อนเวลาจึงไม่ใช่ปัญหาและทำให้อัตราส่วนการอัดของเครื่องยนต์ดีเซลสูงกว่ามาก

[[File:DieselCycle PV.svg|thumb|right|แผนภาพ pV สำหรับวัฏจักรดีเซลในอุดมคติ (ซึ่งตามทิศทางตามเข็มนาฬิกาโดยมีหมายเลข 1–4) โดยแกนนอนคือปริมาตรกระบอกสูบ ในวัฏจักรดีเซล การเผาไหม้จะเกิดขึ้นที่ความดันคงตัวเกือบตลอดเวลา บนแผนภาพนี้ งานที่เกิดขึ้นในแต่ละวัฏจักรจะสอดคล้องกับพื้นที่ภายในวงรอบ (loop)]]
[[แผนภาพความดัน—ปริมาตร]] (pV) เป็นการแสดงเหตุการณ์ที่เกิดขึ้นในวัฏจักรเครื่องยนต์ดีเซลอย่างง่ายและในอุดมคติ ซึ่งจัดเรียงเพื่อแสดงให้เห็นถึงความคล้ายคลึงกับ[[เครื่องจักรความร้อนการ์โน|วัฏจักรการ์โน]] เริ่มจาก 1 ลูกสูบอยู่ที่ศูนย์ตายล่างและลิ้นทั้งสองปิดอยู่เมื่อเริ่มจังหวะอัด กระบอกสูบมีอากาศอยู่ที่ความดันบรรยากาศ ระหว่าง 1 ถึง 2 อากาศจะถูกอัดแบบอะเดียแบติก (adiabatic) คือไม่มีการถ่ายเทความร้อนเข้าหรือออกจากสิ่งแวดล้อม โดยลูกสูบที่เคลื่อนที่ขึ้น (เป็นเพียงค่าโดยประมาณเท่านั้นเนื่องจากจะมีการแลกเปลี่ยนความร้อนกับ[[กระบอกสูบ|ผนังกระบอกสูบ]]อยู่บ้าง) ในระหว่างการอัดนี้ ปริมาตรจะลดลง ความดันและอุณหภูมิจะเพิ่มสูงขึ้นทั้งคู่ ที่หรือก่อนหน้า 2 (TDC) เล็กน้อย เชื้อเพลิงจะถูกฉีดเข้าไปและเผาไหม้ในอากาศร้อนที่ถูกอัดไว้ พลังงานเคมีจะถูกปล่อยออกมาและก่อให้เกิดการฉีดพลังงานความร้อนเข้าสู่แก๊สที่ถูกอัด การเผาไหม้และความร้อนจะเกิดขึ้นระหว่าง 2 ถึง 3 ในช่วงเวลานี้ ความดันจะคงตัวเนื่องจากลูกสูบเคลื่อนที่ลง และปริมาตรจะเพิ่มขึ้น อุณหภูมิจะสูงขึ้นอันเป็นผลมาจากพลังงานของการเผาไหม้ ที่ 3 การฉีดเชื้อเพลิงและการเผาไหม้เสร็จสมบูรณ์ และกระบอกสูบจะมีแก๊สที่มีอุณหภูมิสูงกว่าที่จุด 2 ระหว่าง 3 ถึง 4 แก๊สร้อนนี้จะขยายตัว ซึ่งเป็นแบบอะเดียแบติกอีกครั้ง งานจะถูกกระทำบนระบบที่เครื่องยนต์เชื่อมต่ออยู่ ในระหว่างช่วงการขยายตัวนี้ ปริมาตรของแก๊สจะเพิ่มขึ้น และทั้งอุณหภูมิและความดันจะลดลงทั้งคู่ ที่ 4 ลิ้นไอเสียจะเปิดออก และความดันจะลดลงอย่างกะทันหันสู่ความดันบรรยากาศ (โดยประมาณ) นี่คือการขยายตัวที่ไม่ต้านทานและไม่มีงานที่เป็นประโยชน์เกิดขึ้นจากมัน ในอุดมคติ การขยายตัวแบบอะเดียแบติกควรดำเนินต่อไป โดยขยายเส้น 3–4 ไปทางขวาจนกระทั่งความดันลดลงเท่ากับความดันอากาศล้อมรอบ แต่การสูญเสียประสิทธิภาพที่เกิดจากการขยายตัวที่ไม่ต้านทานนี้ก็สมเหตุสมผลแล้วเมื่อเทียบกับความยุ่งยากในทางปฏิบัติที่เกี่ยวข้องกับการกู้คืนงานนั้น (เครื่องยนต์จะต้องมีขนาดใหญ่ขึ้นมาก) หลังเปิดลิ้นไอเสียแล้ว จังหวะคายก็จะตามมา แต่จังหวะนี้ (และจังหวะดูดที่ตามมา) ไม่ได้แสดงไว้ในแผนภาพ หากแสดงไว้จะถูกแทนด้วยวงรอบความดันต่ำที่ด้านล่างของแผนภาพ ที่ 1 สมมติว่าจังหวะคายและจังหวะดูดเสร็จสมบูรณ์แล้ว และกระบอกสูบก็เต็มไปด้วยอากาศอีกครั้ง ระบบลูกสูบ-กระบอกสูบจะดูดกลืนพลังงานระหว่าง 1 ถึง 2 ซึ่งเป็นงานที่จำเป็นสำหรับการอัดอากาศในกระบอกสูบ และมาจากพลังงานจลน์เชิงกลที่เก็บไว้ในล้อตุนกำลังของเครื่องยนต์ งานที่ได้จะเกิดขึ้นจากชุดลูกสูบ-กระบอกสูบระหว่าง 2 ถึง 4 ความแตกต่างระหว่างงานที่เพิ่มขึ้นสองส่วนนี้คืองานที่ได้สุทธิต่อวัฏจักร และแสดงด้วยพื้นที่ที่ล้อมรอบด้วยวง pV การขยายตัวแบบอะเดียแบติกจะอยู่ในช่วงความดันที่สูงกว่าการอัด เนื่องจากแก๊สในกระบอกสูบจะร้อนกว่าในระหว่างการขยายตัวเมื่อเทียบกับการอัด ด้วยเหตุนี้ วงรอบจึงมีพื้นที่จำกัด และงานสุทธิที่ได้ในระหว่างวัฏจักรจึงเป็นบวก<ref name="Reif_2014_18" />
=== ประสิทธิภาพ ===
[[ประสิทธิภาพการใช้เชื้อเพลิง]] (fuel efficiency) ของเครื่องยนต์ดีเซลดีกว่าเครื่องยนต์สันดาปประเภทอื่นส่วนใหญ่<ref name="Dubbel_1981_712" /><ref name="Reif_2014_10" /> เนื่องจากมีอัตราส่วนการอัดสูง มี[[อัตราส่วนอากาศต่อเชื้อเพลิง#อัตราส่วนสมมูลอากาศต่อเชื้อเพลิง (λ)|อัตราส่วนสมมูลอากาศต่อเชื้อเพลิง (λ)]] สูง<ref name="Pischinger Kell Sams p. 137–138">{{Cite book |last1=Pischinger |first1=Rudolf |title=Thermodynamik der Verbrennungskraftmaschine |last2=Kell |first2=Manfred |last3=Sams |first3=Theodor |date=2009 |publisher=Springer-Verlag |isbn=978-3-211-99277-7 |publication-place=Wien |pages=137–138 |language=de |oclc=694772436}}</ref> และไม่มีข้อจำกัดอากาศเข้า (เช่น ลิ้นปีกผีเสื้อ) ตามทฤษฎีแล้ว ประสิทธิภาพสูงสุดที่เป็นไปได้สำหรับเครื่องยนต์ดีเซลคือ 75%<ref name="Hemmerlein_1991" /> อย่างไรก็ดี ในทางปฏิบัติประสิทธิภาพจะต่ำกว่ามาก โดยมีประสิทธิภาพสูงถึง 43% สำหรับเครื่องยนต์รถยนต์นั่ง<ref name="vB_2017_755" /> สูงถึง 45% สำหรับเครื่องยนต์รถบรรทุกขนาดใหญ่และรถโดยสาร และสูงถึง 55% สำหรับเครื่องยนต์ทางทะเลสองจังหวะขนาดใหญ่<ref name="Reif_2014_13" /><ref name="EPA_2004" /> ประสิทธิภาพเฉลี่ยตลอดวัฏจักรขับทดสอบนั้นต่ำกว่าประสิทธิภาพสูงสุดของเครื่องยนต์ดีเซล (ตัวอย่างเช่น ประสิทธิภาพเฉลี่ย 37% สำหรับเครื่องยนต์ที่มีประสิทธิภาพสูงสุด 44%)<ref name="Soimar_2000" /> นั่นเป็นเพราะประสิทธิภาพการใช้เชื้อเพลิงของเครื่องยนต์ดีเซลจะลดลงเมื่อภาระต่ำลง แต่ก็ไม่ได้ลดลงเร็วเท่ากับเครื่องยนต์ออตโต (จุดระเบิดด้วยประกายไฟ)<ref name="Karle p. 53">{{Cite book |last=Karle |first=Anton |title=Elektromobilität Grundlagen und Praxis; mit 21 Tabellen |date=2015 |isbn=978-3-446-44339-6 |publication-place=München |page=53 |language=de |oclc=898294813}}</ref>

=== การปล่อยมลพิษ ===
{{see also|ไอเสียดีเซล}}

เครื่องยนต์ดีเซลเป็นเครื่องยนต์สันดาป จึงปล่อยผลผลิตการเผาไหม้ออกมาในรูปของ[[ไอเสีย]] เนื่องจากมีการเผาไหม้ที่ไม่สมบูรณ์<ref name="List_1939_1" /> ไอเสียจากเครื่องยนต์ดีเซลจึงมีสารมลพิษ ได้แก่ [[คาร์บอนมอนอกไซด์]] [[ไฮโดรคาร์บอน]] [[ฝุ่นละออง|ละอองธุลี]] และ[[ไนโตรเจนออกไซด์]] ประมาณ 90% ของสารมลพิษเหล่านี้สามารถกำจัดออกจากไอเสียได้โดยใช้เทคโนโลยีบำบัดไอเสีย<ref name="Dubbel_2018_1191" /><ref name="Reif p. 329">{{Cite book |last=Reif |first=Konrad |title=Diesel engine management : systems and components |date=2014 |publisher=Springer-Verlag |isbn=978-3-658-03981-3 |publication-place=Wiesbaden |page=329 |oclc=884504346}}</ref> เครื่องยนต์ดีเซลยานพาหนะบนท้องถนนไม่มีการปล่อย[[ซัลเฟอร์ไดออกไซด์]] เนื่องจากน้ำมันดีเซลสำหรับยานยนต์ได้ถูกทำให้เป็นเชื้อเพลิงไร้กำมะถันมาตั้งแต่ ค.ศ. 2003<ref name="Reif p. 331">{{Cite book |last=Reif |first=Konrad |title=Diesel engine management : systems and components |date=2014 |publisher=Springer-Verlag |isbn=978-3-658-03981-3 |publication-place=Wiesbaden |page=331 |oclc=884504346}}</ref> เฮลมุท ชือเกอ โต้แย้งว่าละอองธุลีที่ปล่อยออกมาจากยานยนต์มีผลกระทบเชิงลบต่อสุขภาพมนุษย์<ref name="Tschöke Mollenhauer Maier p. 813">{{Cite book |last1=Tschöke |first1=Helmut |title=Handbuch Dieselmotoren |last2=Mollenhauer |first2=Klaus |last3=Maier |first3=Rudolf |date=2018 |publisher=Springer Vieweg |isbn=978-3-658-07697-9 |publication-place=Wiesbaden |page=813 |language=de |oclc=1011252252}}</ref>

บางครั้งละอองธุลีในไอเสียดีเซลถูกจัดเป็น[[สารก่อมะเร็ง]]หรือ "สารอาจก่อมะเร็ง" และเป็นที่ทราบกันดีว่าสามารถเพิ่มความเสี่ยงของโรคหัวใจและโรคระบบทางเดินหายใจ<ref>{{Cite web |title=What Are Diesel Emissions? Diesel Engine Exhaust Emissions |url=https://www.nettinc.com/information/emissions-faq/what-are-diesel-emissions |access-date=9 กรกฎาคม 2022 |website=www.NettTechnologies.com}}</ref>
=== ระบบไฟฟ้า ===
โดยหลักการ เครื่องยนต์ดีเซลไม่จำเป็นต้องมีระบบไฟฟ้าใด ๆ อย่างไรก็ดี เครื่องยนต์ดีเซลสมัยใหม่ส่วนใหญ่จะมีปั๊มเชื้อเพลิงไฟฟ้าและหน่วยควบคุมเครื่องยนต์อิเล็กทรอนิกส์

อย่างไรก็ดี เครื่องยนต์ดีเซลไม่มีระบบจุดระเบิดไฟฟ้าแรงสูง ซึ่งช่วยตัดแหล่ง[[การรบกวนทางแม่เหล็กไฟฟ้า|ปล่อยคลื่นความถี่วิทยุ]] (ที่อาจรบกวนอุปกรณ์นำทางและการสื่อสาร) ออกไป นั่นจึงเป็นเหตุผลว่าทำไมยานพาหนะที่ใช้เครื่องยนต์ดีเซลเท่านั้นจึงได้รับอนุญาตให้ใช้งานในบางส่วนของ[[เขตเงียบวิทยุแห่งชาติ]]สหรัฐ<ref name="NRAO" />

=== การควบคุมแรงบิด ===
ในการควบคุมแรงบิดที่ผลิตได้ ณ เวลาใด ๆ (เช่น เมื่อผู้ขับขี่รถยนต์ปรับ[[คันเร่ง]]) [[ตัวควบคุมรอบ]] (governor) จะทำหน้าที่ปรับปริมาณเชื้อเพลิงที่ฉีดเข้าไปในเครื่องยนต์ ในอดีตมีการใช้ตัวควบคุมรอบแบบกลไก แต่ปัจจุบันตัวควบคุมรอบอิเล็กทรอนิกส์เป็นที่นิยมมากกว่าในเครื่องยนต์สมัยใหม่ ตัวควบคุมรอบแบบกลไกมักขับด้วย[[สายพานเซอร์เพนทีน|สายพานเสริม]]ของเครื่องยนต์หรือเฟือง<ref name="buckman" /><ref name="Rochester" /> และใช้การทำงานร่วมกันของสปริงและน้ำหนักเพื่อควบคุมการส่งเชื้อเพลิงให้สัมพันธ์กับทั้งภาระและรอบเครื่อง<ref name=buckman/> ส่วนเครื่องยนต์ควบคุมด้วยอิเล็กทรอนิกส์จะใช้[[ชุดควบคุมแบบอิเล็กทรอนิกส์|ชุดควบคุมอิเล็กทรอนิกส์]] (ECU) หรือมอดูลควบคุมอิเล็กทรอนิกส์ (ECM) เพื่อควบคุมการส่งเชื้อเพลิง ECM/ECU จะใช้ตัวรับรู้ (sensor) หลายตัว (เช่น สัญญาณรอบเครื่องยนต์ ความดันท่อร่วมไอดีและอุณหภูมิเชื้อเพลิง) เพื่อกำหนดปริมาณเชื้อเพลิงที่ฉีดเข้าไปในเครื่องยนต์

เนื่องจากปริมาณอากาศคงตัว (สำหรับรอบเครื่องยนต์ที่กำหนด) ในขณะที่ปริมาณเชื้อเพลิงเปลี่ยนแปลงไป จึงมีการใช้อัตราส่วนอากาศต่อเชื้อเพลิงที่สูงมาก ("บาง") ในสถานการณ์ที่ต้องการแรงบิดน้อยที่สุด ต่างจากเครื่องยนต์เบนซินที่ใช้[[ลิ้นปีกผีเสื้อ]]เพื่อลดอากาศเข้าเป็นส่วนหนึ่งของการควบคุมแรงบิดของเครื่องยนต์ การควบคุมจังหวะเริ่มฉีดเชื้อเพลิงเข้ากระบอกสูบก็คล้ายกับการควบคุมจังหวะการตั้งไฟจุดระเบิดในเครื่องยนต์เบนซิน ดังนั้นจึงเป็นปัจจัยสำคัญในการควบคุมกำลังเครื่องยนต์ การกินเชื้อเพลิง และการปล่อยไอเสีย

== การจำแนกประเภท ==
มีหลายวิธีในการจำแนกประเภทเครื่องยนต์ดีเซล ดังจะกล่าวไว้ในหัวข้อต่อไปนี้

=== ช่วงการทำงานรอบต่อนาที ===
กึนเทอร์ เมา ได้แบ่งประเภทเครื่องยนต์ดีเซลตามรอบการหมุนออกเป็นสามกลุ่มดังนี้:<ref name="Mau_1984_15" />
* เครื่องยนต์รอบสูง (> 1,000 รอบต่อนาที)
* เครื่องยนต์รอบกลาง (300–1,000 รอบต่อนาที) และ
* เครื่องยนต์รอบต่ำ (< 300 รอบต่อนาที)

; เครื่องยนต์ดีเซลรอบสูง
เครื่องยนต์รอบสูงใช้ในการขับเคลื่อน[[รถบรรทุก]] [[รถโดยสารประจำทาง|รถโดยสาร]] [[รถแทรกเตอร์]] [[รถยนต์]] [[เรือยอชต์]] [[คอมเพรสเซอร์]] [[เครื่องสูบ|ปั๊ม]] และ[[เครื่องกำเนิดไฟฟ้า]]ขนาดเล็ก<ref name="Reif_2014_11" /> ตั้งแต่ ค.ศ. 2018 เครื่องยนต์รอบสูงส่วนใหญ่ใช้การฉีดตรง เครื่องยนต์สมัยใหม่จำนวนมาก โดยเฉพาะในการใช้งานบนท้องถนน มี[[ระบบฉีดเชื้อเพลิง#ระบบฉีดตรง|การฉีดตรง]][[คอมมอนเรล]] (common rail direct injection)<ref name="Tschöke_2018_295" /> บนเรือขนาดใหญ่ มักใช้เครื่องยนต์ดีเซลรอบสูงเพื่อขับเคลื่อนเครื่องกำเนิดไฟฟ้า<ref name="Mau_1984_42" /> กำลังขับสูงสุดของเครื่องยนต์ดีเซลรอบสูงอยู่ที่ประมาณ 5 เมกะวัตต์<ref name="Mau_1984_43" />

; เครื่องยนต์ดีเซลรอบกลาง
[[File:12 Cylinder Diesel Engine.jpg|thumb|right|เครื่องยนต์ดีเซลเทอร์โบ 12 สูบแบบอยู่กับที่ เชื่อมต่อกับชุดเครื่องกำเนิดไฟฟ้าสำหรับผลิตกระแสไฟฟ้าสำรอง]]
เครื่องยนต์รอบกลางถูกนำมาใช้ในเครื่องกำเนิดไฟฟ้าขนาดใหญ่ [[รถจักรดีเซล]] การขับเคลื่อนเรือและการขับทางกลไก เช่น คอมเพรสเซอร์หรือปั๊มขนาดใหญ่ เครื่องยนต์ดีเซลรอบกลางทำงานโดยใช้น้ำมันดีเซลหรือน้ำมันเตาหนักโดยการฉีดตรงในลักษณะเดียวกับเครื่องยนต์รอบต่ำ โดยปกติแล้วจะเป็นเครื่องยนต์สี่จังหวะแบบลูกสูบทรังก์<ref name="Mau_1984_33" /> ยกเว้นเครื่องยนต์ [[EMD 567]], [[EMD 645|645]] และ [[EMD 710|710]] ซึ่งเป็นเครื่องยนต์สองจังหวะทั้งหมด<ref>{{Cite conference |last=Kettering, E.W. |date=29 พฤศจิกายน 1951 |title=History and Development of the 567 Series General Motors Locomotive Engine |url=https://books.google.com/books?id=QuUiAQAAMAAJ |conference=ASME 1951 Annual Meeting |location=Atlantic City, New Jersey |publisher=Electro-Motive Division, General Motors Corporation}}</ref>

กำลังขับของเครื่องยนต์ดีเซลรอบกลางสามารถสูงถึง 21,870 กิโลวัตต์<ref name="Mau_1984_136" /> โดยมีประสิทธิภาพยังผลอยู่ที่ประมาณ 47–48% (1982)<ref name="Mau_1984_121" /> เครื่องยนต์รอบกลางขนาดใหญ่ส่วนใหญ่จะใช้อากาศความดันสูงฉีดเข้าที่ลูกสูบโดยตรงเพื่อสตาร์จต โดยใช้ตัวจ่ายอากาศ (air distributor) แทนการใช้มอเตอร์สตาร์ตลมที่ขับเคลื่อนล้อตุนกำลัง ซึ่งมักใช้กับเครื่องยนต์ขนาดเล็กกว่า<ref name="Merker_2014_280" />

เครื่องยนต์รอบกลางที่ออกแบบมาสำหรับเรือมักจะใช้ขับเคลื่อนเรือเฟอร์รี (ro-ro) เรือโดยสารหรือเรือขนส่งสินค้าขนาดเล็ก การใช้เครื่องยนต์รอบกลางช่วยลดต้นทุนสำหรับเรือขนาดเล็กและเพิ่มขีดความสามารถการขนส่ง นอกจากนี้ เรือหนึ่งลำยังสามารถใช้เครื่องยนต์ขนาดเล็กสองตัวแทนการใช้เครื่องยนต์ขนาดใหญ่ตัวเดียว ซึ่งช่วยเพิ่มความปลอดภัยให้กับเรือได้<ref name="Mau_1984_33" />

; เครื่องยนต์ดีเซลรอบต่ำ
[[File:5S50MC.jpg|thumb|right|MAN B&W 5S50MC คือ เครื่องยนต์ดีเซลทางทะเลสองจังหวะ รอบต่ำ [[เครื่องยนต์ห้าสูบเรียง|ห้าสูบเรียง]] ติดตั้งอยู่บนเรือบรรทุกสารเคมีขนาด 29,000 ตัน]]

เครื่องยนต์ดีเซลรอบต่ำมักมีขนาดใหญ่มากและส่วนใหญ่ใช้เพื่อขับเคลื่อน[[เรือกำปั่น]] โดยทั่วไปแล้วเครื่องยนต์รอบต่ำที่ใช้กันทั่วไปมีสองประเภท ได้แก่ เครื่องยนต์สองจังหวะแบบครอสเฮด (crosshead) และเครื่องยนต์สี่จังหวะแบบลูกสูบทรังก์ (trunk-piston) เครื่องยนต์สองจังหวะมีความถี่การหมุนจำกัดและการแลกเปลี่ยนประจุทำได้ยากกว่า ซึ่งหมายความว่าโดยปกติแล้วเครื่องยนต์สองจังหวะจะมีขนาดใหญ่กว่าเครื่องยนต์สี่จังหวะและใช้เพื่อขับเคลื่อนใบจักรเรือโดยตรง

ส่วนเครื่องยนต์สี่จังหวะในเรือมักใช้เพื่อขับเคลื่อนเครื่องกำเนิดไฟฟ้า โดยมีมอเตอร์ไฟฟ้าทำหน้าที่ขับเคลื่อนใบจักร<ref name="Mau_1984_15" /> เครื่องยนต์ทั้งสองประเภทนี้มักเป็นแบบ[[อันเดอร์สแควร์]] (undersquare) หมายถึงขนาดกระบอกสูบมีขนาดเล็กกว่าระยะชัก<ref name="Mau_1984_129" /> เครื่องยนต์ดีเซลรอบต่ำ (ตามที่ใช้ในเรือและงานอื่น ๆ ที่น้ำหนักโดยรวมของเครื่องยนต์ไม่สำคัญนัก) มักมีประสิทธิภาพยังผลสูงถึง 55%<ref name="Reif_2014_13" /> เช่นเดียวกับเครื่องยนต์รอบกลาง เครื่องยนต์รอบต่ำจะถูกสตาร์ตด้วยอากาศอัด และใช้น้ำมันเตาหนักเป็นเชื้อเพลิงหลัก<ref name="Merker_2014_280" />

=== วัฏจักรการเผาไหม้ ===
[[File:Uniflow 2-stroke diesel static.svg|thumb|right|แผนภาพเค้าร่างเครื่องยนต์ดีเซลสองจังหวะพร้อมโบลเวอร์แบบรูตส์]]
[[File:Detroit Diesel timing.jpg|thumb|การจุดระเบิด Detroit Diesel]]

[[เครื่องยนต์สี่จังหวะ]]ใช้วัฏจักรการเผาไหม้ที่ได้อธิบายไปก่อนหน้านี้ เครื่องยนต์ดีเซลขนาดเล็กส่วนใหญ่ที่ใช้ในยานยนต์มักใช้วัฏจักรสี่จังหวะ เนื่องจากมีหลายปัจจัย เช่น เครื่องยนต์สองจังหวะมีช่วงกำลังที่แคบซึ่งไม่เหมาะกับการใช้งานในรถยนต์ และยังจำเป็นต้องมีระบบหล่อลื่นและการไล่ไอเสียที่ซับซ้อนและมีราคาแพง<ref name=enginebuilder>{{cite web | url = https://www.enginebuildermag.com/2015/01/cars-get-two-stroke-diesels/ | archive-url = https://web.archive.org/web/20221209084324/https://www.enginebuildermag.com/2015/01/cars-get-two-stroke-diesels/ | archive-date = 2022-12-09 | date = 2015-01-11 | title = Could Our Cars Get Two Stroke Diesels? | first = Sterling | last = Shriber | work = Engine Builder | publisher = Babcox Media Inc. }}</ref> ส่วนเรื่องความคุ้มค่าด้านราคา (และสัดส่วนของน้ำหนักที่เพิ่มขึ้น) ของเทคโนโลยีเหล่านี้จะมีผลกระทบน้อยกว่าในเครื่องยนต์ขนาดใหญ่ที่มีราคาสูงกว่า ในขณะที่เครื่องยนต์ที่ออกแบบมาสำหรับการเดินเรือหรือการใช้งานอยู่กับที่สามารถเดินเครื่องที่ความเร็วรอบเดียวเป็นเวลานาน ๆ ได้<ref name=enginebuilder/>

[[เครื่องยนต์สองจังหวะ]]ใช้วัฏจักรการเผาไหม้ที่เสร็จสิ้นในสองจังหวะแทนสี่จังหวะ การอัดอากาศเข้ากระบอกสูบและการอัดอากาศเกิดขึ้นในจังหวะเดียว และจังหวะกำลังและคายจะถูกรวมเข้าด้วยกัน การอัดอากาศในเครื่องยนต์ดีเซลสองจังหวะคล้ายกับการอัดอากาศที่เกิดขึ้นในเครื่องยนต์ดีเซลสี่จังหวะ เมื่อลูกสูบเคลื่อนที่ผ่านศูนย์ตายล่างและเริ่มเคลื่อนที่ขึ้น การอัดอากาศจะเริ่มต้นขึ้น ซึ่งจะไปสิ้นสุดที่การฉีดเชื้อเพลิงและจุดระเบิด แทนที่จะมีชุดลิ้นเต็มรูปแบบ เครื่องยนต์ดีเซลสองจังหวะจะมีเพียงช่องไอดีและช่องไอเสีย (หรือลิ้นไอเสีย) เมื่อลูกสูบเข้าใกล้ศูนย์ตายล่าง ทั้งช่องไอดีและช่องไอเสียจะ "เปิด" ซึ่งหมายความว่ามีแรงดันบรรยากาศอยู่ภายในกระบอกสูบ ดังนั้นจึงต้องมีปั๊มบางชนิดเพื่อเป่าอากาศเข้าไปในกระบอกสูบและเป่าแก๊สจากการเผาไหม้ออกไปสู่ท่อไอเสีย กระบวนการนี้เรียกว่าการไล่ไอเสีย (scavenging) ซึ่งต้องใช้แรงดันประมาณ 10-30 กิโลปาสกาล<ref name="Mau_1984_50" />

เนื่องจากขาดจังหวะไอดีและไอเสียที่แยกจากกันโดยเฉพาะ เครื่องยนต์ดีเซลสองจังหวะทั้งหมดจึงใช้โบลเวอร์ไล่ไอเสียหรือคอมเพรสเซอร์บางรูปแบบเพื่ออัดอากาศเข้ากระบอกสูบและช่วยในการกวาดล้างไอเสีย<ref name="Mau_1984_50" /> ซูเปอร์ชาร์จเจอร์แบบรูตส์ (Roots-type supercharger) ถูกนำมาใช้กับเครื่องยนต์เรือจนถึงช่วงกลางทศวรรษ 1950 แต่ตั้งแต่ ค.ศ. 1955 เป็นต้นมา ซูเปอร์ชาร์จเจอร์เหล่านี้ได้ถูกแทนที่ด้วยเทอร์โบชาร์จเจอร์อย่างแพร่หลาย<ref name="Mau_1984_23" /> โดยปกติแล้ว เครื่องยนต์ดีเซลเรือสองจังหวะจะมีเทอร์โบชาร์จเจอร์ขั้นเดียวพร้อมกังหันที่มีการไหลเข้าในแนวแกน (axial inflow) และการไหลออกในแนวรัศมี (radial outflow)<ref name="Mau_1984_pp53" />

==== การไล่ไอเสียในเครื่องยนต์สองจังหวะ====
โดยทั่วไป การไล่ไอเสียมีอยู่สามประเภทที่เป็นไปได้:
* การไล่ไอเสียไหลทางเดียว (uniflow scavenging)
* การไล่ไอเสียไหลแนวนอน (crossflow scavenging)
* การไล่ไอเสียไหลย้อนกลับ (reverse flow scavenging)

แบบไหลแนวนอนเป็นการไล่ไอเสียที่ไม่สมบูรณ์และจำกัดระยะชัก แต่ผู้ผลิตบางรายก็ยังคงใช้ระบบนี้<ref name="Mau_1984_148" /> แบบไหลย้อนกลับเป็นวิธีที่ง่ายมากในการไล่ไอเสีย และได้รับความนิยมในหมู่ผู้ผลิตจนถึงช่วงต้นทศวรรษ 1980 แบบไหลทางเดียวมีความซับซ้อนในการผลิตมากกว่าแต่ให้ประสิทธิภาพการใช้เชื้อเพลิงสูงสุด ตั้งแต่ต้นทศวรรษ 1980 ผู้ผลิตอย่าง MAN และ Sulzer ได้เปลี่ยนมาใช้ระบบนี้<ref name="Mau_1984_16" /> ถือเป็นมาตรฐานสำหรับเครื่องยนต์ดีเซลสองจังหวะทาลทะเลสมัยใหม่<ref name="Grote_2018_P93" />

=== เชื้อเพลิงที่ใช้ ===
{{Main|รถยนต์เชื้อเพลิงคู่#การแปลงดีเซล}}

เครื่องยนต์ดีเซลเชื้อเพลิงคู่ (dual-fuel diesel engines) หรือเครื่องยนต์แก๊สดีเซล (gas diesel engines) จะเผาไหม้เชื้อเพลิงสองชนิดพร้อมกัน เช่น เชื้อเพลิงที่เป็นแก๊สและน้ำมันดีเซล น้ำมันดีเซลจะจุดระเบิดเองจากแรงอัด และจากนั้นจึงจุดระเบิดเชื้อเพลิงที่เป็นแก๊ส เครื่องยนต์ประเภทนี้ไม่จำเป็นต้องใช้หัวเทียนและทำงานคล้ายเครื่องยนต์ดีเซลทั่วไป<ref name="Karim_2015_2" /><ref>{{cite web|url=http://www.dualfuel.org/wp-content/uploads/2022/03/DFPS-Brochure.pdf|title=DFPS Brochure|website=dualfuel.org}}</ref>
== การฉีดเชื้อเพลิง ==
เชื้อเพลิงถูกฉีดด้วยความดันสูงเข้าไปในห้องเผาไหม้ "[[ห้องเผาไหม้|ห้องหมุนวน]]" หรือ "ห้องเผาไหม้ช่วย"<ref name="Pischinger_2016_348" /> ต่างจากเครื่องยนต์เบนซินที่มักฉีดเชื้อเพลิงเข้าไปใน[[การฉีดเข้าท่อร่วมไอดี|ท่อร่วมไอดี]]หรือ[[คาร์บูเรเตอร์]] เครื่องยนต์ที่ฉีดเชื้อเพลิงเข้าไปในห้องเผาไหม้หลักเรียกว่าเครื่องยนต์[[ระบบฉีดเชื้อเพลิง#ระบบฉีดตรง|ฉีดตรง]] (DI) ขณะที่เครื่องยนต์ที่ใช้ห้องหมุนวนหรือห้องเผาไหม้ช่วยเรียกว่าเครื่องยนต์[[ระบบฉีดเชื้อเพลิงอ้อม|ฉีดอ้อม]] (IDI)<ref name="Reif_2014_28" />

=== การฉีดตรง ===
[[File:Têtes de piston.svg|thumb|หัวลูกสูบมีหลายประเภท]]
{{main|ระบบฉีดเชื้อเพลิง#ระบบฉีดตรง{{!}}การฉีดเชื้อเพลิงตรง}}

เครื่องยนต์ดีเซลฉีดส่วนใหญ่จะมีเบ้าเผาไหม้อยู่ที่ด้านบนลูกสูบซึ่งเป็นจุดที่เชื้อเพลิงจะถูกฉีดเข้าไป สามารถใช้วิธีการฉีดได้หลายแบบ โดยปกติแล้ว เครื่องยนต์ที่ใช้การฉีดตรงแบบกลไกควบคุมด้วยเกลียว (helix-controlled) จะมีปั๊มตัวฉีดแบบแถวเรียง (inline) หรือแบบจานจ่าย (distributor)<ref name="buckman" /> สำหรับกระบอกสูบแต่ละอัน ลูกสูบที่เกี่ยวข้องในปั๊มเชื้อเพลิงจะทำหน้าที่ตวงปริมาณเชื้อเพลิงที่เหมาะสมและกำหนดจังหวะการฉีดแต่ละครั้ง เครื่องยนต์เหล่านี้ใช้[[ตัวฉีด]] (injector) ซึ่งเป็นลิ้นสปริงที่มีความแม่นยำสูงที่จะเปิดและปิดตามความดันเชื้อเพลิงที่กำหนดไว้ ท่อเชื้อเพลิงความดันสูงแยกกันจะเชื่อมต่อปั๊มเชื้อเพลิงกับกระบอกสูบแต่ละอัน ปริมาณเชื้อเพลิงสำหรับการเผาไหม้แต่ละครั้งถูกควบคุมโดย[[ร่อง (วิศวกรรม)|ร่อง]]เอียงบนลูกสูบซึ่งจะหมุนเพียงไม่กี่องศาเพื่อปล่อยความดันออก โดยการควบคุมนี้จะทำโดยตัวควบคุมรอบแบบกลไก (mechanical governor) ซึ่งประกอบด้วยตุ้มน้ำหนักที่หมุนตามรอบเครื่องยนต์และถูกจำกัดด้วยสปริงและคานงัด ตัวฉีดจะถูกเปิดค้างไว้ด้วยความดันเชื้อเพลิง สำหรับเครื่องยนต์รอบสูง ลูกสูบของปั๊มจะถูกรวมไว้ในชุดเดียวกัน<ref name="Firstdiesel_2009" /> โดยปกติแล้วความยาวของท่อเชื้อเพลิงจากปั๊มไปยังตัวฉีดแต่ละอันจะเท่ากันเพื่อให้ได้ความล่าช้าของความดันที่เท่ากัน เครื่องยนต์ดีเซลฉีดตรงมักใช้ตัวฉีดเชื้อเพลิงแบบรูเล็ก (orifice-type)<ref name="Reif_2014_140" />

การควบคุมการฉีดเชื้อเพลิงด้วยอิเล็กทรอนิกส์ได้เปลี่ยนเครื่องยนต์ฉีดตรงโดยสิ้นเชิง เพราะช่วยให้สามารถควบคุมการเผาไหม้ได้ดียิ่งขึ้น<ref name="Dieselpower_2007" />

; คอมมอนเรล
ระบบฉีดตรง[[คอมมอนเรล]] (CR) ไม่ได้รวมหน้าที่การวัดปริมาณเชื้อเพลิง การเพิ่มความดัน และการส่งจ่ายไว้ในชุดเดียวเหมือนในกรณีปั๊มแบบจานจ่าย Bosch (Bosch distributor-type pump) เป็นต้น แต่จะมีปั๊มความดันสูงเป็นตัวจ่ายเชื้อเพลิงให้แก่ระบบคอมมอนเรล โดยข้อกำหนดของตัวฉีดแต่ละอันของแต่ละกระบอกสูบจะถูกจ่ายจากแหล่งเก็บเชื้อเพลิงความดันสูงร่วมกันนี้ ระบบควบคุมดีเซลอิเล็กทรอนิกส์ (EDC) จะควบคุมทั้งความดันในรางและการฉีดขึ้นอยู่กับสภาพการทำงานของเครื่องยนต์ ตัวฉีดของระบบคอมมอนเรลรุ่นเก่าใช้ลูกสูบที่ขับด้วย[[โซเลนอยด์]]เพื่อยกเข็มตัวฉีด ขณะที่หัวฉีดคอมมอนเรลรุ่นใหม่กว่าใช้ลูกสูบที่ขับด้วยตัวกระตุ้น[[ไพอีโซอิเล็กทริก]] ซึ่งมีมวลที่เคลื่อนที่ได้น้อยกว่าและทำให้สามารถฉีดได้บ่อยขึ้นในระยะเวลาอันสั้น<ref name="Reif_2014_70" />  ระบบคอมมอนเรลในยุคแรกถูกควบคุมโดยกลไก

ความดันฉีดของระบบคอมมอนเรลสมัยใหม่มีตั้งแต่ 140 ถึง 270 เมกะปาสกาล<ref name="Tschöke_2018_310" />

=== การฉีดอ้อม ===
[[File:Ricardo comet combustion.gif|thumb|ห้องเผาไหม้ฉีดอ้อม Ricardo Comet]]
{{Main|ระบบฉีดเชื้อเพลิงอ้อม}}

เครื่องยนต์ดีเซลฉีดอ้อม (IDI) จะส่งเชื้อเพลิงเข้าไปในห้องขนาดเล็กที่เรียกว่าห้องหมุนวน ห้องเผาไหม้ช่วย หรือห้องช่วย ซึ่งเชื่อมต่อกับกระบอกสูบด้วยช่องอากาศแคบ ๆ โดยทั่วไปแล้ว ห้องเผาไหม้ช่วยมีจุดประสงค์เพื่อเพิ่ม[[ความปั่นป่วน]]อากาศสำหรับการผสมเชื้อเพลิงกับอากาศให้ดีขึ้น ระบบนี้ยังช่วยให้เครื่องยนต์ทำงานได้นุ่มนวลและเงียบขึ้น และเนื่องจากการผสมเชื้อเพลิงเป็นไปได้ด้วยความช่วยเหลือจากความปั่นป่วนอากาศ ทำให้แรงดัน[[ตัวฉีด]]สามารถต่ำลงได้ ระบบฉีดอ้อมส่วนใหญ่ใช้ตัวฉีดแบบรูเล็กเดี่ยว ห้องเผาไหม้ช่วยมีข้อเสียคือทำให้ประสิทธิภาพลดลงเนื่องจากมีการสูญเสียความร้อนไปยังระบบหล่อเย็นของเครื่องยนต์มากขึ้น ซึ่งจำกัดการเผาไหม้ ทำให้ประสิทธิภาพลดลง 5–10% เครื่องยนต์ฉีดอ้อมยังสตาร์ตติดยากกว่าและมักต้องใช้หัวเผา เครื่องยนต์ฉีดอ้อมอาจมีต้นทุนการผลิตถูกกว่า แต่โดยทั่วไปต้องใช้อัตราส่วนการอัดสูงกว่าเครื่องยนต์ฉีดตรง เครื่องยนต์ฉีดอ้อมยังทำให้การสร้างเครื่องยนต์ที่ทำงานได้นุ่มนวลและเงียบขึ้นด้วยระบบตัวฉีดแบบกลไกอย่างง่ายทำได้ง่ายขึ้นเนื่องจากจังหวะการฉีดอย่างแม่นยำไม่ได้มีความสำคัญมากเท่าที่ควร เครื่องยนต์ยานยนต์สมัยใหม่ส่วนใหญ่เป็นแบบฉีดตรงซึ่งมีข้อดีคือมีประสิทธิภาพสูงกว่าและสตาร์ตติดง่ายกว่า อย่างไรก็ดี ยังคงพบเครื่องยนต์ฉีดอ้อมได้ในรถ ATV และเครื่องยนต์ดีเซลขนาดเล็กจำนวนมาก<ref name="Dieselhub" /> เครื่องยนต์ดีเซลฉีดอ้อมใช้ตัวฉีดเชื้อเพลิงแบบเดือย (pintle-type)<ref name="Reif_2014_140" />

=== การฉีดด้วยอากาศ ===
{{Main|การฉีดด้วยอากาศ}}
[[File:Stationärdieselmotor 1915.jpg|thumb|right|เครื่องยนต์ดีเซลฉีดด้วยอากาศยุคต้นศตวรรษที่ 20 ทั่วไป มีพิกัดกำลังที่ 59 กิโลวัตต์]]

เครื่องยนต์ดีเซลยุคแรกเริ่มฉีดเชื้อเพลิงโดยอาศัยอากาศอัด ซึ่งจะทำให้เชื้อเพลิงแตกตัวเป็นละอองเล็ก ๆ และฉีดเข้าไปในเครื่องยนต์ผ่านหัวฉีด (nozzle) (หลักการเดียวกับสเปรย์กระป๋อง) ช่องเปิดของหัวฉีดจะถูกปิดด้วย[[ลิ้นเข็ม]]ซึ่งทำงานด้วย[[เพลาลูกเบี้ยว]] แม้เครื่องยนต์จะต้องขับเครื่องอัดอากาศที่ใช้สำหรับการฉีดด้วยอากาศด้วย แต่ประสิทธิภาพก็ยังคงดีกว่าเครื่องยนต์สันดาปภายในแบบอื่นในยุคนั้น<ref name="Mau_1984_7" /> อย่างไรก็ดี ระบบนี้มีน้ำหนักมากและตอบสนองต่อการเปลี่ยนแปลงแรงบิดได้ช้า ทำให้ไม่เหมาะกับยานพาหนะบนท้องถนน<ref name="Merker_2014_381" />

=== ตัวฉีดรวม ===
{{Main|ตัวฉีดรวม}}

ระบบตัวฉีดรวม (unit injector) หรือที่รู้จักในชื่อ "Pumpe-Düse" (ภาษาเยอรมันแปลว่า ''ปั๊ม-หัวฉีด'') เป็นระบบที่รวมตัวฉีดและปั๊มเชื้อเพลิงไว้ในองค์ประกอบเดียวกัน ซึ่งติดตั้งอยู่เหนือแต่ละกระบอกสูบ วิธีนี้ช่วยกำจัดท่อเชื้อเพลิงความดันสูงออกไป ทำให้ได้การฉีดเชื้อเพลิงที่สม่ำเสมอยิ่งขึ้น ภายใต้ภาระเต็มที่ แรงดันการฉีดสามารถสูงถึง 220 เมกะปาสกาล<ref name="Reif Springer Fachmedien Wiesbaden p. 393">{{Cite book |last1=Reif |first1=Konrad |title=Dieselmotor-Management Systeme, Komponenten, Steuerung und Regelung |last2=Springer Fachmedien Wiesbaden |date=2020 |isbn=978-3-658-25072-0 |publication-place=Wiesbaden |page=393 |language=de |oclc=1156847338}}</ref> ตัวฉีดรวมทำงานด้วยกลไก[[ลูกเบี้ยว]] และปริมาณเชื้อเพลิงที่ฉีดจะถูกควบคุมด้วยกลไก (โดยใช้แร็กหรือคานงัด) หรืออิเล็กทรอนิกส์

ด้วยข้อกำหนดด้านสมรรถนะที่เพิ่มขึ้น ตัวฉีดรวมจึงถูกแทนที่ด้วยระบบฉีด[[คอมมอนเรล]]เป็นส่วนใหญ่<ref name="Tschöke_2018_295" />
== คุณสมบัติเฉพาะของเครื่องยนต์ดีเซล ==
===มวล===
เครื่องยนต์ดีเซลโดยเฉลี่ยมีอัตราส่วนมวลต่อน้ำหนักด้อยกว่าเครื่องยนต์เบนซินที่มีขนาดใกล้เคียงกัน รอบเครื่องยนต์ที่ต่ำกว่าของเครื่องยนต์ดีเซลทั่วไปส่งผลให้มี[[กำลัง (ฟิสิกส์)|กำลัง]]ขับน้อยกว่า<ref name="Braess_2012_225" /> นอกจากนี้ มวลของเครื่องยนต์ดีเซลมักจะสูงกว่า เนื่องจากความดันการทำงานที่สูงขึ้นภายในห้องเผาไหม้ทำให้เกิดแรงภายในที่เพิ่มขึ้น ซึ่งต้องใช้ชิ้นส่วนที่แข็งแรงกว่า (และทำให้หนักกว่า) เพื่อทนทานต่อแรงเหล่านี้<ref name="Schreiner_2014_22" />

=== เสียง ("เสียงเขกดีเซล") ===
[[File:AKD 112 Z.webm|thumb|เสียงเครื่องยนต์ดีเซลสองสูบ [[MWM AKD 112 Z]] ปี 1950 ขณะเดินเบา]]
[[File:Volvo Penta Motorljud.ogg|thumb|เสียงเครื่องยนต์ดีเซลหกสูบ Volvo Penta]]
เสียงเครื่องยนต์ดีเซลที่มีลักษณะเฉพาะ โดยเฉพาะเมื่อเดินเบาบางครั้งเรียกว่า "เสียงเขกดีเซล" (diesel clatter) เสียงนี้ส่วนใหญ่เกิดจากการจุดระเบิดอย่างกะทันหันของน้ำมันดีเซลเมื่อถูกฉีดเข้าไปในห้องเผาไหม้ ซึ่งทำให้เกิดคลื่นความดันที่มีเสียงคล้ายการเคาะ

วิศวกรออกแบบเครื่องยนต์สามารถลดเสียงเขกดีเซลได้ด้วยวิธีต่าง ๆ เช่น การฉีดอ้อม การฉีดนำร่องหรือฉีดก่อน<ref name="Böge_2017_1150" /> การปรับจังหวะการฉีด อัตราการฉีด อัตราส่วนการอัด การเพิ่มแรงอัดด้วยเทอร์โบ และ[[การหมุนเวียนไอเสีย]] (EGR)<ref name="EngTips" /> ระบบฉีดดีเซลคอมมอนเรลช่วยให้สามารถฉีดได้หลายครั้งเพื่อช่วยลดเสียงรบกวน ด้วยมาตรการเหล่านี้ เสียงเขกดีเซลจึงลดลงอย่างมากในเครื่องยนต์สมัยใหม่ น้ำมันดีเซลที่มี[[เลขซีเทน]]สูงขึ้นมีแนวโน้มที่จะติดไฟได้ง่ายกว่า จึงช่วยลดเสียงเขกดีเซลได้<ref name="Comb in IC" />

===การสตาร์ตขณะอากาศเย็นจัด===
ในภูมิอากาศอุ่น เครื่องยนต์ดีเซลไม่จำเป็นต้องใช้ตัวช่วยสตาร์ต (นอกเหนือจาก[[มอเตอร์สตาร์ต]]) อย่างไรก็ดี เครื่องยนต์ดีเซลจำนวนมากมีระบบอุ่นห้องเผาไหม้บางรูปแบบ เพื่อช่วยในการสตาร์ตในสภาพเย็นเจ็ด เครื่องยนต์ที่มีความจุต่อสูบน้อยกว่า 1 ลิตรมักใช้[[หัวเผา]] (glow plug) ขณะที่เครื่องยนต์สำหรับงานหนักที่มีขนาดใหญ่กว่าจะใช้[[ระบบสตาร์ตด้วยเปลวไฟ]] (flame-start systems)<ref name="Reif_2014_136" /> อุณหภูมิขั้นต่ำที่ช่วยให้สตาร์ตได้โดยไม่ต้องมีการอุ่นเครื่องคือ 40 °C (104 °F) สำหรับเครื่องยนต์ห้องเผาไหม้ช่วย 20 °C (68 °F) สำหรับเครื่องยนต์ห้องหมุนวน และ 0 °C (32 °F) สำหรับเครื่องยนต์ฉีดตรง

ในอดีตเคยมีการใช้วิธีสตาร์ตขณะเย็นจัดที่หลากหลายกว่าปัจจุบัน เครื่องยนต์บางชนิด เช่น เครื่องยนต์ของ [[Detroit Desel]] ใช้{{When|date=กันยายน 2010}} ระบบการพ่น[[อีเทอร์]]จำนวนเล็กน้อยเข้าไปในท่อร่วมไอดีเพื่อช่วยให้เกิดการเผาไหม้<ref name="FreeLib_1995" /> แทนการใช้หัวเผา เครื่องยนต์ดีเซลบางรุ่นก็มีระบบช่วยสตาร์ตที่ปรับเปลี่ยนจังหวะการเปิดปิดลิ้น วิธีที่ง่ายที่สุดคือการใช้คานงัดคลายกำลังอัด การดึงคานงัดนี้จะล็อกลิ้นไอเสียให้อยู่ในตำแหน่งเปิดเล็กน้อย ทำให้เครื่องยนต์ไม่มีกำลังอัดและสามารถหมุนเพลาข้อเหวี่ยงได้โดยใช้แรงต้านน้อยลงมาก เมื่อเพลาข้อเหวี่ยงหมุนได้รอบสูงขึ้น การดันคานงัดกลับไปสู่ตำแหน่งปกติจะทำให้ลิ้นไอเสียกลับมาทำงานอย่างกะทันหัน ส่งผลให้เกิดกำลังอัด และโมเมนต์ความเฉื่อยของมวลของล้อตุนกำลังจะช่วยสตาร์ตเครื่องยนต์ได้ในที่สุด<ref name="Hawks_73" /> เครื่องยนต์ดีเซลรุ่นอื่น เช่น เครื่องยนต์ห้องเผาไหม้ช่วย XII Jv 170/240 ที่ผลิตโดย Ganz & Co. มีระบบปรับเปลี่ยนจังหวะการเปิดปิดลิ้นที่ทำงานโดยการปรับเพลาลูกเบี้ยวลิ้นไอดี ให้เคลื่อนไปอยู่ในตำแหน่ง "ดีเลย์" เล็กน้อย ซึ่งจะทำให้ลิ้นไอดีเปิดช้าลง ส่งผลให้อากาศที่ไหลเข้าสู่ห้องเผาไหม้ร้อนขึ้น<ref name="Kremser_1942_190" />

=== ซูเปอร์ชาร์จเจอร์และเทอร์โบชาร์จเจอร์ ===
{{see also|เทอร์โบดีเซล}}

[[การเหนี่ยวนำบังคับ]] (forced induction) โดยเฉพาะการใช้เทอร์โบชาร์จ เป็นสิ่งที่นิยมใช้กับเครื่องยนต์ดีเซลเพราะมันช่วยเพิ่มประสิทธิภาพและแรงบิดได้อย่างมาก<ref name="Reif_2014_41" /> เครื่องยนต์ดีเซลเหมาะแก่การติดตั้งการเหนี่ยวนำบังคับเนื่องจากหลักการทำงานของเครื่องยนต์ที่มีช่วงการจุดระเบิดกว้าง<ref name="Pischinger_2016_348" /> และไม่มีเชื้อเพลิงอยู่ในกระบอกสูบในระหว่างจังหวะอัด ด้วยเหตุนี้ การน็อก (knocking) การชิงจุดระเบิด (pre-ignition) หรือการระเบิดรุนแรง (detonation) จึงไม่สามารถเกิดขึ้นได้ และสารผสมบาง (lean mixture) ซึ่งเกิดจากอากาศที่ถูกอัดเข้าสู่ห้องเผาไหม้มากเกินไปก็ไม่ส่งผลเสียต่อการเผาไหม้<ref name="Reif_2017_16" />

