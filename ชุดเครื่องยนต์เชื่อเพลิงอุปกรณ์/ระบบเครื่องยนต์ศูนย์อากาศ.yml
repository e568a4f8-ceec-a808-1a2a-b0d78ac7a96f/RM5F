== คุณลักษณะเชื้อเพลิงและไหล ==
{{Main|น้ำมันดีเซล}}

เครื่องยนต์ดีเซลสามารถเผาไหม้เชื้อเพลิงได้หลายชนิด รวมถึงน้ำมันเชื้อเพลิงหลายประเภทที่มีข้อได้เปรียบเหนือเชื้อเพลิงอื่น ๆ เช่น น้ำมันเบนซิน ข้อได้เปรียบเหล่านี้ได้แก่:
* ต้นทุนเชื้อเพลิงต่ำ เนื่องจากน้ำมันเชื้อเพลิงมีราคาค่อนข้างถูก
* คุณสมบัติการหล่อลื่นที่ดี
* ความหนาแน่นพลังงานสูง
* ความเสี่ยงติดไฟต่ำ เนื่องจากไม่ก่อไอระเหยติดไฟง่าย
* [[ไบโอดีเซล]] (biodiesel) เป็นเชื้อเพลิงสังเคราะห์ได้ง่ายและไม่ได้มาจากปิโตรเลียม (ผ่านกระบวนการ[[ทรานส์เอสเทอริฟิเคชัน]]) ซึ่งสามารถนำมาใช้กับเครื่องยนต์ดีเซลหลายรุ่นได้โดยตรง ขณะที่เครื่องยนต์เบนซินจำเป็นต้องดัดแปลงเพื่อใช้[[เชื้อเพลิงสังเคราะห์]] หรือไม่ก็ต้องใช้เชื้อเพลิงเหล่านั้นเป็นสารเติมแต่งในน้ำมันเบนซิน (เช่น [[เอทานอล]]ที่เติมใน[[สสารผสมอากาศกับเชื้อเพลิงเอทานอลทั่วไป|แกโซฮอล]])
ในเครื่องยนต์ดีเซล ตัวฉีดแบบกลไกจะฉีดละอองเชื้อเพลิงเข้าไปในห้องเผาไหม้โดยตรง (ต่างจากเครื่องยนต์เบนซินที่ใช้[[ปั๊มสุญญากาศ|คอคอดนมหนู]]ในคาร์บูเรเตอร์ หรือ[[ตัวฉีดเชื้อเพลิง]]ในระบบฉีดเข้าท่อร่วมเพื่อฉีดละอองเชื้อเพลิงเข้าไปในท่อร่วมไอดีหรือท่อไอดี) เนื่องจากเครื่องยนต์ดีเซลดูดเฉพาะอากาศบริสุทธิ์เข้าไปในกระบอกสูบ อัตราส่วนการอัดจึงสามารถสูงกว่ามากได้โดยไม่มีความเสี่ยงที่จะเกิดการชิงจุดระเบิด หากจังหวะการฉีดมีความแม่นยำ<ref name="Reif_2017_16" /> หมายความว่าอุณหภูมิกระบอกสูบเครื่องยนต์ดีเซลจะสูงกว่าเครื่องยนต์เบนซินมาก ทำให้สามารถใช้เชื้อเพลิงระเหยง่ายได้

[[File:MAN 630 L2A 03.jpg|thumb|เครื่องยนต์ดีเซล [[M-System]] ของรถบรรทุก MAN 630 เป็นเครื่องยนต์เบนซิน (ออกแบบมาให้ใช้น้ำมันเบนซิน NATO F 46/F 50) แต่ก็สามารถใช้เชื้อเพลิงไอพ่น (NATO F 40/F 44) น้ำมันก๊าด (NATO F 58) และน้ำมันดีเซล (NATO F 54/F 75) ได้ด้วย]]

ดังนั้น เครื่องยนต์ดีเซลจึงสามารถทำงานได้ด้วยเชื้อเพลิงที่หลากหลายมาก โดยทั่วไป เชื้อเพลิงสำหรับเครื่องยนต์ดีเซลควรมี[[ความหนืด]]ที่เหมาะสม เพื่อให้[[ปั๊มตัวฉีด]]สามารถสูบจ่ายเชื้อเพลิงไปยังหัวฉีดได้โดยไม่ทำให้ตัวเองเสียหายหรือทำให้ท่อเชื้อเพลิงสึกกร่อน ในขณะฉีด เชื้อเพลิงควรจะสามารถสร้างละอองฝอยที่ดีได้ และต้องไม่ทำให้เกิดคราบเขม่าจับที่หัวฉีด เพื่อให้เครื่องยนต์สตาร์ตติดง่ายและทำงานได้อย่างราบรื่น เชื้อเพลิงควรจะติดไฟได้ง่ายและไม่ทำให้เกิดการหน่วงการจุดระเบิดที่มากเกินไป (นั่นหมายถึงเชื้อเพลิงควรมี[[เลขซีเทน]]สูง) นอกจากนี้ น้ำมันดีเซลควรมี[[ค่าความร้อนต่ำ]]ที่สูงด้วยเช่นกัน<ref name="vPhilippovich_1939_41" />

ปั๊มตัวฉีดแบบแถวเรียงโดยทั่วไปสามารถทนทานต่อน้ำมันคุณภาพต่ำหรือไบโอดีเซลได้ดีกว่าปั๊มตัวฉีดแบบจานจ่าย นอกจากนี้ เครื่องยนต์ฉีดอ้อมโดยทั่วไปแล้วจะทำงานได้ดีกว่าเมื่อใช้น้ำมันที่มีค่าหน่วงการจุดระเบิดสูง (เช่น น้ำมันเบนซิน) เมื่อเทียบกับเครื่องยนต์ฉีดตรง<ref name="vPhilippovich_1939_45" /> ส่วนหนึ่งเป็นเพราะเครื่องยนต์ฉีดอ้อมมีผลกระทบจาก 'การหมุนวน' ที่มากกว่าอย่างมาก ซึ่งช่วยปรับปรุงการระเหยและการเผาไหม้ของเชื้อเพลิง และ (ในกรณีเชื้อเพลิงประเภทน้ำมันพืช) [[ลิพิด]] (lipid) อาจควบแน่นบนผนังกระบอกสูบของเครื่องยนต์ฉีดตรงได้ หากอุณหภูมิในการเผาไหม้ต่ำเกินไป (เช่น การสตาร์ตเครื่องยนต์ขณะเย็นจัด) เครื่องยนต์ฉีดตรง[[M-System|ห้องเผาไหม้ทรงกลมกลาง MAN]] อาศัยการควบแน่นของเชื้อเพลิงบนผนังห้องเผาไหม้ เชื้อเพลิงจะเริ่มระเหยก็ต่อเมื่อการจุดระเบิดเริ่มต้นขึ้น และจะเผาไหม้ได้อย่างค่อนข้างราบรื่น ดังนั้น เครื่องยนต์ประเภทนี้จึงสามารถทนทานต่อเชื้อเพลิงที่มีคุณสมบัติหน่วงการจุดระเบิดต่ำได้ และโดยทั่วไปแล้วสามารถทำงานได้ด้วยน้ำมันเบนซินที่มี[[เลขออกเทน#เลขออกเทนวิจัย|เลขออกเทนวิจัย]] (RON) 86<ref name="MAN_438" />

===ประเภทเชื้อเพลิง===
ในผลงานปี 1893 ของเขา ''[[ทฤษฎีและการสร้างเครื่องจักรความร้อนที่เหมาะสม]]'' รูด็อล์ฟ ดีเซิลได้พิจารณาการใช้[[ผงถ่านหิน]]เป็นเชื้อเพลิงสำหรับเครื่องยนต์ดีเซล อย่างไรก็ดี ดีเซิลเพียงแค่พิจารณาการใช้ผงถ่านหิน (รวมถึงเชื้อเพลิงเหลวและแก๊ส) เครื่องยนต์ที่แท้จริงของเขาถูกออกแบบมาให้ทำงานด้วย[[ปิโตรเลียม]] ซึ่งต่อมาถูกแทนที่ด้วย[[น้ำมันเบนซิน]]และน้ำมันก๊าดทั่วไปเพื่อวัตถุประสงค์ในการทดสอบเพิ่มเติม เนื่องจากปิโตรเลียมมีความหนืดเกินไป<ref name="Diesel_1913_107" /> นอกเหนือจากน้ำมันก๊าดและเบนซินแล้ว เครื่องยนต์ของดีเซิลยังสามารถทำงานด้วย[[ลิโกรอิน]] (ligroin) ได้ด้วย<ref name="Diesel_1913_110" />

ก่อนที่เชื้อเพลิงสำหรับเครื่องยนต์ดีเซลจะถูกกำหนดมาตรฐาน เชื้อเพลิงต่าง ๆ เช่น [[น้ำมันเบนซิน|เบนซิน]] [[น้ำมันก๊าด]] [[น้ำมันแก๊ส]] (gas oil) [[น้ำมันพืช]]และ[[น้ำมันแร่]] รวมถึงสารผสมเชื้อเพลิงเหล่านี้ถูกนำมาใช้<ref name="MAN_436" /> เชื้อเพลิงทั่วไปที่ตั้งใจจะใช้สำหรับเครื่องยนต์ดีเซลโดยเฉพาะคือ[[ปิโตรเลียมกลั่น]]และ[[น้ำมันดินจากถ่านหินกลั่น]] เช่น เชื้อเพลิงต่อไปนี้ ซึ่งมีค่าความร้อนต่ำจำเพาะดังนี้:
* น้ำมันดีเซล: 10,200 kcal·kg<sup>−1</sup> (42.7 MJ·kg<sup>−1</sup>) ถึง 10,250 kcal·kg<sup>−1</sup> (42.9 MJ·kg<sup>−1</sup>)
* น้ำมันทำความร้อน (Heating oil): 10,000&nbsp;kcal·kg<sup>−1</sup> (41.8&nbsp;MJ·kg<sup>−1</sup>) ถึง 10,200&nbsp;kcal·kg<sup>−1</sup> (42.7&nbsp;MJ·kg<sup>−1</sup>)
* [[ครีโอโซต]]น้ำมันดินจากถ่านหิน (Coal-tar creosote): 9,150&nbsp;kcal·kg<sup>−1</sup> (38.3&nbsp;MJ·kg<sup>−1</sup>) ถึง 9,250&nbsp;kcal·kg<sup>−1</sup> (38.7&nbsp;MJ·kg<sup>−1</sup>)
* [[น้ำมันก๊าด]]: สูงสุด 10,400&nbsp;kcal·kg<sup>−1</sup> (43.5&nbsp;MJ·kg<sup>−1</sup>)

''ที่มา:''<ref name="vPhilippovich_1939_43" />

มาตรฐานน้ำมันดีเซลฉบับแรกคือ [[DIN 51601]], [[VTL 9140-001]] และ [[NATO F 54]] ซึ่งปรากฏขึ้นหลังสงครามโลกครั้งที่สอง<ref name="MAN_436" /> มาตรฐาน[[น้ำมันดีเซล]]ยุโรป [[EN 590]] ฉบับปัจจุบันถูกกำหนดขึ้นในเดือนพฤษภาคม ค.ศ. 1993; มาตรฐาน NATO F 54 ฉบับปัจจุบันส่วนใหญ่ก็เหมือนกันกับมาตรฐานนี้ มาตรฐานไบโอดีเซล DIN 51628 ถูกยกเลิกโดย EN 590 ฉบับ ค.ศ. 2009; ไบโอดีเซล FAME สอดคล้องกับมาตรฐาน [[EN 14214]] เครื่องยนต์ดีเซลพาหนะทางน้ำมักทำงานด้วยน้ำมันดีเซลที่สอดคล้องกับมาตรฐาน [[ISO 8217]] ([[Bunker C]]) นอกจากนี้ เครื่องยนต์ดีเซลบางรุ่นยังสามารถทำงานด้วย[[แก๊ส]]ได้อีกด้วย (เช่น [[แก๊สธรรมชาติเหลว|LNG]])<ref name="Schwarz_2012_102" />

