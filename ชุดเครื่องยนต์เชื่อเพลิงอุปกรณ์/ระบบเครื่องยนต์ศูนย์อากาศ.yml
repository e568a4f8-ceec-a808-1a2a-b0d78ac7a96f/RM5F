* 1909: 14 มีนาคม: [[พรอสเปอร์ ลอเรนจ์]] ยื่นจดสิทธิบัตร[[ระบบฉีดเชื้อเพลิงอ้อม#ห้องเผาไหม้ช่วย|การฉีดเข้าห้องเผาไหม้ช่วย]] (precombustion chamber injection)<ref name="Sass_1962_610" /> ต่อมาเขาได้สร้างเครื่องยนต์ดีเซลเครื่องแรกที่ใช้ระบบนี้<ref name="vFersen_1986_272" /><ref name="Merker_2014_382" />

