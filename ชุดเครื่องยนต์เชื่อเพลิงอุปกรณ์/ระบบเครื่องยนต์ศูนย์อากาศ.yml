* 1905: 14 มกราคม: ดีเซิลยื่นจดสิทธิบัตรการฉีดรวม (unit injection) (L20510I/46a)<ref name="Sass_1962_501" />
* 1905: Büchi ผลิต[[เทอร์โบชาร์จเจอร์]]และ[[อินเตอร์คูลเลอร์]]สำหรับเครื่องยนต์ดีเซลเป็นครั้งแรก<ref name="Hartman" />
* 1906: บริษัท Diesel Motoren-Fabrik Actien-Gesellschaft ถูกยุบ<ref name="Sass_1962_486" />
* 1908: สิทธิบัตรของดีเซิลหมดอายุ<ref name="Sass_1962_530" />
