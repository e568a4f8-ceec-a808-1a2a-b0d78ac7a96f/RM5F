* 1896: 30 เมษายน [[อิมานูเอล เลาส์เตอร์]] เขียนแบบเครื่องยนต์ต้นแบบตัวที่สามและตัวสุดท้ายเสร็จสมบูรณ์<ref name="Sass_1962_474" />
* 1896: 6 ตุลาคม เครื่องยนต์ต้นแบบตัวที่สามและตัวสุดท้ายสร้างเสร็จ<ref name="Diesel_1913_64" />
* 1897: 1 กุมภาพันธ์ เครื่องยนต์ต้นแบบของดีเซิลทำงานได้และพร้อมสำหรับการทดสอบประสิทธิภาพและการผลิตในที่สุด<ref name="Sass_1962_479" />
* 1897: 9 ตุลาคม [[อดอลฟัส บุช]] ได้รับสิทธิ์การใช้เครื่องยนต์ดีเซลสำหรับสหรัฐและแคนาดา<ref name="Sass_1962_484" /><ref name="Busch" />
* 1897: 29 ตุลาคม รูด็อล์ฟ ดีเซิลได้รับสิทธิบัตร (DRP 95680) สำหรับการอัดบรรจุอากาศเครื่องยนต์ดีเซล<ref name="Sass_1962_467" />
* 1898: 1 กุมภาพันธ์ บริษัท Diesel Motoren-Fabrik Actien-Gesellschaft ได้รับการจดทะเบียน<ref name="Sass_1962_485" />
* 1898: มีนาคม เครื่องยนต์ดีเซลเชิงพาณิชย์เครื่องแรก มีกำลัง 2×30 แรงม้า (2×22 กิโลวัตต์) ได้รับการติดตั้งในโรงงานเค็มพ์เทินเทนของบริษัท Vereinigte Zündholzfabriken A.G.<ref name="Sass_1962_505" /><ref name="Sass_1962_506" />
* 1898: 17 กันยายน บริษัท Allgemeine Gesellschaft für Dieselmotoren A.-G. ได้รับการก่อตั้ง<ref name="Sass_1962_493" />
