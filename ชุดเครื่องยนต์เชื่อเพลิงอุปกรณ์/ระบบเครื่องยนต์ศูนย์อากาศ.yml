'''เครื่องยนต์ดีเซล''' ({{Langx|en|diesel engine}}) ตั้งชื่อตาม[[รูด็อล์ฟ ดีเซิล]] วิศวกรชาวเยอรมัน เป็น[[เครื่องยนต์สันดาปภายใน]]ที่[[การเผาไหม้|การจุดระเบิด]]ของ[[น้ำมันดีเซล]]เกิดจากอุณหภูมิที่สูงขึ้นของอากาศในกระบอกสูบเนื่องจาก[[การอัด]]ด้วย[[กลศาสตร์|กลไก]] ดังนั้นเครื่องยนต์ดีเซลจึงถูกเรียกว่า '''เครื่องยนต์จุดระเบิดด้วยการอัด''' (หรือ '''เครื่องยนต์ซีไอ''') ซึ่งต่างจากเครื่องยนต์ที่ใช้[[หัวเทียน]]จุดระเบิดสารผสมอากาศกับเชื้อเพลิง เช่น [[เครื่องยนต์เบนซิน]] (เครื่องยนต์[[น้ำมันเบนซิน|แกโซลีน]]) (ที่ใช้เชื้อเพลิงในสถานะแก๊ส เช่น [[แก๊สธรรมชาติ]]หรือ[[แก๊สปิโตรเลียมเหลว]])

{{TOC limit|3}}

== บทนำ ==
เครื่องยนต์ดีเซลทำงานโดยการอัดอากาศเพียงอย่างเดียว หรืออัดอากาศร่วมกับแก๊สที่เหลือจากการเผาไหม้จากไอเสีย (ที่เรียกว่า[[การหมุนเวียนไอเสีย]] หรือ "อีจีอาร์") อากาศถูกดูดเข้าสู่ห้องเผาไหม้ในจังหวะดูด และถูกอัดในจังหวะอัด การอัดนี้จะทำให้อุณหภูมิอากาศภายใน[[กระบอกสูบ]]สูงขึ้นจนน้ำมันดีเซลที่ถูกฉีดเป็นละอองเข้าสู่ห้องเผาไหม้สามารถจุดระเบิดได้เอง แรงบิดที่เครื่องยนต์ดีเซลผลิตขึ้นถูกควบคุมโดยการปรับ[[อัตราส่วนอากาศต่อเชื้อเพลิง]] (λ) แทนที่จะจำกัดปริมาณอากาศเข้า เครื่องยนต์ดีเซลอาศัยการเปลี่ยนแปลงปริมาณเชื้อเพลิงที่ฉีดเข้าไปแทน ดังนั้น อัตราส่วนอากาศต่อเชื้อเพลิงจึงมักสูง{{cn|date=สิงหาคม 2025}}

เครื่องยนต์ดีเซลมี[[ประสิทธิภาพเชิงความร้อน]]สูงสุด (''ดูที่'' ''[[ประสิทธิภาพเครื่องยนต์]]'') เมื่อเทียบกับ[[เครื่องยนต์สันดาปภายใน]]หรือ[[เครื่องยนต์สันดาปภายนอก|ภายนอก]]ที่ใช้งานได้จริงอื่น ๆ  เนื่องจากมี[[อัตราส่วนการขยายตัว]]ที่สูงมากและการเผาไหม้ไอดีบาง (lean burn) โดยธรรมชาติ ซึ่งช่วยให้สามารถระบายความร้อนได้ด้วยอากาศส่วนเกิน นอกจากนี้ ยังเลี่ยงการสูญเสียประสิทธิภาพเล็กน้อยเมื่อเทียบกับเครื่องยนต์เบนซินไม่ฉีดตรง เนื่องจากไม่มีเชื้อเพลิงที่ยังไม่เผาไหม้ในระหว่างองศาลิ้นซ้อนเหลื่อม (valve overlap) ดังนั้นจึงไม่มีเชื้อเพลิงที่ไหลโดยตรงจากไอดี/ตัวฉีดไปยังไอเสีย เครื่องยนต์ดีเซลรอบต่ำ (ใช้ในเรือและงานอื่น ๆ ที่น้ำหนักโดยรวมของเครื่องยนต์ไม่สำคัญนัก) สามารถมีประสิทธิภาพเชิงความร้อนได้สูงถึง 55%<ref name="Reif_2014_13" /> ขณะที่[[กังหันแก๊สวัฏจักรผสม]] (วัฏจักรไบรตันและแรงคิน) เป็นเครื่องยนต์สันดาปที่มีประสิทธิภาพมากกว่าเครื่องยนต์ดีเซล แต่ด้วยน้ำหนักและขนาด จึงไม่เหมาะสำหรับยานพาหนะหลายชนิด รวมถึง[[พาหนะทางน้ำ]]และ[[อากาศยาน]]บางประเภท เครื่องยนต์ดีเซลขนาดใหญ่ที่สุดในโลกที่ถูกนำมาใช้งานเป็นเครื่องยนต์ดีเซลเรือสองจังหวะ 14 สูบ แต่ละเครื่องสามารถผลิตกำลังสูงสุดได้เกือบ 100 เมกะวัตต์<ref name="Grote_2018_P93" />

เครื่องยนต์ดีเซลอาจได้รับการออกแบบมาให้มี[[การเผาไหม้#วัฏจักรการเผาไหม้|วัฏจักรการเผาไหม้]][[เครื่องยนต์สองจังหวะ|สองจังหวะ]]หรือ[[เครื่องยนต์สี่จังหวะ|สี่จังหวะ]] เดิมถูกใช้เป็นเครื่องจักรที่มาแทนที่[[เครื่องจักรไอน้ำ]]แบบอยู่กับที่เนื่องจากมีประสิทธิภาพสูงกว่า ตั้งแต่ทศวรรษ 1910 เครื่องยนต์ดีเซลได้ถูกนำมาใช้ใน[[เรือดำน้ำ]]และเรือกำปั่น หลังจากนั้นจึงมีการนำไปใช้กับ[[รถจักร]] รถโดยสารประจำทาง รถบรรทุก [[อุปกรณ์หนัก]] อุปกรณ์ทางการเกษตรและโรงผลิตไฟฟ้า ในทศวรรษ1930 เครื่องยนต์ดีเซลเริ่มถูกนำมาใช้ใน[[ยานยนต์]]บางรุ่นอย่างช้า ๆ ตั้งแต่[[วิกฤตพลังงานทศวรรษ 1970]] ความต้องการประสิทธิภาพการใช้เชื้อเพลิงที่สูงขึ้นส่งผลให้ผู้ผลิตยานยนต์รายใหญ่ส่วนใหญ่ต่างนำเสนอรถยนต์ที่ใช้เครื่องยนต์ดีเซลในช่วงเวลาใดเวลาหนึ่ง แม้แต่ในรถยนต์ขนาดเล็กมาก<ref name="time_forgot_2021_04_13_autoweek_com">{{citation | last = Ramey | first = Jay | url = https://www.autoweek.com/car-life/classic-cars/g36106078/diesel-cars-time-forgot/ | archive-url = https://web.archive.org/web/20221206053344/https://www.autoweek.com/car-life/classic-cars/g36106078/diesel-cars-time-forgot/ | archive-date = 2022-12-06 | title = 10 Diesel Cars That Time Forgot | date = April 13, 2021 | work = [[Autoweek]] | publisher = Hearst Autos, Inc. }}</ref><ref name="critical_evaluation_2013_springeropen_com">[https://enveurope.springeropen.com/articles/10.1186/2190-4715-25-15 "Critical evaluation of the European diesel car boom - global comparison, environmental effects and various national strategies,"] 2013, ''Environmental Sciences Europe,'' volume&nbsp;25, Article&nbsp;number:&nbsp;15, retrieved December 5, 2022</ref> ตามข้อมูลของคอนราด รีฟ (2012) ในเวลานั้นรถยนต์ดีเซลใน[[สหภาพยุโรป]]มีสัดส่วนครึ่งหนึ่งของรถยนต์ที่จดทะเบียนใหม่ทั้งหมด<ref name="Reif_2012_286" /> อย่างไรก็ดี [[มลพิษทางอากาศ]]และการปล่อยมลพิษโดยรวมของเครื่องยนต์ดีเซลนั้นควบคุมได้ยากกว่าเมื่อเทียบกับเครื่องยนต์เบนซิน ดังนั้นปัจจุบันการใช้เครื่องยนต์ดีเซลในสหรัฐส่วนใหญ่จึงจำกัดอยู่แค่ในรถยนต์ขนาดใหญ่ทั้งบนถนนและ[[ยานพาหนะนอกถนน|นอกถนน]]<ref name="every_new_diesel_2021_03_06_caranddriver_com">Huffman, John Pearley: [https://www.caranddriver.com/features/g20980996/diesel-car-truck-suv/ "Every New 2021 Diesel for Sale in the U.S. Today,"] March 6, 2021, ''[[Car and Driver]],'' retrieved December 5, 2022</ref><ref name="the_15_best_2021_04_23_usnews_com">Gorzelany, Jim: [https://cars.usnews.com/cars-trucks/advice/best-diesel-cars?slide=18 "The Best 15 Best Diesel Vehicles of 2021,"] April 23, 2021, ''[[U.S. News]],'' retrieved December 5, 2022</ref>

แม้ในอดีตอุตสาหกรรมการบินจะเลี่ยงการใช้เครื่องยนต์ดีเซล แต่ในศตวรรษที่ 21 เครื่องยนต์ดีเซลสำหรับอากาศยานกลับได้รับความนิยมมากขึ้น ตั้งแต่ปลายทศวรรษ 1990 การพัฒนาและผลิตเครื่องยนต์ดีเซลสำหรับอากาศยานได้เพิ่มขึ้นอย่างก้าวกระโดด ด้วยเหตุผลหลายประการ รวมถึงข้อได้เปรียบโดยธรรมชาติของเครื่องยนต์ดีเซลเหนือเครื่องยนต์เบนซิน แต่ก็มีปัจจัยเฉพาะที่เพิ่งเกิดขึ้นในวงการการบินด้วยเช่นกัน โดยระหว่าง ค.ศ. 2002 ถึง 2018 มีการส่งมอบเครื่องยนต์ดังกล่าวไปแล้วกว่า 5,000 เครื่องทั่วโลก โดยเฉพาะสำหรับ[[อากาศยานขนาดเล็ก]]และ[[อากาศยานไร้คนขับ]]<ref name="inside_2018_08_01_flyingmag_com">[https://www.flyingmag.com/inside-aviation-diesel-revolution/ "Inside the Diesel Revolution,"] August 1, 2018, ''[[Flying (magazine)|Flying]],''  retrieved December 5, 2022</ref><ref name="diamond_2020_12_30_avweb_com">O'Connor, Kate: [https://www.avweb.com/aviation-news/diamond-rolls-out-500th-da40-ng/ "Diamond Rolls Out 500th DA40 NG,"] December 30, 2020 Updated: December 31, 2020, ''[[Avweb]],'' retrieved December 5, 2022</ref>

== ประวัติศาสตร์ ==
===ความคิดของดีเซล===
[[File:Lumbar patent dieselengine.jpg|thumb|right|สิทธิบัตรของ[[รูด็อล์ฟ ดีเซิล]]ใน ค.ศ. 1893 เกี่ยวกับเครื่องจักรความร้อนที่เหมาะสม]]
[[File:Experimental Diesel Engine.jpg|thumb|right|ต้นแบบเครื่องยนต์ดีเซลรุ่นที่สอง เป็นรุ่นที่ได้รับการดัดแปลงจากเครื่องยนต์ทดลองรุ่นแรก วันที่ 17 กุมภาพันธ์ ค.ศ. 1894 เครื่องยนต์นี้สามารถทำงานได้ด้วยตัวเองเป็นครั้งแรก<ref name="Diesel_1913_22" /><br /><br />ประสิทธิภาพยังผล 16.6% <br />การกินเชื้อเพลิง 519 กรัม·กิโลวัตต์<sup>−1</sup>·ชั่วโมง<sup>−1</sup> ]]

ใน ค.ศ. 1878 [[รูด็อล์ฟ ดีเซิล]] ซึ่งเป็นนักศึกษาอยู่ที่ "[[มหาวิทยาลัยเทคนิคมิวนิก|โพลีเทคนิคุม]]" ใน[[มิวนิก]] ได้เข้าฟังการบรรยายของ[[คาร์ล ฟ็อน ลินเดอ]] ลินเดอได้อธิบายว่าเครื่องจักรไอน้ำสามารถเปลี่ยนพลังงานความร้อนให้เป็นพลังงานกลได้เพียง 6–10% เท่านั้น แต่สำหรับ[[เครื่องจักรความร้อนการ์โน|วัฏจักรการ์โน]]จะสามารถเปลี่ยนพลังงานความร้อนให้เป็นพลังงานกลได้มากขึ้นมากโดยอาศัยการเปลี่ยนแปลงสภาวะแบบอุณหภูมิคงตัว ตามคำกล่าวของดีเซิล นี่เป็นจุดประกายความคิดในการสร้างเครื่องยนต์ประสิทธิภาพสูงที่สามารถทำงานตามวัฏจักรการ์โนได้<ref name="Diesel_1913_1" /> ดีเซิลยังได้รู้จักกับ[[ลูกสูบไฟ]] (fire piston) เครื่องมือดั้งเดิมที่ใช้หลักการอัดอากาศแบบ[[กระบวนการอะเดียแบติก|อะเดียแบติก]]อย่างรวดเร็วเพื่อ[[การจุดไฟ|จุดไฟ]] และเป็นเครื่องมือที่ลินเดอได้มาจาก[[เอเชียตะวันออกเฉียงใต้]]<ref name="ogata">{{Cite web |last1=Ogata |first1=Masanori |last2=Shimotsuma |first2=Yorikazu |date=ตุลาคม 20–21, 2002 |title=Origin of Diesel Engine is in Fire Piston of Mountainous People Lived in Southeast Asia |url=http://inet.museum.kyoto-u.ac.jp/conference02/MasanoriOGATA.html |url-status=dead |archive-url=https://web.archive.org/web/20070523214754/http://inet.museum.kyoto-u.ac.jp/conference02/MasanoriOGATA.html |archive-date=พฤษภาคม 23, 2007 |access-date=2007-05-28 |website=First International Conference on Business and technology Transfer |publisher=Japan Society of Mechanical Engineers}}</ref> หลังใช้เวลาหลายปีในการพัฒนาความคิดของเขา ดีเซิลได้ตีพิมพ์ผลงานเหล่านั้นใน ค.ศ. 1893 ในเรียงความเรื่อง ''ทฤษฎีและการสร้างเครื่องจักรความร้อนที่เหมาะสม'' (''Theory and Construction of a Rational Heat Motor'')<ref name="Diesel_1913_1" />

====อุณหภูมิคงตัว====
ดีเซิลถูกวิพากษ์วิจารณ์อย่างหนักสำหรับเรียงความของเขา แต่มีเพียงไม่กี่คนเท่านั้นที่พบข้อผิดพลาดที่เขาทำ<ref name="Sittauer_1990_70" /> ''เครื่องจักรความร้อนที่เหมาะสม'' ที่เขาคิดขึ้นนั้นควรจะใช้วัฏจักรอุณหภูมิคงตัว (มีการอัดตัวแบบอุณหภูมิคงตัว) ซึ่งจะต้องการระดับการอัดที่สูงกว่าการจุดระเบิดด้วยการอัดอากาศ แนวคิดของดีเซิลคือการอัดอากาศให้แน่นมากจนอุณหภูมิอากาศสูงกว่าอุณหภูมิการเผาไหม้ อย่างไรก็ดี เครื่องยนต์เช่นนั้นไม่สามารถทำงานได้จริงเลย<ref name="Sittauer_1990_71" /><ref name="Sass_1962_398" /><ref name="Sass_1962_399" /> ในสิทธิบัตรสหรัฐ ค.ศ. 1892 (ได้รับอนุมัติใน ค.ศ. 1895) เลขที่ 542846 ดีเซิลได้อธิบายการอัดที่จำเป็นสำหรับวัฏจักรของเขาไว้ดังนี้:<ref name="Diesel_1895" />
{{blockquote|อากาศบริสุทธิ์ในบรรยากาศจะถูกอัดตามเส้นโค้ง 1 2 จนถึงระดับที่ว่า ก่อนการจุดระเบิดหรือการเผาไหม้จะเกิดขึ้น ความดันสูงสุดของไดอะแกรมและอุณหภูมิสูงสุดจะถูกสร้างขึ้นมา นั่นคือ อุณหภูมิที่การเผาไหม้ที่จะตามมาจะต้องเกิดขึ้น ไม่ใช่อุณหภูมิเผาไหม้หรือจุดติดไฟ เพื่อให้เข้าใจได้ชัดเจนยิ่งขึ้น สมมติว่าการเผาไหม้ที่จะตามมาจะเกิดขึ้นที่อุณหภูมิ 700° ในกรณีนั้นความดันเริ่มต้นจะต้องเป็นหกสิบสี่บรรยากาศ หรือสำหรับอุณหภูมิ 800° ความดันจะต้องเป็นเก้าสิบบรรยากาศ และเป็นเช่นนี้เรื่อยไป หลังจากนั้นเชื้อเพลิงที่ถูกแบ่งเป็นละอองอย่างละเอียดจะถูกฉีดเข้าไปในอากาศที่ถูกอัดไว้แล้วทีละน้อย ซึ่งเชื้อเพลิงจะติดไฟทันทีเมื่อถูกฉีดเข้าไปเนื่องจากอากาศมีอุณหภูมิสูงกว่าจุดติดไฟของเชื้อเพลิงมาก ดังนั้นลักษณะของวัฏจักรตามสิ่งประดิษฐ์ปัจจุบันของข้าพเจ้าคือการเพิ่มความดันและอุณหภูมิให้ถึงระดับสูงสุด ไม่ใช่โดยการเผาไหม้ แต่เป็นก่อนการเผาไหม้โดยการอัดอากาศด้วยกลไก และหลังจากนั้นจึงเกิดการทำงานโดยที่ความดันและอุณหภูมิไม่เพิ่มขึ้น โดยการเผาไหม้จะค่อย ๆ เกิดขึ้นระหว่างช่วงของจังหวะที่กำหนดโดยการหยุดจ่ายเชื้อเพลิง}}

====ความดันคงตัว====
ภายในเดือนมิถุนายน ค.ศ. 1893 ดีเซิลได้ตระหนักว่าวัฏจักรดั้งเดิมของเขาไม่สามารถทำงานได้ และได้นำวัฏจักรความดันคงตัวมาใช้แทน<ref name="Sass_1962_402" /> ดีเซลอธิบายวัฏจักรนี้ในคำขอจดสิทธิบัตร ค.ศ. 1895 สังเกตว่าไม่มีการกล่าวถึงอุณหภูมิการอัดที่สูงเกินกว่าอุณหภูมิการเผาไหม้อีกต่อไป ตอนนี้ระบุเพียงแค่ว่าการอัดต้องเพียงพอจะทำให้เกิดการจุดระเบิด<ref name="Diesel_1898" /><ref name="Diesel_1893" /><ref name="e-rara.ch" />
{{blockquote|1. ในเครื่องยนต์สันดาปภายใน การรวมกันของกระบอกสูบและลูกสูบที่สร้างและจัดวางให้สามารถอัดอากาศได้ในระดับที่ทำให้อุณหภูมิสูงกว่าจุดติดไฟของเชื้อเพลิง แหล่งจ่ายอากาศหรือแก๊สอัด แหล่งจ่ายเชื้อเพลิง ลิ้นควบคุมการจ่ายเชื้อเพลิง ช่องทางจากแหล่งจ่ายอากาศไปยังกระบอกสูบที่เชื่อมต่อกับลิ้นควบคุมการจ่ายเชื้อเพลิง ช่องทางเข้าสู่กระบอกสูบที่เชื่อมต่อกับแหล่งจ่ายอากาศและกับลิ้นเชื้อเพลิง และลิ้นตัดการจ่ายน้ำมัน ตามที่ได้อธิบายไว้โดยหลักการ}}

ใน ค.ศ. 1892 ดีเซิลได้รับสิทธิบัตรในเยอรมนี สวิตเซอร์แลนด์ สหราชอาณาจักร และสหรัฐสำหรับ "วิธีการและอุปกรณ์สำหรับการเปลี่ยนความร้อนให้เป็นงาน" (Method of and Apparatus for Converting Heat into Work)<ref name="Diesel_1892" /> ใน ค.ศ. 1894 และ 1895 เขายื่นขอสิทธิบัตรและเอกสารเพิ่มเติมสำหรับเครื่องยนต์ของเขาในหลายประเทศ สิทธิบัตรฉบับแรกออกในประเทศสเปน (เลขที่ 16,654)<ref>{{patent|ES|16654|"Perfeccionamientos en los motores de combustión interior."}}</ref> ฝรั่งเศส (เลขที่ 243,531) และเบลเยียม (เลขที่ 113,139) ในเดือนธันวาคม ค.ศ. 1894 และในเยอรมนี (เลขที่ 86,633) ใน ค.ศ. 1895 และสหรัฐ (เลขที่ 608,845) ใน ค.ศ. 1898<ref name="Diesel_1895_2" />

ดีเซิลถูกโจมตีและวิพากษ์วิจารณ์เป็นเวลาหลายปี นักวิจารณ์อ้างว่าดีเซิลไม่ได้คิดค้นเครื่องยนต์ใหม่ และการประดิษฐ์เครื่องยนต์ดีเซลเป็นการฉ้อโกง อ็อทโท เคอห์เลอร์และ{{ill|เอมิล กาปิเทน|de}} เป็นสองนักวิจารณ์ที่มีชื่อเสียงที่สุดในยุคของดีเซล<ref name="Sass_1962_486" /> เคอห์เลอร์ตีพิมพ์เรียงความใน ค.ศ. 1887 ซึ่งเขาอธิบายถึงเครื่องยนต์ที่มีลักษณะคล้ายกับเครื่องยนต์ที่ดีเซิลอธิบายไว้ในเรียงความของเขาใน ค.ศ. 1893 เคอห์เลอร์สรุปว่าเครื่องยนต์ดังกล่าวไม่สามารถทำงานใด ๆ<ref name="Sass_1962_399" /><ref name="Sass_1962_400" />  เอมิล กาปิเทน ได้สร้างเครื่องยนต์ที่ใช้น้ำมันปิโตรเลียมพร้อมระบบจุดระเบิดด้วยท่อเรืองแสงในต้นทศวรรษ 1890<ref name="Sass_1962_412" /> เขาอ้างทั้งที่รู้ดีว่าเครื่องยนต์ของเขานั้นทำงานในลักษณะเดียวกับเครื่องยนต์ของดีเซล คำกล่าวอ้างของเขาไม่มีมูลความจริงและเขาแพ้คดีฟ้องร้องสิทธิบัตรต่อดีเซล<ref name="Sass_1962_487" /> เครื่องยนต์อื่น ๆ เช่น [[เครื่องยนต์กระเปาะร้อน|เครื่องยนต์แอครอยด์]]และ[[เครื่องยนต์เบรย์ตัน]] ก็ใช้วัฏจักรการทำงานต่างจากวัฏจักรของเครื่องยนต์ดีเซล<ref name="Sass_1962_400" /><ref name="Sass_1962_414" /> [[ฟรีดริช ซาสส์]]กล่าวว่าเครื่องยนต์ดีเซลเป็น "ผลงานของดีเซิลโดยแท้จริง" และ "เรื่องปรัมปราเกี่ยวกับดีเซิล" ใด ๆ ก็ตามเป็น "[[ประวัติศาสตร์เท็จ]]"<ref name="Sass_1962_518" />

===เครื่องยนต์ดีเซลตัวแรก===
[[File:Historical Diesel engine in Deutsches Museum.jpg|thumb|right|เครื่องยนต์ดีเซลตัวแรกที่ใช้งานได้จริง ออกแบบโดยอิมานูเอล เลาส์เตอร์ สร้างขึ้นใหม่ทั้งหมด และสร้างเสร็จในเดือนตุลาคม ค.ศ. 1896<ref name="Diesel_1913_64" /><ref name="Diesel_1913_75" /><ref name="Diesel_1913_78" /><br /><br />กำลัง 13.1&nbsp;กิโลวัตต์<br />ประสิทธิภาพยังผล 26.2% <br />การกินเชื้อเพลิง 324&nbsp;กรัม·กิโลวัตต์<sup>−1</sup>·ชั่วโมง<sup>−1</sup>]]
ดีเซลเสาะหาบริษัทและโรงงานที่จะสร้างเครื่องยนต์ของเขา ด้วยความช่วยเหลือจาก[[โมริทซ์ ชโรเทอร์]]และ{{interlanguage link|มักซ์ ฟรีดริก กูเตอร์มุท{{!}}มักซ์ กูเตอร์มุท|de|Max Gutermuth}}<ref name="Sass_1962_395" /> เขาสามารถโน้มน้าวทั้งบริษัท [[Krupp]] ในเอสเซิน และบริษัท [[Maschinenfabrik Augsburg]]<ref name="Sittauer_1990_74" /> ได้สำเร็จ มีการลงนามในสัญญาในเดือนเมษายน ค.ศ. 1893<ref name="Sass_1962_559" /> และในช่วงต้นฤดูร้อน ค.ศ. 1893 เครื่องต้นแบบเครื่องแรกของดีเซิลก็ถูกสร้างขึ้นใน[[เอาคส์บวร์ค]] วันที่ 10 สิงหาคม ค.ศ. 1893 ได้เกิดการจุดระเบิดครั้งแรก โดยใช้น้ำมันเบนซินเป็นเชื้อเพลิง ในช่วงฤดูหนาว ค.ศ. 1893/1894 ดีเซิลได้ออกแบบเครื่องยนต์ที่มีอยู่ใหม่ และภายในวันที่ 18 มกราคม ค.ศ. 1894 ช่างของเขาได้ปรับเปลี่ยนให้เป็นเครื่องยนต์ต้นแบบตัวที่สอง<ref name="Diesel_1913_17" /> ในเดือนมกราคมปีนั้น มีการเพิ่ม[[การฉีดด้วยอากาศ]]เข้าไปที่ฝาสูบของเครื่องยนต์และทำการทดสอบ<ref name="Sass_1962_444" /> [[ฟรีดริช ซาสส์]]ให้เหตุผลว่า สามารถสันนิษฐานได้ว่าดีเซิลลอกเลียนแบบแนวคิดของการฉีดเชื้อเพลิงด้วยลมมาจาก[[จอร์จ บี. เบรย์ตัน]]<ref name="Sass_1962_414" /> แม้ดีเซิลจะปรับปรุงระบบดังกล่าวอย่างมากก็ตาม<ref name="Sass_1962_415" /> วันที่ 17 กุมภาพันธ์ ค.ศ. 1894 เครื่องยนต์ที่ออกแบบใหม่สามารถหมุนได้ 88 รอบต่อนาที<ref name="Diesel_1913_22" /> หลังจากข่าวนี้ หุ้นของ Maschinenfabrik Augsburg ก็เพิ่มขึ้นถึง 30% ซึ่งแสดงให้เห็นถึงความต้องการอันมหาศาลที่คาดว่าจะเกิดขึ้นสำหรับเครื่องยนต์ที่มีประสิทธิภาพมากขึ้น<ref name="Moon_1974" /> วันที่ 26 มิถุนายน ค.ศ. 1895 เครื่องยนต์มีประสิทธิภาพยังผล 16.6% และมีการกินเชื้อเพลิง 519&nbsp;กรัม·กิโลวัตต์<sup>−1</sup>·ชั่วโมง<sup>−1</sup><ref name="Tschöke_2018_6" /> อย่างไรก็ดี แม้จะพิสูจน์แนวคิดได้แล้ว แต่เครื่องยนต์ก็ยังคงสร้างปัญหา<ref name="Sass_1962_462" /> และดีเซิลก็ไม่สามารถสร้างความก้าวหน้าอย่างเป็นรูปธรรมได้<ref name="Sass_1962_463" /> ดังนั้น Krupp จึงพิจารณายกเลิกสัญญาที่ได้ทำไว้กับดีเซิล<ref name="Sass_1962_464" /> ดีเซิลถูกบีบให้ต้องปรับปรุงการออกแบบเครื่องยนต์ของเขาและเร่งสร้างเครื่องยนต์ต้นแบบเครื่องที่สาม ระหว่างวันที่ 8 พฤศจิกายน ถึง 20 ธันวาคม ค.ศ. 1895 เครื่องต้นแบบตัวที่สองได้ผ่านการทดสอบบนแท่นทดสอบได้สำเร็จเป็นเวลามากกว่า 111 ชั่วโมง ในรายงานเดือนมกราคม ค.ศ. 1896 สิ่งนี้ถือเป็นความสำเร็จ<ref name="Sass_1962_466" />

ในเดือนกุมภาพันธ์ ค.ศ. 1896 ดีเซลได้พิจารณาติดตั้งระบบอัดบรรจุอากาศ (supercharging) ให้กับเครื่องต้นแบบตัวที่สาม<ref name="Sass_1962_467" /> [[อิมานูเอล เลาส์เตอร์]] ซึ่งได้รับคำสั่งให้ออกแบบเครื่องต้นแบบเครื่องที่สาม "[[Motor 250/400]]" ได้ออกแบบเสร็จในวันที่ 30 เมษายน ค.ศ. 1896 ระหว่างฤดูร้อนปีนั้น เครื่องยนต์ได้ถูกสร้างขึ้นและแล้วเสร็จในวันที่ 6 ตุลาคม ค.ศ. 1896<ref name="Sass_1962_474" /> มีการทดสอบอย่างต่อเนื่องจนถึงต้น ค.ศ. 1897<ref name="Sass_1962_475" /> การทดสอบต่อสาธารณะครั้งแรกเริ่มขึ้นในวันที่ 1 กุมภาพันธ์ ค.ศ. 1897<ref name="Sass_1962_479" /> การทดสอบที่ดำเนินการโดย[[โมริทซ์ ชโรเทอร์]]เมื่อวันที่ 17 กุมภาพันธ์ ค.ศ. 1897 ถือเป็นการทดสอบครั้งสำคัญของเครื่องยนต์ของดีเซล เครื่องยนต์มีกำลัง 13.1 กิโลวัตต์ โดยมีอัตรากินเชื้อเพลิงจำเพาะอยู่ที่ 324 กรัม·<sup>−1</sup>กิโลวัตต์·ชั่วโมง<sup>−1</sup><ref name="Sass_1962_480" /> ส่งผลให้มีประสิทธิภาพยังผลอยู่ที่ 26.2%<ref name="Tschöke_2018_7" /><ref name="Mau_1984_7" /> ภายใน ค.ศ. 1898 ดีเซิลก็ได้กลายเป็นเศรษฐีเงินล้าน<ref name="Sass_1962_484" />

=== เส้นเวลา ===
====ทศวรรษ 1890====
* 1893: เรียงความของ[[รูด็อล์ฟ ดีเซิล]] ''Theory and Construction of a Rational Heat Motor'' (''[[ทฤษฎีและการสร้างเครื่องจักรความร้อนที่เหมาะสม]]'') ได้รับการตีพิมพ์<ref name="Diesel_1893_EN" /><ref name="Diesel_1893_1" />
* 1893: 21 กุมภาพันธ์ ดีเซิลและบริษัท Maschinenfabrik Augsburg ลงนามในสัญญาที่อนุญาตให้ดีเซิลสร้างเครื่องยนต์ต้นแบบ<ref name="Diesel_1913_6" />
* 1893: 23 กุมภาพันธ์ ดีเซิลได้รับสิทธิบัตร (RP 67207) "''Arbeitsverfahren und Ausführungsart für Verbrennungsmaschinen''" (วิธีการทำงานและเทคนิคสำหรับเครื่องยนต์สันดาปภายใน)
* 1893: 10 เมษายน ดีเซิลและบริษัท Krupp ลงนามในสัญญาที่อนุญาตให้ดีเซลสร้างเครื่องยนต์ต้นแบบ<ref name="Diesel_1913_6" />
