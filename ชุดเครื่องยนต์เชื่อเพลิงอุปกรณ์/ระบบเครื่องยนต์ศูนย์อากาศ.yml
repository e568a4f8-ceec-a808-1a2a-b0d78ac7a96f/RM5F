===เจลลิง===
น้ำมันดีเซล DIN 51601 มีแนวโน้มที่จะขุ่นข้นหรือกลายเป็นไขในอากาศเย็นจัด ทั้งสองคำนี้หมายถึงการที่น้ำมันดีเซลแข็งตัวเป็นผลึกบางส่วน ผลึกเหล่านี้จะสะสมอยู่ในระบบเชื้อเพลิง (โดยเฉพาะในตัวกรองเชื้อเพลิง) จนในที่สุดทำให้เครื่องยนต์ขาดเชื้อเพลิงและหยุดทำงาน<ref name="vB_2017_1018" /> มีการใช้เครื่องทำความร้อนไฟฟ้ากำลังต่ำใน[[ถังเชื้อเพลิง]]และรอบท่อเชื้อเพลิงเพื่อแก้ปัญหานี้ นอกจากนี้ เครื่องยนต์ส่วนใหญ่ยังมีระบบส่งเชื้อเพลิงส่วนเกินกลับถัง โดยเชื้อเพลิงส่วนเกินจากปั๊มตัวฉีดและตัวฉีดจะถูกส่งกลับไปที่ถังเชื้อเพลิง เมื่อเครื่องยนต์อุ่นขึ้น การส่งเชื้อเพลิงอุ่นกลับไปจะช่วยป้องกันการเป็นไขในถัง ก่อนจะมีเครื่องยนต์ดีเซลฉีดตรง ผู้ผลิตบางราย เช่น BMW แนะนำให้ผสมน้ำมันเบนซินกับน้ำมันดีเซลได้ถึง 30% โดยการเติมน้ำมันเบนซินเข้าไปในรถยนต์ดีเซลเพื่อป้องกันไม่ให้น้ำมันกลายเป็นไขเมื่ออุณหภูมิลดลงต่ำกว่า -15 °C<ref name="BMW_1985" />

== ความปลอดภัย ==
===ความไวไฟของเชื้อเพลิง===
น้ำมันดีเซล[[สภาพอัดได้และความไวไฟ|ไวไฟ]]ได้ยากกว่าน้ำมันเบนซิน เนื่องจากมีจุดวาบไฟที่ 55 °C<ref name="vB_2017_1018" /><ref name="vPhilippovich_1939_42" /> ทำให้มีความเสี่ยงต่ำกว่าที่จะเกิดเพลิงไหม้จากเชื้อเพลิงในรถยนต์ที่ใช้เครื่องยนต์ดีเซล

น้ำมันดีเซลสามารถก่อให้เกิดการผสมกันของอากาศและไอระเหยที่ระเบิดได้ภายใต้เงื่อนไขที่เหมาะสม อย่างไรก็ดี เมื่อเทียบกับน้ำมันเบนซินแล้ว น้ำมันดีเซลมีโอกาสน้อยกว่าเนื่องจากมี[[ความดันไอ]]ต่ำกว่า ซึ่งเป็นสิ่งชี้บอกอัตราการระเหย เอกสารข้อมูลความปลอดภัยวัสดุ<ref name="Ultra low sulfur diesel" /> สำหรับน้ำมันดีเซลกำมะถันต่ำพิเศษระบุถึงอันตรายจากการระเบิดของไอระเหยสำหรับน้ำมันดีเซลในอาคาร กลางแจ้ง หรือในท่อน้ำทิ้ง

===มะเร็ง===
[[ไอเสีย|ไอเสียดีเซล]]ได้รับการจัดประเภทให้เป็น[[IARC กลุ่มที่ 1|สารก่อมะเร็งกลุ่มที่ 1 ของ IARC]] โดยเป็นสาเหตุของ[[มะเร็งปอด]]และมีความเสี่ยงเพิ่มขึ้นต่อ[[มะเร็งกระเพาะปัสสาวะ]]<ref name="PRDEE">{{Cite web |title=IARC: Diesel Engine Exhaust Carcinogenic |url=https://www.iarc.fr/wp-content/uploads/2018/07/pr213_E.pdf/ |url-status=dead |archive-url=https://web.archive.org/web/20120912080023/http://press.iarc.fr/pr213_E.pdf |archive-date=กันยายน 12, 2012 |access-date=มิถุนายน 12, 2012 |publisher=International Agency for Research on Cancer (IARC) |format=Press release |quote=June 12, 2012 – After a week-long meeting of international experts, the International Agency for Research on Cancer (IARC), which is part of the World Health Organization (WHO), today classified diesel engine exhaust as carcinogenic to humans (Group 1), based on sufficient evidence that exposure is associated with an increased risk for bladder cancer |df=mdy}}</ref>

