* 1901: อิมานูเอล เลาว์เตอร์ ออกแบบเครื่องยนต์ดีเซล[[ลูกสูบทรังก์]] (trunk piston) ตัวแรก (DM 70)<ref name="Sass_1962_524" />
* 1901: ภายในปีนี้ บริษัท [[มัน (บริษัท)|MAN]] ได้ผลิตกระบอกสูบเครื่องยนต์ดีเซลสำหรับใช้งานเชิงพาณิชย์จำนวน 77 กระบอกสูบ<ref name="Sass_1962_523" />
