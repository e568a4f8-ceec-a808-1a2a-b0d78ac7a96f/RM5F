;"><div>The feedstock used to make the biodiesel alters the fuel's properties by changing the average carbon chain length and number of double bonds present in the fatty acid methyl esters.&lt;ref&gt;{{cite journal |last1=Altin |first1=R. |last2=Cetinkaya |first2=S. |last3=Yucesu |first3=H.S. |year=2001 |title=Effect of Fatty Acid Profiles and Molecular Structures of Nine New Source of Biodiesel on Combustion and Emission |journal=Energy Conversion and Management |volume=42 |issue=5 |pages=529–538 |doi=10.1016/s0196-8904(00)00080-7}}&lt;/ref&gt;</div></td> <td class="diff-marker" data-marker="+"></td> <td style="color: #202122; font-size: 88%; border-style: solid; border-width: 1px 1px 1px 4px; border-radius: 0.33em; border-color: #a3d3ff; vertical-align: top; white-space: pre-wrap;"><div>The feedstock used to make the biodiesel alters the fuel's properties by changing the average carbon chain length and number of double bonds present in the fatty acid methyl esters.&lt;ref&gt;{{cite journal |last1=Altin |first1=R. |last2=Cetinkaya |first2=S. |last3=Yucesu |first3=H.S. |year=2001 |title=Effect of Fatty Acid Profiles and Molecular Structures of Nine New Source of Biodiesel on Combustion and Emission |journal=Energy Conversion and Management |volume=42 |issue=5 |pages=529–538 |doi=10.1016/s0196-8904(00)00080-7}}&lt;/ref&gt;<ins style="font-weight: bold; text-decoration: none;">{{qn|date=July 2026}}</ins></div></td> </tr> <tr> <td class="diff-marker"></td> <td style="background-color: #f8f9fa; color: #202122; font-size: 88%; border-style: solid; border-width: 1px 1px 1px 4px; border-radius: 0.33em; border-color: #eaecf0; vertical-align: top; white-space: pre-wrap;"><br /></td> <td class="diff-marker"></td> <td style="background-color: #f8f9fa; color: #202122; font-size: 88%; border-style: solid; border-width: 1px 1px 1px 4px; border-radius: 0.33em; border-color: #eaecf0; vertical-align: top; white-space: pre-wrap;"><br /></td> </tr> <tr> <td class="diff-marker"></td> <td style="background-color: #f8f9fa; color: #202122; font-size: 88%; border-style: solid; border-width: 1px 1px 1px 4px; border-radius: 0.33em; border-color: #eaecf0; vertical-align: top; white-space: pre-wrap;"><div>==== Low-temperature gelling ====</div></td> <td class="diff-marker"></td> <td style="background-color: #f8f9fa; color: #202122; font-size: 88%; border-style: solid; border-width: 1px 1px 1px 4px; border-radius: 0.33em; border-color: #eaecf0; vertical-align: top; white-space: pre-wrap;"><div>==== Low-temperature gelling ====</div></td> </tr> </table></summary>
