<summary type="html"><p><span class="autocomment">Biodiesel feedstocks: </span> Deduplicate reference</p> <table style="background-color: #fff; color: #202122;" data-mw-interface=""> <col class="diff-marker" /> <col class="diff-content" /> <col class="diff-marker" /> <col class="diff-content" /> <tr class="diff-title" lang="en"> <td colspan="2" style="background-color: #fff; color: #202122; text-align: center;">← Previous revision</td> <td colspan="2" style="background-color: #fff; color: #202122; text-align: center;">Revision as of 06:16, 18 April 2026</td> </tr><tr> <td colspan="2" class="diff-lineno">Line 182:</td> <td colspan="2" class="diff-lineno">Line 182:</td> </tr> <tr> <td class="diff-marker"></td> <td style="background-color: #f8f9fa; color: #202122; font-size: 88%; border-style: solid; border-width: 1px 1px 1px 4px; border-radius: 0.33em; border-color: #eaecf0; vertical-align: top; white-space: pre-wrap;"><div>* Oil from [[halophyte]]s such as ''[[Salicornia#Industrial use (contemporary)|Salicornia bigelovii]]'', which can be grown using saltwater in coastal areas where conventional crops cannot be grown, with yields equal to the yields of soybeans and other oilseeds grown using freshwater irrigation&lt;ref name="Glenn1998"&gt;{{cite journal|last=Glenn|first=Edward P.|author2=Brown, J. Jed|author3=O'Leary, James W.|date=August 1998|title=Irrigating Crops with Seawater|journal=[[Scientific American]]|volume=279|pages=76–81 [79]|issue=August 1998|url=http://www.miracosta.edu/home/kmeldahl/writing/..%5Carticles/crops.pdf|access-date=2008-11-17|doi=10.1038/scientificamerican0898-76|bibcode=1998SciAm.279b..76G|archive-date=2015-09-06|archive-url=https://web.archive.org/web/20150906075620/http://www.miracosta.edu/home/kmeldahl/articles/crops.pdf|url-status=live}}&lt;/ref&gt;</div></td> <td class="diff-marker"></td> <td style="background-color: #f8f9fa; color: #202122; font-size: 88%; border-style: solid; border-width: 1px 1px 1px 4px; border-radius: 0.33em; border-color: #eaecf0; vertical-align: top; white-space: pre-wrap;"><div>* Oil from [[halophyte]]s such as ''[[Salicornia#Industrial use (contemporary)|Salicornia bigelovii]]'', which can be grown using saltwater in coastal areas where conventional crops cannot be grown, with yields equal to the yields of soybeans and other oilseeds grown using freshwater irrigation&lt;ref name="Glenn1998"&gt;{{cite journal|last=Glenn|first=Edward P.|author2=Brown, J. Jed|author3=O'Leary, James W.|date=August 1998|title=Irrigating Crops with Seawater|journal=[[Scientific American]]|volume=279|pages=76–81 [79]|issue=August 1998|url=http://www.miracosta.edu/home/kmeldahl/writing/..%5Carticles/crops.pdf|access-date=2008-11-17|doi=10.1038/scientificamerican0898-76|bibcode=1998SciAm.279b..76G|archive-date=2015-09-06|archive-url=https://web.archive.org/web/20150906075620/http://www.miracosta.edu/home/kmeldahl/articles/crops.pdf|url-status=live}}&lt;/ref&gt;</div></td> </tr> <tr> <td class="diff-marker"></td> <td style="background-color: #f8f9fa; color: #202122; font-size: 88%; border-style: solid; border-width: 1px 1px 1px 4px; border-radius: 0.33em; border-color: #eaecf0; vertical-align: top; white-space: pre-wrap;"><div>* Sewage Sludge – The sewage-to-biofuel field is attracting interest from major companies like Waste Management and startups like InfoSpi, which are betting that renewable sewage biodiesel can become competitive with petroleum diesel on price.&lt;ref&gt;{{cite news|last=Casey|first=Tina|date=May 2010|title=The Smell of Change is in the Air with Renewable Biodiesel from Sewage|newspaper=[[Scientific American]]|url=http://www.scientificamerican.com/article.cfm?id=the-smell-of-change-is-in-the-air-w-2010-05}}&lt;/ref&gt;</div></td> <td class="diff-marker"></td> <td style="background-color: #f8f9fa; color: #202122; font-size: 88%; border-style: solid; border-width: 1px 1px 1px 4px; border-radius: 0.33em; border-color: #eaecf0; vertical-align: top; white-space: pre-wrap;"><div>* Sewage Sludge – The sewage-to-biofuel field is attracting interest from major companies like Waste Management and startups like InfoSpi, which are betting that renewable sewage biodiesel can become competitive with petroleum diesel on price.&lt;ref&gt;{{cite news|last=Casey|first=Tina|date=May 2010|title=The Smell of Change is in the Air with Renewable Biodiesel from Sewage|newspaper=[[Scientific American]]|url=http://www.scientificamerican.com/article.cfm?id=the-smell-of-change-is-in-the-air-w-2010-05}}&lt;/ref&gt;</div></td> </tr> <tr> <td class="diff-marker" data-marker="−"></td> <td style="color: #202122; font-size: 88%; border-style: solid; border-width: 1px 1px 1px 4px; border-radius: 0.33em; border-color: #ffe49c; vertical-align: top; white-space: pre-wrap;"><div>* [[Insect]] oil is a potential feedstock for biodiesel production. The oil is extracted from pupae or larvae, generally using a solvent after grinding and drying. This oil then undergoes transesterification to produce biodiesel.<del style="font-weight: bold; text-decoration: none;"> </del>&lt;ref&gt;{{patent|EP|2479250|"Biodiesel and preparation method thereof"}}&lt;/ref&gt;<del style="font-weight: bold; text-decoration: none;"> </del>&lt;ref&gt;{{patent|KR|102418025|"Method of preparing biodiesel according to dry condition of insect"}}&lt;/ref&gt;<del style="font-weight: bold; text-decoration: none;"> </del>&lt;ref&gt;{{patent|CN|101805672|"Biodiesel and preparation method thereof"}}&lt;/ref&gt;<del style="font-weight: bold; text-decoration: none;"> </del>&lt;ref&gt;{{patent|CN|106819662|"Method for producing insect proteins and grease by efficient conversion of crop straws through multi-stage cooperation of insects"}}&lt;/ref&gt; Biodiesel can be produced from black soldier fly oil ([[Hermetia illucens]]).<del style="font-weight: bold; text-decoration: none;"> </del>&lt;ref&gt;{{patent|EP|3980392|"biomass composition comprising insect particles, method for producing the same, and use of said biomass composition"}}&lt;/ref&gt;<del style="font-weight: bold; text-decoration: none;"> </del>&lt;ref<del style="font-weight: bold; text-decoration: none;">&gt;{{patent|CN|106819662|</del>" <del style="font-weight: bold; text-decoration: none;">Method for producing insect proteins and grease by efficient conversion of crop straws through multi-stage cooperation of insects "}}&lt;</del>/<del style="font-weight: bold; text-decoration: none;">ref</del>&gt;<del style="font-weight: bold; text-decoration: none;"> </del>[[Hanyang University]] has filed a patent to produce genetically modified drosophila flies with an increased fat mass for biodiesel production.<del style="font-weight: bold; text-decoration: none;"> </del>&lt;ref&gt;{{patent|KR|102825505|"Method for Producing Insect-derived Resource Using Mutation of TRPγ Channel Expression Gene and Biodiesel and High-protein Food Prepared by Using Same"}}&lt;/ref&gt;</div></td> <td class="diff-marker" data-marker="+"></td> <td style="color: #202122; font-size: 88%; border-style: solid; border-width: 1px 1px 1px 4px; border-radius: 0.33em; border-color: #a3d3ff; vertical-align: top; white-space: pre-wrap;"><div>* [[Insect]] oil is a potential feedstock for biodiesel production. The oil is extracted from pupae or larvae, generally using a solvent after grinding and drying. This oil then undergoes transesterification to produce biodiesel.&lt;ref&gt;{{patent|EP|2479250|"Biodiesel and preparation method thereof"}}&lt;/ref&gt;&lt;ref&gt;{{patent|KR|102418025|"Method of preparing biodiesel according to dry condition of insect"}}&lt;/ref&gt;&lt;ref&gt;{{patent|CN|101805672|"Biodiesel and preparation method thereof"}}&lt;/ref&gt;&lt;ref<ins style="font-weight: bold; text-decoration: none;"> name="CN106819662"</ins>&gt;{{patent|CN|106819662|"Method for producing insect proteins and grease by efficient conversion of crop straws through multi-stage cooperation of insects"}}&lt;/ref&gt; Biodiesel can be produced from black soldier fly oil ([[Hermetia illucens]]).&lt;ref&gt;{{patent|EP|3980392|"biomass composition comprising insect particles, method for producing the same, and use of said biomass composition"}}&lt;/ref&gt;&lt;ref<ins style="font-weight: bold; text-decoration: none;"> name="CN106819662</ins>" /&gt;[[Hanyang University]] has filed a patent to produce genetically modified drosophila flies with an increased fat mass for biodiesel production.&lt;ref&gt;{{patent|KR|102825505|"Method for Producing Insect-derived Resource Using Mutation of TRPγ Channel Expression Gene and Biodiesel and High-protein Food Prepared by Using Same"}}&lt;/ref&gt;</div></td> </tr> <tr> <td class="diff-marker"></td> <td style="background-color: #f8f9fa; color: #202122; font-size: 88%; border-style: solid; border-width: 1px 1px 1px 4px; border-radius: 0.33em; border-color: #eaecf0; vertical-align: top; white-space: pre-wrap;"><br /></td> <td class="diff-marker"></td> <td style="background-color: #f8f9fa; color: #202122; font-size: 88%; border-style: solid; border-width: 1px 1px 1px 4px; border-radius: 0.33em; border-color: #eaecf0; vertical-align: top; white-space: pre-wrap;"><br /></td> </tr> <tr> <td class="diff-marker"></td> <td style="background-color: #f8f9fa; color: #202122; font-size: 88%; border-style: solid; border-width: 1px 1px 1px 4px; border-radius: 0.33em; border-color: #eaecf0; vertical-align: top; white-space: pre-wrap;"><div>Many advocates suggest that waste vegetable oil is the best source of oil to produce biodiesel, but since the available supply is drastically less than the amount of petroleum-based fuel that is burned for transportation and home heating in the world, this local solution could not scale to the current rate of consumption.</div></td> <td class="diff-marker"></td> <td style="background-color: #f8f9fa; color: #202122; font-size: 88%; border-style: solid; border-width: 1px 1px 1px 4px; border-radius: 0.33em; border-color: #eaecf0; vertical-align: top; white-space: pre-wrap;"><div>Many advocates suggest that waste vegetable oil is the best source of oil to produce biodiesel, but since the available supply is drastically less than the amount of petroleum-based fuel that is burned for transportation and home heating in the world, this local solution could not scale to the current rate of consumption.</div></td> </tr> </table></summary>
