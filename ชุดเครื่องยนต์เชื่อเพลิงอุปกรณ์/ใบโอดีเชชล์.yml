<summary type="html"><p><span class="autocomment">Contamination by water: </span> cn</p> <table style="background-color: #fff; color: #202122;" data-mw-interface=""> <col class="diff-marker" /> <col class="diff-content" /> <col class="diff-marker" /> <col class="diff-content" /> <tr class="diff-title" lang="en"> <td colspan="2" style="background-color: #fff; color: #202122; text-align: center;">← Previous revision</td> <td colspan="2" style="background-color: #fff; color: #202122; text-align: center;">Revision as of 18:14, 11 July 2026</td> </tr><tr> <td colspan="2" class="diff-lineno">Line 397:</td> <td colspan="2" class="diff-lineno">Line 397:</td> </tr> <tr> <td class="diff-marker"></td> <td style="background-color: #f8f9fa; color: #202122; font-size: 88%; border-style: solid; border-width: 1px 1px 1px 4px; border-radius: 0.33em; border-color: #eaecf0; vertical-align: top; white-space: pre-wrap;"><div>Previously, the amount of water contaminating biodiesel has been difficult to measure by taking samples, since water and oil separate. However, it is now possible to measure the water content using water-in-oil sensors.&lt;ref&gt;{{Cite news |title=Detecting and Controlling Water in Oil |url=http://www.machinerylubrication.com/Read/787/detecting-water-in-oil |url-status=dead |archive-url=https://web.archive.org/web/20161024090036/http://www.machinerylubrication.com/Read/787/detecting-water-in-oil |archive-date=2016-10-24 |access-date=2016-10-23}}&lt;/ref&gt;</div></td> <td class="diff-marker"></td> <td style="background-color: #f8f9fa; color: #202122; font-size: 88%; border-style: solid; border-width: 1px 1px 1px 4px; border-radius: 0.33em; border-color: #eaecf0; vertical-align: top; white-space: pre-wrap;"><div>Previously, the amount of water contaminating biodiesel has been difficult to measure by taking samples, since water and oil separate. However, it is now possible to measure the water content using water-in-oil sensors.&lt;ref&gt;{{Cite news |title=Detecting and Controlling Water in Oil |url=http://www.machinerylubrication.com/Read/787/detecting-water-in-oil |url-status=dead |archive-url=https://web.archive.org/web/20161024090036/http://www.machinerylubrication.com/Read/787/detecting-water-in-oil |archive-date=2016-10-24 |access-date=2016-10-23}}&lt;/ref&gt;</div></td> </tr> <tr> <td class="diff-marker"></td> <td style="background-color: #f8f9fa; color: #202122; font-size: 88%; border-style: solid; border-width: 1px 1px 1px 4px; border-radius: 0.33em; border-color: #eaecf0; vertical-align: top; white-space: pre-wrap;"><br /></td> <td class="diff-marker"></td> <td style="background-color: #f8f9fa; color: #202122; font-size: 88%; border-style: solid; border-width: 1px 1px 1px 4px; border-radius: 0.33em; border-color: #eaecf0; vertical-align: top; white-space: pre-wrap;"><br /></td> </tr> <tr> <td class="diff-marker" data-marker="−"></td> <td style="color: #202122; font-size: 88%; border-style: solid; border-width: 1px 1px 1px 4px; border-radius: 0.33em; border-color: #ffe49c; vertical-align: top; white-space: pre-wrap;"><div>Water contamination is also a potential problem when using certain chemical [[catalyst]]s involved in the production process, substantially reducing catalytic efficiency of base (high pH) catalysts such as [[potassium hydroxide]]. However, the super-critical methanol production methodology, whereby the transesterification process of oil feedstock and methanol is effectuated under high temperature and pressure, has been shown to be largely unaffected by the presence of water contamination during the production phase</div></td> <td class="diff-marker" data-marker="+"></td> <td style="color: #202122; font-size: 88%; border-style: solid; border-width: 1px 1px 1px 4px; border-radius: 0.33em; border-color: #a3d3ff; vertical-align: top; white-space: pre-wrap;"><div>Water contamination is also a potential problem when using certain chemical [[catalyst]]s involved in the production process, substantially reducing catalytic efficiency of base (high pH) catalysts such as [[potassium hydroxide]]. However, the super-critical methanol production methodology, whereby the transesterification process of oil feedstock and methanol is effectuated under high temperature and pressure, has been shown to be largely unaffected by the presence of water contamination during the production phase<ins style="font-weight: bold; text-decoration: none;">.{{cn|date=July 2026}}</ins></div></td> </tr> <tr> <td class="diff-marker"></td> <td style="background-color: #f8f9fa; color: #202122; font-size: 88%; border-style: solid; border-width: 1px 1px 1px 4px; border-radius: 0.33em; border-color: #eaecf0; vertical-align: top; white-space: pre-wrap;"><br /></td> <td class="diff-marker"></td> <td style="background-color: #f8f9fa; color: #202122; font-size: 88%; border-style: solid; border-width: 1px 1px 1px 4px; border-radius: 0.33em; border-color: #eaecf0; vertical-align: top; white-space: pre-wrap;"><br /></td> </tr> <tr> <td class="diff-marker"></td> <td style="background-color: #f8f9fa; color: #202122; font-size: 88%; border-style: solid; border-width: 1px 1px 1px 4px; border-radius: 0.33em; border-color: #eaecf0; vertical-align: top; white-space: pre-wrap;"><div>==Research==</div></td> <td class="diff-marker"></td> <td style="background-color: #f8f9fa; color: #202122; font-size: 88%; border-style: solid; border-width: 1px 1px 1px 4px; border-radius: 0.33em; border-color: #eaecf0; vertical-align: top; white-space: pre-wrap;"><div>==Research==</div></td> </tr> </table></summary>
