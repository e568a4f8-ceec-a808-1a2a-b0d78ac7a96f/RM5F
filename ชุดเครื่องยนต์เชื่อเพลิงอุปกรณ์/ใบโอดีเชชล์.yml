<summary type="html"><p><span class="autocomment">Engine wear: </span> removed, failed verification</p> <table style="background-color: #fff; color: #202122;" data-mw-interface=""> <col class="diff-marker" /> <col class="diff-content" /> <col class="diff-marker" /> <col class="diff-content" /> <tr class="diff-title" lang="en"> <td colspan="2" style="background-color: #fff; color: #202122; text-align: center;">← Previous revision</td> <td colspan="2" style="background-color: #fff; color: #202122; text-align: center;">Revision as of 18:10, 11 July 2026</td> </tr><tr> <td colspan="2" class="diff-lineno">Line 371:</td> <td colspan="2" class="diff-lineno">Line 371:</td> </tr> <tr> <td class="diff-marker"></td> <td style="background-color: #f8f9fa; color: #202122; font-size: 88%; border-style: solid; border-width: 1px 1px 1px 4px; border-radius: 0.33em; border-color: #eaecf0; vertical-align: top; white-space: pre-wrap;"><br /></td> <td class="diff-marker"></td> <td style="background-color: #f8f9fa; color: #202122; font-size: 88%; border-style: solid; border-width: 1px 1px 1px 4px; border-radius: 0.33em; border-color: #eaecf0; vertical-align: top; white-space: pre-wrap;"><br /></td> </tr> <tr> <td class="diff-marker"></td> <td style="background-color: #f8f9fa; color: #202122; font-size: 88%; border-style: solid; border-width: 1px 1px 1px 4px; border-radius: 0.33em; border-color: #eaecf0; vertical-align: top; white-space: pre-wrap;"><div>==== Engine wear ====</div></td> <td class="diff-marker"></td> <td style="background-color: #f8f9fa; color: #202122; font-size: 88%; border-style: solid; border-width: 1px 1px 1px 4px; border-radius: 0.33em; border-color: #eaecf0; vertical-align: top; white-space: pre-wrap;"><div>==== Engine wear ====</div></td> </tr> <tr> <td class="diff-marker" data-marker="−"></td> <td style="color: #202122; font-size: 88%; border-style: solid; border-width: 1px 1px 1px 4px; border-radius: 0.33em; border-color: #ffe49c; vertical-align: top; white-space: pre-wrap;"><div>Lubricity of fuel plays an important role in wear that occurs in an engine. A diesel engine relies on its fuel to provide lubricity for the metal components that are constantly in contact with each other.&lt;ref name="Fazal, M. A. 2011"&gt;{{cite journal |last1=Fazal |first1=M. A. |last2=Haseeb |first2=A. S. M.A. |last3=Masiuki |year=2011 |title=An evaluation of material compatibility; performance; emission and engine durability |journal=Renewable and Sustainable Energy Reviews |volume=15 |pages=1314–1324 |doi=10.1016/j.rser.2010.10.004}}&lt;/ref&gt; Biodiesel is a much better lubricant compared with fossil petroleum diesel due to the presence of esters. Tests have shown that the addition of a small amount of biodiesel to diesel can significantly increase the lubricity of the fuel in short term.&lt;ref&gt;Masjuki HH, Maleque MA. The effect of palm oil diesel fuel contaminated lubricant on sliding wear of cast irons against mild steel. Wear. 1996, 198, 293–9&lt;/ref<del style="font-weight: bold; text-decoration: none;">&gt; However, over a longer period of time{{clarify|reason=use or storage?|date=September 2023}} (2–4 years), studies show that biodiesel loses its lubricity.&lt;ref&gt;Clark, S.J.; Wagner, L.; Schrock, M.D.; Piennaar, P.G. Methyl and ethyl soybean esters as renewable fuels for diesel engines. JAOCS. 1984, 61, 1632–8&lt;/ref&gt;{{failed verification|reason=This one says 200 hours! Maybe ditch it and just keep Monyem?|date=September 2023}} This could be because of enhanced corrosion over time due to oxidation of the unsaturated molecules or increased water content in biodiesel from moisture absorption.&lt;ref name="Monyem, A. 2001" /</del>&gt;</div></td> <td class="diff-marker" data-marker="+"></td> <td style="color: #202122; font-size: 88%; border-style: solid; border-width: 1px 1px 1px 4px; border-radius: 0.33em; border-color: #a3d3ff; vertical-align: top; white-space: pre-wrap;"><div>Lubricity of fuel plays an important role in wear that occurs in an engine. A diesel engine relies on its fuel to provide lubricity for the metal components that are constantly in contact with each other.&lt;ref name="Fazal, M. A. 2011"&gt;{{cite journal |last1=Fazal |first1=M. A. |last2=Haseeb |first2=A. S. M.A. |last3=Masiuki |year=2011 |title=An evaluation of material compatibility; performance; emission and engine durability |journal=Renewable and Sustainable Energy Reviews |volume=15 |pages=1314–1324 |doi=10.1016/j.rser.2010.10.004}}&lt;/ref&gt; Biodiesel is a much better lubricant compared with fossil petroleum diesel due to the presence of esters. Tests have shown that the addition of a small amount of biodiesel to diesel can significantly increase the lubricity of the fuel in short term.&lt;ref&gt;Masjuki HH, Maleque MA. The effect of palm oil diesel fuel contaminated lubricant on sliding wear of cast irons against mild steel. Wear. 1996, 198, 293–9&lt;/ref&gt;</div></td> </tr> <tr> <td class="diff-marker"></td> <td style="background-color: #f8f9fa; color: #202122; font-size: 88%; border-style: solid; border-width: 1px 1px 1px 4px; border-radius: 0.33em; border-color: #eaecf0; vertical-align: top; white-space: pre-wrap;"><br /></td> <td class="diff-marker"></td> <td style="background-color: #f8f9fa; color: #202122; font-size: 88%; border-style: solid; border-width: 1px 1px 1px 4px; border-radius: 0.33em; border-color: #eaecf0; vertical-align: top; white-space: pre-wrap;"><br /></td> </tr> <tr> <td class="diff-marker"></td> <td style="background-color: #f8f9fa; color: #202122; font-size: 88%; border-style: solid; border-width: 1px 1px 1px 4px; border-radius: 0.33em; border-color: #eaecf0; vertical-align: top; white-space: pre-wrap;"><div>==== Fuel viscosity ====</div></td> <td class="diff-marker"></td> <td style="background-color: #f8f9fa; color: #202122; font-size: 88%; border-style: solid; border-width: 1px 1px 1px 4px; border-radius: 0.33em; border-color: #eaecf0; vertical-align: top; white-space: pre-wrap;"><div>==== Fuel viscosity ====</div></td> </tr> </table></summary>
