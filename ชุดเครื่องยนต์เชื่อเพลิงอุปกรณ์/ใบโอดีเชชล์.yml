te-space: pre-wrap;"><div>When biodiesel is cooled below a certain point, some of the molecules aggregate and form crystals. The fuel starts to appear cloudy once the crystals become larger than one quarter of the wavelengths of [[visible spectrum|visible light]] – this is the [[cloud point]] (CP). As the fuel is cooled further these crystals become larger. The lowest temperature at which fuel can pass through a 45&amp;nbsp;micrometre filter is the [[cold filter plugging point]] (CFPP).&lt;ref&gt;{{cite web |author1=袁明豪 |author2=陳奕宏 |date=2017-01-12 |editor=蔡美瑛 |title=生質柴油的冰與火之歌 |url=https://scitechvista.nat.gov.tw/c/hCy1.htm |url-status=dead |archive-url=https://web.archive.org/web/20210322122136/https://scitechvista.nat.gov.tw/c/hCy1.htm |archive-date=2021-03-22 |access-date=2017-06-22 |publisher=[[Ministry of Science and Technology (Taiwan)|Ministry of Science and Technology]] |language=zh |location=Taiwan}}&lt;/ref&gt; As biodiesel is cooled further it will gel and then solidify. Within Europe, there are differences in the CFPP requirements between countries. This is reflected in the different national standards of those countries. The temperature at which pure (B100) biodiesel starts to gel varies significantly and depends upon the mix of esters and therefore the feedstock oil used to produce the biodiesel. For example, biodiesel produced from low [[erucic acid]] varieties of canola seed (RME) starts to gel at approximately {{convert|-10|°C|°F}}. Biodiesel produced from beef [[tallow]] and [[palm oil]] tends to gel at around {{convert|16|°C|°F}} and {{convert|13|°C|°F}} respectively.&lt;ref&gt;Sanford, S.D., et al., "Feedstock and Biodiesel Characteristics Report," [[Renewable Energy Group|Renewable Energy Group, Inc.]], www.regfuel.com (2009).&lt;/ref&gt; There are a number of commercially available additives that will significantly lower the pour point and cold filter plugging point of pure biodiesel. Winter operation is also possible by blending biodiesel with other fuel oils including #2 low [[sulfur]] diesel fuel and #1 diesel / [[kerosene]].</div></td> <td class="diff-marker" data-marker="+"></td> <td style="color: #202122; font-size: 88%; border-style: solid; border-width: 1px 1px 1px 4px; border-radius: 0.33em; border-color: #a3d3ff; vertical-align: top; white-space: pre-wrap;"><div>When biodiesel is cooled below a certain point, some of the molecules aggregate and form crystals. The fuel starts to appear cloudy once the crystals become larger than one quarter of the wavelengths of [[visible spectrum|visible light]] – this is the [[cloud point]] (CP). As the fuel is cooled further these crystals become larger. The lowest temperature at which fuel can pass through a 45&amp;nbsp;micrometre filter is the [[cold filter plugging point]] (CFPP).&lt;ref&gt;{{cite web |author1=袁明豪 |author2=陳奕宏 |date=2017-01-12 |editor=蔡美瑛 |title=生質柴油的冰與火之歌 |url=https://scitechvista.nat.gov.tw/c/hCy1.htm |url-status=dead |archive-url=https://web.archive.org/web/20210322122136/https://scitechvista.nat.gov.tw/c/hCy1.htm |archive-date=2021-03-22 |access-date=2017-06-22 |publisher=[[Ministry of Science and Technology (Taiwan)|Ministry of Science and Technology]] |language=zh |location=Taiwan}}&lt;/ref&gt; As biodiesel is cooled further it will gel and then solidify. Within Europe, there are differences in the CFPP requirements between countries. This is reflected in the different national standards of those countries. The temperature at which pure (B100) biodiesel starts to gel varies significantly and depends upon the mix of esters and therefore the feedstock oil used to produce the biodiesel. For example, biodiesel produced from low [[erucic acid]] varieties of canola seed (RME) starts to gel at approximately {{convert|-10|°C|°F}}. Biodiesel produced from beef [[tallow]] and [[palm oil]] tends to gel at around {{convert|16|°C|°F}} and {{convert|13|°C|°F}} respectively.&lt;ref&gt;Sanford, S.D., et al., "Feedstock and Biodiesel Characteristics Report," [[Renewable Energy Group|Renewable Energy Group, Inc.]], www.regfuel.com (2009).&lt;/ref&gt; There are a number of commercially available additives that will significantly lower the pour point and cold filter plugging point of pure biodiesel. Winter operation is also possible by blending biodiesel with other fuel oils including #2 low [[sulfur]] diesel fuel and #1 diesel / [[kerosene]].<ins style="font-weight: bold; text-decoration: none;">{{cn|date=July 2026}}</ins></div></td> </tr> <tr> <td class="diff-marker"></td> <td style="background-color: #f8f9fa; color: #202122; font-size: 88%; border-style: solid; border-width: 1px 1px 1px 4px; border-radius: 0.33em; border-color: #eaecf0; vertical-align: top; white-space: pre-wrap;"><br /></td> <td class="diff-marker"></td> <td style="background-color: #f8f9fa; color: #202122; font-size: 88%; border-style: solid; border-width: 1px 1px 1px 4px; border-radius: 0.33em; border-color: #eaecf0; vertical-align: top; white-space: pre-wrap;"><br /></td> </tr> <tr> <td class="diff-marker" data-marker="−"></td> <td style="color: #202122; font-size: 88%; border-style: solid; border-width: 1px 1px 1px 4px; border-radius: 0.33em; border-color: #ffe49c; vertical-align: top; white-space: pre-wrap;"><div>Another approach to facilitate the use of biodiesel in cold conditions is by employing a second fuel tank for biodiesel in addition to the standard diesel fuel tank. The second fuel tank can be [[Thermal insulation|insulated]] and a [[heat exchanger|heating coil]] using [[antifreeze|engine coolant]] is run through the tank. The fuel tanks can be switched over when the fuel is sufficiently warm. A similar method can be used to operate diesel vehicles using straight vegetable oil.</div></td> <td class="diff-marker" data-marker="+"></td> <td style="color: #202122; font-size: 88%; border-style: solid; border-width: 1px 1px 1px 4px; border-radius: 0.33em; border-color: #a3d3ff; vertical-align: top; white-space: pre-wrap;"><div>Another approach to facilitate the use of biodiesel in cold conditions is by employing a second fuel tank for biodiesel in addition to the standard diesel fuel tank. The second fuel tank can be [[Thermal insulation|insulated]] and a [[heat exchanger|heating coil]] using [[antifreeze|engine coolant]] is run through the tank. The fuel tanks can be switched over when the fuel is sufficiently warm. A similar method can be used to operate diesel vehicles using straight vegetable oil.<ins style="font-weight: bold; text-decoration: none;">{{cn|date=July 2026}}</ins></div></td> </tr> <tr> <td class="diff-marker"></td> <td style="background-color: #f8f9fa; color: #202122; font-size: 88%; border-style: solid; border-width: 1px 1px 1px 4px; border-radius: 0.33em; border-color: #eaecf0; vertical-align: top; white-space: pre-wrap;"><br /></td> <td class="diff-marker"></td> <td style="background-color: #f8f9fa; color: #202122; font-size: 88%; border-style: solid; border-width: 1px 1px 1px 4px; border-radius: 0.33em; border-color: #eaecf0; vertical-align: top; white-space: pre-wrap;"><br /></td> </tr> <tr> <td class="diff-marker"></td> <td style="background-color: #f8f9fa; color: #202122; font-size: 88%; border-style: solid; border-width: 1px 1px 1px 4px; border-radius: 0.33em; border-color: #eaecf0; vertical-align: top; white-space: pre-wrap;"><div>==== Contamination by water ====</div></td> <td class="diff-marker"></td> <td style="background-color: #f8f9fa; color: #202122; font-size: 88%; border-style: solid; border-width: 1px 1px 1px 4px; border-radius: 0.33em; border-color: #eaecf0; vertical-align: top; white-space: pre-wrap;"><div>==== Contamination by water ====</div></td> </tr> </table></summary>
