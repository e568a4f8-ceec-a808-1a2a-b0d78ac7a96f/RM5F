sed Fuels for Both SOFC and PEM Fuel Cells|journal=ECS Transactions|volume=5|issue=1|pages=665–671|doi=10.1149/1.2729047|bibcode=2007ECSTr...5a.665I|s2cid=137810875}}&lt;/ref&gt;</div></td> <td class="diff-marker"></td> <td style="background-color: #f8f9fa; color: #202122; font-size: 88%; border-style: solid; border-width: 1px 1px 1px 4px; border-radius: 0.33em; border-color: #eaecf0; vertical-align: top; white-space: pre-wrap;"><div>A microreactor has been developed to convert biodiesel into hydrogen steam to power fuel cells.&lt;ref&gt;{{cite journal|last1=Irving|first1=P. M.|last2=Pickles|first2=J. S.|year=2007|title=Operational Requirements for a Multi-fuel Processor that Generates Hydrogen from Bio- and Petroleum-Based Fuels for Both SOFC and PEM Fuel Cells|journal=ECS Transactions|volume=5|issue=1|pages=665–671|doi=10.1149/1.2729047|bibcode=2007ECSTr...5a.665I|s2cid=137810875}}&lt;/ref&gt;</div></td> </tr> <tr> <td class="diff-marker"></td> <td style="background-color: #f8f9fa; color: #202122; font-size: 88%; border-style: solid; border-width: 1px 1px 1px 4px; border-radius: 0.33em; border-color: #eaecf0; vertical-align: top; white-space: pre-wrap;"><br /></td> <td class="diff-marker"></td> <td style="background-color: #f8f9fa; color: #202122; font-size: 88%; border-style: solid; border-width: 1px 1px 1px 4px; border-radius: 0.33em; border-color: #eaecf0; vertical-align: top; white-space: pre-wrap;"><br /></td> </tr> <tr> <td class="diff-marker" data-marker="−"></td> <td style="color: #202122; font-size: 88%; border-style: solid; border-width: 1px 1px 1px 4px; border-radius: 0.33em; border-color: #ffe49c; vertical-align: top; white-space: pre-wrap;"><div>'''Steam reforming''', also known as <del style="font-weight: bold; text-decoration: none;">'''</del>fossil fuel reforming<del style="font-weight: bold; text-decoration: none;">'''</del> is a process which produces hydrogen gas from hydrocarbon fuels, most notably biodiesel due to its efficiency. A <del style="font-weight: bold; text-decoration: none;">**</del>microreactor<del style="font-weight: bold; text-decoration: none;">**</del>, or reformer, is the processing device in which water vapour reacts with the liquid fuel under high temperature and pressure. Under temperatures ranging from 700 – 1100&amp;nbsp;°C, a nickel-based catalyst enables the production of carbon monoxide and hydrogen:&lt;ref&gt;{{cite journal|last1=Park|first1=G.|last2=Seo|first2=D. J.|last3=Park|first3=S.|last4=Yoon|first4=Y.|last5=Kim|first5=C.|last6=Yoon|first6=W.|year=2004|title=Development of microchannel methanol steam reformer|journal=Chem. Eng. J.|volume=101|issue=1–3|pages=87–92|doi=10.1016/j.cej.2004.01.007|bibcode=2004ChEnJ.101...87P }}&lt;/ref&gt;</div></td> <td class="diff-marker" data-marker="+"></td> <td style="color: #202122; font-size: 88%; border-style: solid; border-width: 1px 1px 1px 4px; border-radius: 0.33em; border-color: #a3d3ff; vertical-align: top; white-space: pre-wrap;"><div>'''Steam reforming''', also known as fossil fuel reforming<ins style="font-weight: bold; text-decoration: none;">,</ins> is a process which produces hydrogen gas from hydrocarbon fuels, most notably biodiesel due to its efficiency. A microreactor, or reformer, is the processing device in which water vapour reacts with the liquid fuel under high temperature and pressure. Under temperatures ranging from 700 – 1100&amp;nbsp;°C, a nickel-based catalyst enables the production of carbon monoxide and hydrogen:&lt;ref&gt;{{cite journal|last1=Park|first1=G.|last2=Seo|first2=D. J.|last3=Park|first3=S.|last4=Yoon|first4=Y.|last5=Kim|first5=C.|last6=Yoon|first6=W.|year=2004|title=Development of microchannel methanol steam reformer|journal=Chem. Eng. J.|volume=101|issue=1–3|pages=87–92|doi=10.1016/j.cej.2004.01.007|bibcode=2004ChEnJ.101...87P }}&lt;/ref&gt;</div></td> </tr> <tr> <td class="diff-marker"></td> <td style="background-color: #f8f9fa; color: #202122; font-size: 88%; border-style: solid; border-width: 