 Factsheet|url=http://www.epa.gov/smartway/growandgo/documents/factsheet-biodiesel.htm|url-status=dead|archive-url=https://web.archive.org/web/20080726004436/http://www.epa.gov/smartway/growandgo/documents/factsheet-biodiesel.htm|archive-date=July 26, 2008|date=2016-03-03}}&lt;/ref&gt;</div></td> <td class="diff-marker" data-marker="+"></td> <td style="color: #202122; font-size: 88%; border-style: solid; border-width: 1px 1px 1px 4px; border-radius: 0.33em; border-color: #a3d3ff; vertical-align: top; white-space: pre-wrap;"><div>Biodiesel can be used in pure form (B100) or may be blended with petroleum diesel at any concentration in most injection pump diesel engines. New extreme high-pressure (<ins style="font-weight: bold; text-decoration: none;">{{convert|29000|</ins>psi<ins style="font-weight: bold; text-decoration: none;">|abrr=on}}</ins>) [[common rail]] engines have strict factory limits of B5 or B20, depending on manufacturer.&lt;ref&gt;"[http://biodiesel.org/using-biodiesel/oem-information/oem-statement-summary-chart OEM Statement Summary Chart] {{Webarchive|url=http://webarchive.loc.gov/all/20160407054752/http://biodiesel.org/using%2Dbiodiesel/oem%2Dinformation/oem%2Dstatement%2Dsummary%2Dchart |date=2016-04-07 }}." Biodiesel.org. National Biodiesel Board, 1 Dec. 2014. Web. 19 Nov. 2015.&lt;/ref&gt; Biodiesel has different [[solvent]] properties from petrodiesel, and will degrade natural rubber [[gasket]]s and [[hose (tubing)|hoses]] in vehicles (mostly vehicles manufactured before 1992), although these tend to wear out naturally and most likely will have already been replaced with [[FKM]], which is nonreactive to biodiesel. Biodiesel has been known to break down deposits of residue in the fuel lines where petrodiesel has been used.&lt;ref&gt;{{cite web|last=McCormick|first=R.L.|title=2006 Biodiesel Handling and Use Guide Third Edition|url=http://www.nrel.gov/vehiclesandfuels/npbf/pdfs/40555.pdf|access-date=2006-12-18|archive-url=https://web.archive.org/web/20061216051136/http://www.nrel.gov/vehiclesandfuels/npbf/pdfs/40555.pdf|archive-date=2006-12-16|url-status=dead}}&lt;/ref&gt; As a result, [[fuel filter]]s may become clogged with particulates if a quick transition to pure biodiesel is made. Therefore, it is recommended to change the fuel filters on engines and heaters shortly after first switching to a biodiesel blend.&lt;ref&gt;{{cite web|title=US EPA Biodiesel Factsheet|url=http://www.epa.gov/smartway/growandgo/documents/factsheet-biodiesel.htm|url-status=dead|archive-url=https://web.archive.org/web/20080726004436/http://www.epa.gov/smartway/growandgo/documents/factsheet-biodiesel.htm|archive-date=July 26, 2008|date=2016-03-03}}&lt;/ref&gt;</div></td> </tr> <tr> <td class="diff-marker"></td> <td style="background-color: #f8f9fa; color: #202122; font-size: 88%; border-style: solid; border-width: 1px 1px 1px 4px; border-radius: 0.33em; border-color: #eaecf0; vertical-align: top; white-space: pre-wrap;"><br /></td> <td class="diff-marker"></td> <td style="background-color: #f8f9fa; color: #202122; font-size: 88%; border-style: solid; border-width: 1px 1px 1px 4px; border-radius: 0.33em; border-color: #eaecf0; vertical-align: top; white-space: pre-wrap;"><br /></td> </tr> <tr> <td class="diff-marker"></td> <td style="background-color: #f8f9fa; color: #202122; font-size: 88%; border-style: solid; border-width: 1px 1px 1px 4px; border-radius: 0.33em; border-color: #eaecf0; vertical-align: top; white-space: pre-wrap;"><div>===Distribution===</div></td> <td class="diff-marker"></td> <td style="background-color: #f8f9fa; color: #202122; font-size: 88%; border-style: solid; border-width: 1px 1px 1px 4px; border-radius: 0.33em; border-color: #eaecf0; vertical-align: top; white-space: pre-wrap;"><div>===Distribution===</div></td> </tr> <tr> <td colspan="2" class="diff-lineno">Line 80:</td> <td colspan="2" class="diff-lineno">Line 80:</td> </tr> <tr> <td class="diff-marker"></td> <td style="background-color: #f8f9fa; color: #202122; font-size: 88%; border-style: solid; border-width: 1px 1px 1px 4px; border-radius: 0.33em; border-color: #eaecf0; vertical-align: top; white-space: pre-wrap;"><div>Starting in 2004, the city of [[Halifax Regional Municipality|Halifax, Nova Scotia]] decided to update its bus system to allow the fleet of city buses to run entirely on a fish-oil based biodiesel. This caused the city some initial mechanical issues, but after several years of refining, the entire fleet had successfully been converted.&lt;ref&gt;{{cite web|url=http://www.biodieselinvesting.com/biodiesel-archives/2006/08/31/halifax-city-buses-to-run-on-biodiesel-again/|archive-url=https://web.archive.org/web/20061018135732/http://www.biodieselinvesting.com/biodiesel-archives/2006/08/31/halifax-city-buses-to-run-on-biodiesel-again/|url-status=dead|archive-date=2006-10-18|title=Halifax City Buses to Run on Biodiesel Again &amp;#124; Biodiesel and Ethanol Investing|publisher=Biodieselinvesting.com|date=2006-08-31|access-date=2009-10-17}}&lt;/ref&gt;&lt;ref&gt;{{cite web|url=http://www.halifax.ca/metrotransit/Biodiesel.html|title=Biodiesel|publisher=Halifax.ca|access-date=2009-10-17|url-status=dead|archive-url=https://web.archive.org/web/20101224042615/http://halifax.ca/metrotransit/Biodiesel.html|archive-date=2010-12-24}}&lt;/ref&gt;&lt;ref&gt;{{cite web|url=http://www.halifax.ca/metrotransit/news/10_2004-Biodiesel.html|title=Halifax Transit|publisher=Halifax.ca|date=2004-10-12|access-date=2013-12-04|url-status=dead|archive-url=https://web.archive.org/web/20140814103101/http://www.halifax.ca/metrotransit/news/10_2004-Biodiesel.html|archive-date=2014-08-14}}&lt;/ref&gt;</div></td> <td class="diff-marker"></td> <td style="background-color: #f8f9fa; color: #202122; font-size: 88%; border-style: solid; border-width: 1px 1px 1px 4px; border-radius: 0.33em; border-color: #eaecf0; vertical-align: top; white-space: pre-wrap;"><div>Starting in 2004, the city of [[Halifax Regional Municipality|Halifax, Nova Scotia]] decided to update its bus system to allow the fleet of city buses to run entirely on a fish-oil based biodiesel. This caused the city some initial mechanical issues, but after several years of refining, the entire fleet had successfully been converted.&lt;ref&gt;{{cite web|url=http://www.biodieselinvesting.com/biodiesel-archives/2006/08/31/halifax-city-buses-to-run-on-biodiesel-again/|archive-url=https://web.archive.org/web/20061018135732/http://www.biodieselinvesting.com/biodiesel-archives/2006/08/31/halifax-city-buses-to-run-on-biodiesel-again/|url-status=dead|archive-date=2006-10-18|title=Halifax City Buses to Run on Biodiesel Again &amp;#124; Biodiesel and Ethanol Investing|publisher=Biodieselinvesting.com|date=2006-08-31|access-date=2009-10-17}}&lt;/ref&gt;&lt;ref&gt;{{cite web|url=http://www.halifax.ca/metrotransit/Biodiesel.html|title=Biodiesel|publisher=Halifax.ca|access-date=2009-10-17|url-status=dead|archive-url=https://web.archive.org/web/20101224042615/http://halifax.ca/metrotransit/Biodiesel.html|archive-date=2010-12-24}}&lt;/ref&gt;&lt;ref&gt;{{cite web|url=http://www.halifax.ca/metrotransit/news/10_2004-Biodiesel.html|title=Halifax Transit|publisher=Halifax.ca|date=2004-10-12|access-date=2013-12-04|url-status=dead|archive-url=https://web.archive.org/web/20140814103101/http://www.halifax.ca/metrotransit/news/10_2004-Biodiesel.html|archive-date=2014-08-14}}&lt;/ref&gt;</div></td> </tr> <tr> <td class="diff-marker"></td> <td style="background-color: #f8f9fa; color: #202122; font-size: 88%; border-style: solid; border-width: 1px 1px 1px 4px; border-radius: 0.33em; border-color: #eaecf0; vertical-align: top; white-space: pre-wrap;"><br /></td> <td class="diff-marker"></td> <td style="background-color: #f8f9fa; color: #202122; font-size: 88%; border-style: solid; border-width: 1px 1px 1px 4px; border-radius: 0.33em; border-color: #eaecf0; vertical-align: top; white-space: pre-wrap;"><br /></td> </tr> <tr> <td class="diff-marker" data-marker="−"></td> <td style="color: #202122; font-size: 88%; border-style: solid; border-width: 1px 1px 1px 4px; border-radius: 0.33em; border-color: #ffe49c; vertical-align: top; white-space: pre-wrap;"><div>In 2007, McDonald's of UK announced it would start producing biodiesel from the waste oil byproduct of its restaurants. This fuel would be used to run its fleet.&lt;ref&gt;{{cite web|url=http://news.mongabay.com/2007/0709-green_mcdonalds.html |archive-url=https://archive.<del style="font-weight: bold; text-decoration: none;">today</del>/<del style="font-weight: bold; text-decoration: none;">20120715203039</del>/http://news.mongabay.com/2007/0709-green_mcdonalds.html |url-status=dead |archive-date=2012-<del style="font-weight: bold; text-decoration: none;">07</del>-<del style="font-weight: bold; text-decoration: none;">15</del>|title=McDonald's bolsters "green" credentials with recycled biodiesel oil|publisher=News.mongabay.com|date=2007-07-09|access-date=2009-10-17}}&lt;/ref&gt;</div></td> <td class="diff-marker" data-marker="+"></td> <td style="color: #202122; font-size: 88%; border-style: solid; border-width: 1px 1px 1px 4px; border-radius: 0.33em; border-color: #a3d3ff; vertical-align: top; white-space: pre-wrap;"><div>In 2007, McDonald's of UK announced it would start producing biodiesel from the waste oil byproduct of its restaurants. This fuel would be used to run its fleet.&lt;ref&gt;{{cite web|url=http://news.mongabay.com/2007/0709-green_mcdonalds.html |archive-url=https://<ins style="font-weight: bold; text-decoration: none;">web.</ins>archive.<ins style="font-weight: bold; text-decoration: none;">org/web</ins>/<ins style="font-weight: bold; text-decoration: none;">20121024114244</ins>/http://news.mongabay.com/2007/0709-green_mcdonalds.html |url-status=dead |archive-date=2012-<ins style="font-weight: bold; text-decoration: none;">10</ins>-<ins style="font-weight: bold; text-decoration: none;">24</ins>|title=McDonald's bolsters "green" credentials with recycled biodiesel oil|publisher=News.mongabay.com|date=2007-07-09|access-date=2009-10-17}}&lt;/ref&gt;</div></td> </tr> <tr> <td class="diff-marker"></td> <td style="background-color: #f8f9fa; color: #202122; font-size: 88%; border-style: solid; border-width: 1px 1px 1px 4px; border-radius: 0.33em; border-color: #eaecf0; vertical-align: top; white-space: pre-wrap;"><br /></td> <td class="diff-marker"></td> <td style="background-color: #f8f9fa; color: #202122; font-size: 88%; border-style: solid; border-width: 1px 1px 1px 4px; border-radius: 0.33em; border-color: #eaecf0; vertical-align: top; white-space: pre-wrap;"><br /></td> </tr> <tr> <td class="diff-marker"></td> <td style="background-color: #f8f9fa; color: #202122; font-size: 88%; border-style: solid; border-width: 1px 1px 1px 4px; border-radius: 0.33em; border-color: #eaecf0; vertical-align: top; white-space: pre-wrap;"><div>The 2014 Chevy Cruze Clean Turbo Diesel, direct from the factory, will be rated for up to B20 (blend of 20% biodiesel / 80% regular diesel) biodiesel compatibility&lt;ref&gt;{{cite web|url=http://media.gm.com/media/us/en/gm/news.detail.html/content/Pages/news/us/en/2013/Feb/13-chicago-show/0207-cruze-diese-engine.html|title=Cruze Clean Turbo Diesel Delivers Efficient Performance|date=2013-02-07|access-date=2013-08-05|archive-date=2013-08-10|archive-url=https://web.archive.org/web/20130810082038/http://media.gm.com/media/us/en/gm/news.detail.html/content/Pages/news/us/en/2013/Feb/13-chicago-show/0207-cruze-diese-engine.html|url-status=live}}&lt;/ref&gt;</div></td> <td class="diff-marker"></td> <td style="background-color: #f8f9fa; color: #202122; font-size: 88%; border-style: solid; border-width: 1px 1px 1px 4px; border-radius: 0.33em; border-color: #eaecf0; vertical-align: top; white-space: pre-wrap;"><div>The 2014 Chevy Cruze Clean Turbo Diesel, direct from the factory, will be rated for up to B20 (blend of 20% biodiesel / 80% regular diesel) biodiesel compatibility&lt;ref&gt;{{cite web|url=http://media.gm.com/media/us/en/gm/news.detail.html/content/Pages/news/us/en/2013/Feb/13-chicago-show/0207-cruze-diese-engine.html|title=Cruze Clean Turbo Diesel Delivers Efficient Performance|date=2013-02-07|access-date=2013-08-05|archive-date=2013-08-10|archive-url=https://web.archive.org/web/20130810082038/http://media.gm.com/media/us/en/gm/news.detail.html/content/Pages/news/us/en/2013/Feb/13-chicago-show/0207-cruze-diese-engine.html|url-status=live}}&lt;/ref&gt;</div></td> </tr> <tr> <td colspan="2" class="diff-lineno">Line 123:</td> <td colspan="2" class="diff-lineno">Line 123:</td> </tr> <tr> <td class="diff-marker"></td> <td style="background-color: #f8f9fa; color: #202122; font-size: 88%; border-style: solid; border-width: 1px 1px 1px 4px; border-radius: 0.33em; border-color: #eaecf0; vertical-align: top; white-space: pre-wrap;"><br /></td> <td class="diff-marker"></td> <td style="background-color: #f8f9fa; color: #202122; font-size: 88%; border-style: solid; border-width: 1px 1px 1px 4px; border-radius: 0.33em; border-color: #eaecf0; vertical-align: top; white-space: pre-wrap;"><br /></td> </tr> <tr> <td class="diff-marker"></td> <td style="background-color: #f8f9fa; color: #202122; font-size: 88%; border-style: solid; border-width: 1px 1px 1px 4px; border-radius: 0.33em; border-color: #eaecf0; vertical-align: top; white-space: pre-wrap;"><div>===Combustion===</div></td> <td class="diff-marker"></td> <td style="background-color: #f8f9fa; color: #202122; font-size: 88%; border-style: solid; border-width: 1px 1px 1px 4px; border-radius: 0.33em; border-color: #eaecf0; vertical-align: top; white-space: pre-wrap;"><div>===Combustion===</div></td> </tr> <tr> <td class="diff-marker" data-marker="−"></td> <td style="color: #202122; font-size: 88%; border-style: solid; border-width: 1px 1px 1px 4px; border-radius: 0.33em; border-color: #ffe49c; vertical-align: top; white-space: pre-wrap;"><div>Fuel systems on some modern diesel engines were not designed to accommodate biodiesel, while many heavy duty engines are able to run with biodiesel blends up to B20.&lt;ref name="sciencedirect.com"/&gt; Traditional [[Fuel injection|direct injection]] fuel systems operate at roughly <del style="font-weight: bold; text-decoration: none;">3,000 </del>psi at the injector tip while the modern [[common rail]] fuel system operates upwards of <del style="font-weight: bold; text-decoration: none;">30,000 PSI</del> at the injector tip. Components are designed to operate at a great temperature range, from below freezing to over {{convert|1,000|F-change}}. Diesel fuel is expected to burn efficiently and produce as few emissions as possible. As emission standards are being introduced to diesel engines the need to control harmful emissions is being designed into the parameters of diesel engine fuel systems. The traditional inline injection system is more forgiving to poorer quality fuels as opposed to the common rail fuel system. The higher pressures and tighter tolerances of the common rail system allows for greater control over atomization and injection timing. This control of atomization as well as combustion allows for greater efficiency of modern diesel engines as well as greater control over emissions. Components within a diesel fuel system interact with the fuel in a way to ensure efficient operation of the fuel system and so the engine. If an out-of-specification fuel is introduced to a system that has specific parameters of operation, then the integrity of the overall fuel system may be compromised. Some of these parameters such as spray pattern and atomization are directly related to injection timing.&lt;ref&gt;{{cite journal|year=2009|title=Effect of Fuel Injection Timing and Injection Pressure on Combustion and Odorous Emissions in DI Diesel Engines|journal=Journal of Energy Resources Technology|volume=131|issue=3|article-number=032201|doi=10.1115/1.3185346|last1=Roy|first1=Murari Mohon}}&lt;/ref&gt;</div></td> <td class="diff-marker" data-marker="+"></td> <td style="color: #202122; font-size: 88%; border-style: solid; border-width: 1px 1px 1px 4px; border-radius: 0.33em; border-color: #a3d3ff; vertical-align: top; white-space: pre-wrap;"><div>Fuel systems on some modern diesel engines were not designed to accommodate biodiesel, while many heavy duty engines are able to run with biodiesel blends up to B20.&lt;ref name="sciencedirect.com"/&gt; Traditional [[Fuel injection|direct injection]] fuel systems operate at roughly <ins style="font-weight: bold; text-decoration: none;">{{convert|3000|</ins>psi<ins style="font-weight: bold; text-decoration: none;">|abbr=on}}</ins> at the injector tip while the modern [[common rail]] fuel system operates upwards of <ins style="font-weight: bold; text-decoration: none;">{{convert|30000|psi|abbr=on}}</ins> at the injector tip. Components are designed to operate at a great temperature range, from below freezing to over {{convert|1,000|F-change}}. Diesel fuel is expected to burn efficiently and produce as few emissions as possible. As emission standards are being introduced to diesel engines the need to control harmful emissions is being designed into the parameters of diesel engine fuel systems. The traditional inline injection system is more forgiving to poorer quality fuels as opposed to the common rail fuel system. The higher pressures and tighter tolerances of the common rail system allows for greater control over atomization and injection timing. This control of atomization as well as combustion allows for greater efficiency of modern diesel engines as well as greater control over emissions. Components within a diesel fuel system interact with the fuel in a way to ensure efficient operation of the fuel system and so the engine. If an out-of-specification fuel is introduced to a system that has specific parameters of operation, then the integrity of the overall fuel system may be compromised. Some of these parameters such as spray pattern and atomization are directly related to injection timing.&lt;ref&gt;{{cite journal|year=2009|title=Effect of Fuel Injection Timing and Injection Pressure on Combustion and Odorous Emissions in DI Diesel Engines|journal=Journal of Energy Resources Technology|volume=131|issue=3|article-number=032201|doi=10.1115/1.3185346|last1=Roy|first1=Murari Mohon}}&lt;/ref&gt;</div></td> </tr> <tr> <td class="diff-marker"></td> <td style="background-color: #f8f9fa; color: #202122; font-size: 88%; border-style: solid; border-width: 1px 1px 1px 4px; border-radius: 0.33em; border-color: #eaecf0; vertical-align: top; white-space: pre-wrap;"><br /></td> <td class="diff-marker"></td> <td style="background-color: #f8f9fa; color: #202122; font-size: 88%; border-style: solid; border-width: 1px 1px 1px 4px; border-radius: 0.33em; border-color: #eaecf0; vertical-align: top; white-space: pre-wrap;"><br /></td> </tr> <tr> <td class="diff-marker"></td> <td style="background-color: #f8f9fa; color: #202122; font-size: 88%; border-style: solid; border-width: 1px 1px 1px 4px; border-radius: 0.33em; border-color: #eaecf0; vertical-align: top; white-space: pre-wrap;"><div>One study found that during atomization, biodiesel and its blends produced droplets greater in diameter than the droplets produced by traditional petrodiesel. The smaller droplets were attributed to the lower viscosity and surface tension of traditional diesel fuel. It was found that droplets at the periphery of the spray pattern were larger in diameter than the droplets at the center. This was attributed to the faster pressure drop at the edge of the spray pattern; there was a proportional relationship between the droplet size and the distance from the injector tip. It was found that B100 had the greatest spray penetration, this was attributed to the greater density of B100.&lt;ref&gt;{{cite journal|last1=Chen|first1=P.|last2=Wang|first2=W.|last3=Roberts|first3=W. L.|last4=Fang|first4=T.|year=2013|title=Spray and atomization of diesel fuel and its alternatives from a single-hole injector using a common rail fuel injection system|journal=Fuel|volume=103|pages=850–861|doi=10.1016/j.fuel.2012.08.013|bibcode=2013Fuel..103..850C }}&lt;/ref&gt; Having a greater droplet size can lead to inefficiencies in the combustion, increased emissions, and decreased horse power. In another study it was found that there is a short injection delay when injecting biodiesel. This injection delay was attributed to the greater viscosity of Biodiesel. It was noted that the higher viscosity and the greater [[cetane rating]] of biodiesel over traditional petrodiesel lead to poor atomization, as well as mixture penetration with air during the ignition delay period.&lt;ref&gt;{{cite journal|last1=Hwang|first1=J.|last2=Qi|first2=D.|last3=Jung|first3=Y.|last4=Bae|first4=C.|year=2014|title=Effect of injection parameters on the combustion and emission characteristics in a common-rail direct injection diesel engine fueled with waste cooking oil biodiesel|journal=Renewable Energy|volume=63|pages=639–17|doi=10.1016/j.renene.2013.08.051|bibcode=2014REne...63....9H }}&lt;/ref&gt; Another study noted that this ignition delay may aid in a decrease of {{NOx|link=yes}} emission.&lt;ref&gt;{{cite journal|last1=McCarthy|first1=P. P.|last2=Rasul|first2=M. G.|last3=Moazzem|first3=S. S.|year=2011|title=Analysis and comparison of performance and emissions of an internal combustion engine fuelled with petroleum diesel and different bio-diesels|journal=Fuel|volume=90|issue=6|pages=2147–2157|doi=10.1016/j.fuel.2011.02.010|bibcode=2011Fuel...90.2147M }}&lt;/ref&gt;</div></td> <td class="diff-marker"></td> <td style="background-color: #f8f9fa; color: #202122; font-size: 88%; border-style: solid; border-width: 1px 1px 1px 4px; border-radius: 0.33em; border-color: #eaecf0; vertical-align: top; white-space: pre-wrap;"><div>One study found that during atomization, biodiesel and its blends produced droplets greater in diameter than the droplets produced by traditional petrodiesel. The smaller droplets were attributed to the lower viscosity and surface tension of traditional diesel fuel. It was found that droplets at the periphery of the spray pattern were larger in diameter than the droplets at the center. This was attributed to the faster pressure drop at the edge of the spray pattern; there was a proportional relationship between the droplet size and the distance from the injector tip. It was found that B100 had the greatest spray penetration, this was attributed to the greater density of B100.&lt;ref&gt;{{cite journal|last1=Chen|first1=P.|last2=Wang|first2=W.|last3=Roberts|first3=W. L.|last4=Fang|first4=T.|year=2013|title=Spray and atomization of diesel fuel and its alternatives from a single-hole injector using a common rail fuel injection system|journal=Fuel|volume=103|pages=850–861|doi=10.1016/j.fuel.2012.08.013|bibcode=2013Fuel..103..850C }}&lt;/ref&gt; Having a greater droplet size can lead to inefficiencies in the combustion, increased emissions, and decreased horse power. In another study it was found that there is a short injection delay when injecting biodiesel. This injection delay was attributed to the greater viscosity of Biodiesel. It was noted that the higher viscosity and the greater [[cetane rating]] of biodiesel over traditional petrodiesel lead to poor atomization, as well as mixture penetration with air during the ignition delay period.&lt;ref&gt;{{cite journal|last1=Hwang|first1=J.|last2=Qi|first2=D.|last3=Jung|first3=Y.|last4=Bae|first4=C.|year=2014|title=Effect of injection parameters on the combustion and emission characteristics in a common-rail direct injection diesel engine fueled with waste cooking oil biodiesel|journal=Renewable Energy|volume=63|pages=639–17|doi=10.1016/j.renene.2013.08.051|bibcode=2014REne...63....9H }}&lt;/ref&gt; Another study noted that this ignition delay may aid in a decrease of {{NOx|link=yes}} emission.&lt;ref&gt;{{cite journal|last1=McCarthy|first1=P. P.|last2=Rasul|first2=M. G.|last3=Moazzem|first3=S. S.|year=2011|title=Analysis and comparison of performance and emissions of an internal combustion engine fuelled with petroleum diesel and different bio-diesels|journal=Fuel|volume=90|issue=6|pages=2147–2157|doi=10.1016/j.fuel.2011.02.010|bibcode=2011Fuel...90.2147M }}&lt;/ref&gt;</div></td> </tr> <tr> <td colspan="2" class="diff-lineno">Line 267:</td> <td colspan="2" class="diff-lineno">Line 267:</td> </tr> <tr> <td class="diff-marker"></td> <td style="background-color: #f8f9fa; color: #202122; font-size: 88%; border-style: solid; border-width: 1px 1px 1px 4px; border-radius: 0.33em; border-color: #eaecf0; vertical-align: top; white-space: pre-wrap;"><br /></td> <td class="diff-marker"></td> <td style="background-color: #f8f9fa; color: #202122; font-size: 88%; border-style: solid; border-width: 1px 1px 1px 4px; border-radius: 0.33em; border-color: #eaecf0; vertical-align: top; white-space: pre-wrap;"><br /></td> </tr> <tr> <td class="diff-marker"></td> <td style="background-color: #f8f9fa; color: #202122; font-size: 88%; border-style: solid; border-width: 1px 1px 1px 4px; border-radius: 0.33em; border-color: #eaecf0; vertical-align: top; white-space: pre-wrap;"><div>==Energy security==</div></td> <td class="diff-marker"></td> <td style="background-color: #f8f9fa; color: #202122; font-size: 88%; border-style: solid; border-width: 1px 1px 1px 4px; border-radius: 0.33em; border-color: #eaecf0; vertical-align: top; white-space: pre-wrap;"><div>==Energy security==</div></td> </tr> <tr> <td class="diff-marker" data-marker="−"></td> <td style="color: #202122; font-size: 88%; border-style: solid; border-width: 1px 1px 1px 4px; border-radius: 0.33em; border-color: #ffe49c; vertical-align: top; white-space: pre-wrap;"><div>One of the main drivers for adoption of biodiesel is [[energy security]]. This means that a nation's dependence on oil is reduced, and substituted with use of locally available sources, such as coal, gas, or renewable sources. Thus a country can benefit from adoption of biofuels, without a reduction in greenhouse gas emissions. While the total energy balance is debated, it is clear that the dependence on oil is reduced. One example is the energy used to manufacture fertilizers, which could come from a variety of sources other than petroleum. The US National Renewable Energy Laboratory (NREL) states that energy security is the number one driving force behind the US biofuels programme,&lt;ref name = "NREL biodiesel algae"&gt;{{cite <del style="font-weight: bold; text-decoration: none;">journal</del>|first1=John|last1=Sheehan|first2=Terri|last2=Dunahay|first3=John|last3=Benemann|first4=Paul|last4=Roessler|title=A look back at the U.S. Department of Energy's Aquatic Species Program: Biodiesel from Algae|version=Close-out Report|publisher=United States Department of Energy|date=July 1998|access-date=2007-01-02|url=http://www.nrel.gov/docs/legosti/fy98/24190.pdf|format=PDF (3.7&amp;nbsp;Mb)<del style="font-weight: bold; text-decoration: none;">|journal=</del>|archive-date=2020-04-23|archive-url=https://web.archive.org/web/20200423092435/https://www.nrel.gov/docs/legosti/fy98/24190.pdf|url-status=live}}&lt;/ref&gt; and a White House "Energy Security for the 21st Century" paper makes it clear that energy security is a major reason for promoting biodiesel.&lt;ref&gt;{{cite web|title=Energy Security for the 21st Century|publisher=The White House|date=2008-03-05|url=https://georgewbush-whitehouse.archives.gov/infocus/energy/|access-date=2008-04-15|archive-date=2019-09-14|archive-url=https://web.archive.org/web/20190914150733/https://georgewbush-whitehouse.archives.gov/infocus/energy/|url-status=live}}&lt;/ref&gt; The former EU commission president, Jose Manuel Barroso, speaking at a recent EU biofuels conference, stressed that properly managed biofuels have the potential to reinforce the EU's security of supply through diversification of energy sources.&lt;ref&gt;{{cite web|title=International Biofuels Conference|publisher=HGCA|url=http://www.hgca.com/content.output/2369/2369/Markets/Analysis/International%20Biofuel%20Conference.mspx|access-date=2008-04-15|archive-url=https://web.archive.org/web/20081211211937/http://www.hgca.com/content.output/2369/2369/Markets/Analysis/International%20Biofuel%20Conference.mspx|archive-date=2008-12-11|url-status=dead}}&lt;/ref&gt;</div></td> <td class="diff-marker" data-marker="+"></td> <td style="color: #202122; font-size: 88%; border-style: solid; border-width: 1px 1px 1px 4px; border-radius: 0.33em; border-color: #a3d3ff; vertical-align: top; white-space: pre-wrap;"><div>One of the main drivers for adoption of biodiesel is [[energy security]]. This means that a nation's dependence on oil is reduced, and substituted with use of locally available sources, such as coal, gas, or renewable sources. Thus a country can benefit from adoption of biofuels, without a reduction in greenhouse gas emissions. While the total energy balance is debated, it is clear that the dependence on oil is reduced. One example is the energy used to manufacture fertilizers, which could come from a variety of sources other than petroleum. The US National Renewable Energy Laboratory (NREL) states that energy security is the number one driving force behind the US biofuels programme,&lt;ref name = "NREL biodiesel algae"&gt;{{cite <ins style="font-weight: bold; text-decoration: none;">web</ins>|first1=John|last1=Sheehan|first2=Terri|last2=Dunahay|first3=John|last3=Benemann|first4=Paul|last4=Roessler|title=A look back at the U.S. Department of Energy's Aquatic Species Program: Biodiesel from Algae|version=Close-out Report|publisher=United States Department of Energy|date=July 1998|access-date=2007-01-02|url=http://www.nrel.gov/docs/legosti/fy98/24190.pdf|format=PDF (3.7&amp;nbsp;Mb)|archive-date=2020-04-23|archive-url=https://web.archive.org/web/20200423092435/https://www.nrel.gov/docs/legosti/fy98/24190.pdf|url-status=live}}&lt;/ref&gt; and a White House "Energy Security for the 21st Century" paper makes it clear that energy security is a major reason for promoting biodiesel.&lt;ref&gt;{{cite web|title=Energy Security for the 21st Century|publisher=The White House|date=2008-03-05|url=https://georgewbush-whitehouse.archives.gov/infocus/energy/|access-date=2008-04-15|archive-date=2019-09-14|archive-url=https://web.archive.org/web/20190914150733/https://georgewbush-whitehouse.archives.gov/infocus/energy/|url-status=live}}&lt;/ref&gt; The former EU commission president, Jose Manuel Barroso, speaking at a recent EU biofuels conference, stressed that properly managed biofuels have the potential to reinforce the EU's security of supply through diversification of energy sources.&lt;ref&gt;{{cite web|title=International Biofuels Conference|publisher=HGCA|url=http://www.hgca.com/content.output/2369/2369/Markets/Analysis/International%20Biofuel%20Conference.mspx|access-date=2008-04-15|archive-url=https://web.archive.org/web/20081211211937/http://www.hgca.com/content.output/2369/2369/Markets/Analysis/International%20Biofuel%20Conference.mspx|archive-date=2008-12-11|url-status=dead}}&lt;/ref&gt;</div></td> </tr> <tr> <td class="diff-marker"></td> <td style="background-color: #f8f9fa; color: #202122; font-size: 88%; border-style: solid; border-width: 1px 1px 1px 4px; border-radius: 0.33em; border-color: #eaecf0; vertical-align: top; white-space: pre-wrap;"><br /></td> <td class="diff-marker"></td> <td style="background-color: #f8f9fa; color: #202122; font-size: 88%; border-style: solid; border-width: 1px 1px 1px 4px; border-radius: 0.33em; border-color: #eaecf0; vertical-align: top; white-space: pre-wrap;"><br /></td> </tr> <tr> <td class="diff-marker"></td> <td style="background-color: #f8f9fa; color: #202122; font-size: 88%; border-style: solid; border-width: 1px 1px 1px 4px; border-radius: 0.33em; border-color: #eaecf0; vertical-align: top; white-space: pre-wrap;"><div>== Global biofuel policies ==</div></td> <td class="diff-marker"></td> <td style="background-color: #f8f9fa; color: #202122; font-size: 88%; border-style: solid; border-width: 1px 1px 1px 4px; border-radius: 0.33em; border-color: #eaecf0; vertical-align: top; white-space: pre-wrap;"><div>== Global biofuel policies ==</div></td> </tr> <tr> <td colspan="2" class="diff-lineno">Line 327:</td> <td colspan="2" class="diff-lineno">Line 327:</td> </tr> <tr> <td class="diff-marker"></td> <td style="background-color: #f8f9fa; color: #202122; font-size: 88%; border-style: solid; border-width: 1px 1px 1px 4px; border-radius: 0.33em; border-color: #eaecf0; vertical-align: top; white-space: pre-wrap;"><br /></td> <td class="diff-marker"></td> <td style="background-color: #f8f9fa; color: #202122; font-size: 88%; border-style: solid; border-width: 1px 1px 1px 4px; border-radius: 0.33em; border-color: #eaecf0; vertical-align: top; white-space: pre-wrap;"><br /></td> </tr> <tr> <td class="diff-marker"></td> <td style="background-color: #f8f9fa; color: #202122; font-size: 88%; border-style: solid; border-width: 1px 1px 1px 4px; border-radius: 0.33em; border-color: #eaecf0; vertical-align: top; white-space: pre-wrap;"><div>The surge of interest in biodiesels has highlighted a number of [[List of environmental issues|environmental effects]] associated with its use. These potentially include reductions in [[greenhouse gas emissions]],&lt;ref&gt;</div></td> <td class="diff-marker"></td> <td style="background-color: #f8f9fa; color: #202122; font-size: 88%; border-style: solid; border-width: 1px 1px 1px 4px; border-radius: 0.33em; border-color: #eaecf0; vertical-align: top; white-space: pre-wrap;"><div>The surge of interest in biodiesels has highlighted a number of [[List of environmental issues|environmental effects]] associated with its use. These potentially include reductions in [[greenhouse gas emissions]],&lt;ref&gt;</div></td> </tr> <tr> <td class="diff-marker" data-marker="−"></td> <td style="color: #202122; font-size: 88%; border-style: solid; border-wid