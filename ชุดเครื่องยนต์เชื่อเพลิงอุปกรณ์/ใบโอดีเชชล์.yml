<summary type="html"><p><span class="autocomment">Applications: </span> fix convert, typo and switch to semicolon divider</p> <table style="background-color: #fff; color: #202122;" data-mw-interface=""> <col class="diff-marker" /> <col class="diff-content" /> <col class="diff-marker" /> <col class="diff-content" /> <tr class="diff-title" lang="en"> <td colspan="2" style="background-color: #fff; color: #202122; text-align: center;">← Previous revision</td> <td colspan="2" style="background-color: #fff; color: #202122; text-align: center;">Revision as of 12:37, 26 May 2026</td> </tr><tr> <td colspan="2" class="diff-lineno">Line 66:</td> <td colspan="2" class="diff-lineno">Line 66:</td> </tr> <tr> <td class="diff-marker"></td> <td style="background-color: #f8f9fa; color: #202122; font-size: 88%; border-style: solid; border-width: 1px 1px 1px 4px; border-radius: 0.33em; border-color: #eaecf0; vertical-align: top; white-space: pre-wrap;"><div>==Applications==</div></td> <td class="diff-marker"></td> <td style="background-color: #f8f9fa; color: #202122; font-size: 88%; border-style: solid; border-width: 1px 1px 1px 4px; border-radius: 0.33em; border-color: #eaecf0; vertical-align: top; white-space: pre-wrap;"><div>==Applications==</div></td> </tr> <tr> <td class="diff-marker"></td> <td style="background-color: #f8f9fa; color: #202122; font-size: 88%; border-style: solid; border-width: 1px 1px 1px 4px; border-radius: 0.33em; border-color: #eaecf0; vertical-align: top; white-space: pre-wrap;"><div>[[File:Targray Biodiesel Railcar.png|thumb|Targray Biofuels railcar transporting Biodiesel.]]</div></td> <td class="diff-marker"></td> <td style="background-color: #f8f9fa; color: #202122; font-size: 88%; border-style: solid; border-width: 1px 1px 1px 4px; border-radius: 0.33em; border-color: #eaecf0; vertical-align: top; white-space: pre-wrap;"><div>[[File:Targray Biodiesel Railcar.png|thumb|Targray Biofuels railcar transporting Biodiesel.]]</div></td> </tr> <tr> <td class="diff-marker" data-marker="−"></td> <td style="color: #202122; font-size: 88%; border-style: solid; border-width: 1px 1px 1px 4px; border-radius: 0.33em; border-color: #ffe49c; vertical-align: top; white-space: pre-wrap;"><div>Biodiesel can be used in pure form (B100) or may be blended with petroleum diesel at any concentration in most injection pump diesel engines. New extreme high-pressure ({{convert|29000|psi|<del style="font-weight: bold; text-decoration: none;">abrr</del>=on}}) [[common rail]] engines have strict factory limits of B5 or B20, depending on manufacturer.&lt;ref&gt;"[http://biodiesel.org/using-biodiesel/oem-information/oem-statement-summary-chart OEM Statement Summary Chart] {{Webarchive|url=http://webarchive.loc.gov/all/20160407054752/http://biodiesel.org/using%2Dbiodiesel/oem%2Dinformation/oem%2Dstatement%2Dsummary%2Dchart |date=2016-04-07 }}." Biodiesel.org. National Biodiesel Board, 1 Dec. 2014. Web. 19 Nov. 2015.&lt;/ref&gt; Biodiesel has different [[solvent]] properties from petrodiesel, and will degrade natural rubber [[gasket]]s and [[hose (tubing)|hoses]] in vehicles (mostly vehicles manufactured before 1992), although these tend to wear out naturally and most likely will have already been replaced with [[FKM]], which is nonreactive to biodiesel. Biodiesel has been known to break down deposits of residue in the fuel lines where petrodiesel has been used.&lt;ref&gt;{{cite web|last=McCormick|first=R.L.|title=2006 Biodiesel Handling and Use Guide Third Edition|url=http://www.nrel.gov/vehiclesandfuels/npbf/pdfs/40555.pdf|access-date=2006-12-18|archive-url=https://web.archive.org/web/20061216051136/http://www.nrel.gov/vehiclesandfuels/npbf/pdfs/40555.pdf|archive-date=2006-12-16|url-status=dead}}&lt;/ref&gt; As a result, [[fuel filter]]s may become clogged with particulates if a quick transition to pure biodiesel is made. Therefore, it is recommended to change the fuel filters on engines and heaters shortly after first switching to a biodiesel blend.&lt;ref&gt;{{cite web|title=US EPA Biodiesel Factsheet|url=http://www.epa.gov/smartway/growandgo/documents/factsheet-biodiesel.htm|url-status=dead|archive-url=https://web.archive.org/web/20080726004436/http://www.epa.gov/smartway/growandgo/documents/factsheet-biodiesel.htm|archive-date=July 26, 2008|date=2016-03-03}}&lt;/ref&gt;</div></td> <td class="diff-marker" data-marker="+"></td> <td style="color: #202122; font-size: 88%; border-style: solid; border-width: 1px 1px 1px 4px; border-radius: 0.33em; border-color: #a3d3ff; vertical-align: top; white-space: pre-wrap;"><div>Biodiesel can be used in pure form (B100) or may be blended with petroleum diesel at any concentration in most injection pump diesel engines. New extreme high-pressure ({{convert|29000|psi|<ins style="font-weight: bold; text-decoration: none;">abbr</ins>=on<ins style="font-weight: bold; text-decoration: none;">|disp=semicolon</ins>}}) [[common rail]] engines have strict factory limits of B5 or B20, depending on manufacturer.&lt;ref&gt;"[http://biodiesel.org/using-biodiesel/oem-information/oem-statement-summary-chart OEM Statement Summary Chart] {{Webarchive|url=http://webarchive.loc.gov/all/20160407054752/http://biodiesel.org/using%2Dbiodiesel/oem%2Dinformation/oem%2Dstatement%2Dsummary%2Dchart |date=2016-04-07 }}." Biodiesel.org. National Biodiesel Board, 1 Dec. 2014. Web. 19 Nov. 2015.&lt;/ref&gt; Biodiesel has different [[solvent]] properties from petrodiesel, and will degrade natural rubber [[gasket]]s and [[hose (tubing)|hoses]] in vehicles (mostly vehicles manufactured before 1992), although these tend to wear out naturally and most likely will have already been replaced with [[FKM]], which is nonreactive to biodiesel. Biodiesel has been known to break down deposits of residue in the fuel lines where petrodiesel has been used.&lt;ref&gt;{{cite web|last=McCormick|first=R.L.|title=2006 Biodiesel Handling and Use Guide Third Edition|url=http://www.nrel.gov/vehiclesandfuels/npbf/pdfs/40555.pdf|access-date=2006-12-18|archive-url=https://web.archive.org/web/20061216051136/http://www.nrel.gov/vehiclesandfuels/npbf/pdfs/40555.pdf|archive-date=2006-12-16|url-status=dead}}&lt;/ref&gt; As a result, [[fuel filter]]s may become clogged with particulates if a quick transition to pure biodiesel is made. Therefore, it is recommended to change the fuel filters on engines and heaters shortly after first switching to a biodiesel blend.&lt;ref&gt;{{cite web|title=US EPA Biodiesel Factsheet|url=http://www.epa.gov/smartway/growandgo/documents/factsheet-biodiesel.htm|url-status=dead|archive-url=https://web.archive.org/web/20080726004436/http://www.epa.gov/smartway/growandgo/documents/factsheet-biodiesel.htm|archive-date=July 26, 2008|date=2016-03-03}}&lt;/ref&gt;</div></td> </tr> <tr> <td class="diff-marker"></td> <td style="background-color: #f8f9fa; color: #202122; font-size: 88%; border-style: solid; border-width: 1px 1px 1px 4px; border-radius: 0.33em; border-color: #eaecf0; vertical-align: top; white-space: pre-wrap;"><br /></td> <td class="diff-marker"></td> <td style="background-color: #f8f9fa; color: #202122; font-size: 88%; border-style: solid; border-width: 1px 1px 1px 4px; border-radius: 0.33em; border-color: #eaecf0; vertical-align: top; white-space: pre-wrap;"><br /></td> </tr> <tr> <td class="diff-marker"></td> <td style="background-color: #f8f9fa; color: #202122; font-size: 88%; border-style: solid; border-width: 1px 1px 1px 4px; border-radius: 0.33em; border-color: #eaecf0; vertical-align: top; white-space: pre-wrap;"><div>===Distribution===</div></td> <td class="diff-marker"></td> <td style="background-color: #f8f9fa; color: #202122; font-size: 88%; border-style: solid; border-width: 1px 1px 1px 4px; border-radius: 0.33em; border-color: #eaecf0; vertical-align: top; white-space: pre-wrap;"><div>===Distribution===</div></td> </tr> </table></summary>
