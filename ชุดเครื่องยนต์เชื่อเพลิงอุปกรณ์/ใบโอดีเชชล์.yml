irst=David|title=Green Fuel for the Airline Industry|journal=New Scientist|volume=199|issue=2669|pages=34–37|date=13 August 2008|url=https://www.newscientist.com/channel/tech/mg19926691.700-green-fuel-for-the-airline-industry.html|access-date=2008-09-23|doi=10.1016/S0262-4079(08)62067-9|archive-date=2021-07-31|archive-url=https://web.archive.org/web/20210731013356/https://www.newscientist.com/article/mg19926691-700-green-fuel-for-the-airline-industry/?ignored=irrelevant|url-status=live|url-access=subscription}}&lt;/ref&gt;</div></td> <td class="diff-marker"></td> <td style="background-color: #f8f9fa; color: #202122; font-size: 88%; border-style: solid; border-width: 1px 1px 1px 4px; border-radius: 0.33em; border-color: #eaecf0; vertical-align: top; white-space: pre-wrap;"><div>Algae fuel yields have not yet been accurately determined, but DOE is reported as saying that algae yield 30 times more energy per acre than land crops such as soybeans.&lt;ref name="washingtonpost-algae"&gt;{{cite news|url=https://www.washingtonpost.com/wp-dyn/content/article/2008/01/03/AR2008010303907.html|title=DOE quoted by Washington Post in "A Promising Oil Alternative: Algae Energy"|work=Washingtonpost.com|date=2008-01-06|access-date=2010-03-15|archive-date=2011-05-14|archive-url=https://web.archive.org/web/20110514091059/http://www.washingtonpost.com/wp-dyn/content/article/2008/01/03/AR2008010303907.html|url-status=live}}&lt;/ref&gt; Yields of 36 tonnes/hectare are considered practical by Ami Ben-Amotz of the Institute of Oceanography in [[Haifa]], who has been farming Algae commercially for over 20&amp;nbsp;years.&lt;ref&gt;{{cite journal|last=Strahan|first=David|title=Green Fuel for the Airline Industry|journal=New Scientist|volume=199|issue=2669|pages=34–37|date=13 August 2008|url=https://www.newscientist.com/channel/tech/mg19926691.700-green-fuel-for-the-airline-industry.html|access-date=2008-09-23|doi=10.1016/S0262-4079(08)62067-9|archive-date=2021-07-31|archive-url=https://web.archive.org/web/20210731013356/https://www.newscientist.com/article/mg19926691-700-green-fuel-for-the-airline-industry/?ignored=irrelevant|url-status=live|url-access=subscription}}&lt;/ref&gt;</div></td> </tr> <tr> <td class="diff-marker"></td> <td style="background-color: #f8f9fa; color: #202122; font-size: 88%; border-style: solid; border-width: 1px 1px 1px 4px; border-radius: 0.33em; border-color: #eaecf0; vertical-align: top; white-space: pre-wrap;"><br /></td> <td class="diff-marker"></td> <td style="background-color: #f8f9fa; color: #202122; font-size: 88%; border-style: solid; border-width: 1px 1px 1px 4px; border-radius: 0.33em; border-color: #eaecf0; vertical-align: top; white-space: pre-wrap;"><br /></td> </tr> <tr> <td class="diff-marker" data-marker="−"></td> <td style="color: #202122; font-size: 88%; border-style: solid; border-width: 1px 1px 1px 4px; border-radius: 0.33em; border-color: #ffe49c; vertical-align: top; white-space: pre-wrap;"><div>[[Jatropha#Vegoil and biodiesel|Jatropha]] has been cited as a high-yield source of biodiesel but yields are highly dependent on climatic and soil conditions. The estimates at the low end put the yield at about 200&amp;nbsp;US&amp;nbsp;gal/acre (1.5-2 tonnes per hectare) per crop; in more favorable climates two or more crops per year have been achieved.&lt;ref name="jatrophaex"&gt;{{cite news|url=http://findarticles.com/p/articles/mi_m0CYH/is_15_7/ai_107215410|title=India's jatropha plant biodiesel yield termed wildly exaggerated<del style="font-weight: bold; text-decoration: none;">|publisher=Findarticles.com</del>|date=2003-08-18|access-date=2010-03-15|archive-date=2009-10-02|archive-url=https://web.archive.org/web/20091002102739/http://findarticles.com/p/articles/mi_m0CYH/is_15_7/ai_107215410/|url-status=usurped}}&lt;/ref&gt; It is grown in the [[Philippines]], [[Mali]] and [[India]], is drought-resistant, and can [[intercropping|share space]] with other cash crops such as coffee, sugar, fruits and vegetables.&