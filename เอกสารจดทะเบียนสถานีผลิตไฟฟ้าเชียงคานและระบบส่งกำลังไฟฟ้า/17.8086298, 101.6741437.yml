pre-wrap;"><div>EGTA has also been used experimentally for the treatment of animals with [[cerium]] poisoning and for the [[Separation process|separation]] of [[thorium]] from the mineral [[monazite]]. EGTA is used as a compound in [[elution volume|elution]] buffer in the protein purification technique known as [[tandem affinity purification]], in which [[recombinant fusion protein]]s are bound to [[calmodulin]] beads and eluted out by adding EGTA.</div></td> </tr> </table></summary>
