เชื้อเพลิงสําหรับการผลิตไฟฟ้า
เนื่องจากไฟฟ้ากลายเป็นปัจจัยสําคัญในการพัฒนาเศรษฐกิจและสังคมของทุกประเทศ การจัดการไฟฟ้าจึงกลายเป็นนโยบายหลักของแต่ละรัฐบาลเนื่องจากบ่งบอกถึงสวัสดิภาพของประชาชน

อย่างไรก็ตาม ในการผลิตไฟฟ้าจําเป็นต้องมีแผนการใช้เชื้อเพลิงอย่างเหมาะสมในบริบทของภาวะเศรษฐกิจ สภาพทางภูมิศาสตร์ และความต้องการใช้ไฟฟ้าของประเทศ องค์กรที่รับผิดชอบด้านไฟฟ้ามีบทบาทสําคัญในการกําหนดนโยบายที่คํานึงถึงความเพียงพอ คุณภาพดี และราคาไฟฟ้าที่เหมาะสม ตลอดจนการคุ้มครองสิ่งแวดล้อม จึงต้องคํานึงถึงประโยชน์และข้อเสียของเชื้อเพลิงแต่ละประเภทที่จะใช้ในการผลิตไฟฟ้าอย่างรอบคอบ


ก๊าซธรรมชาติ
ก๊าซธรรมชาติก็เหมือนกับน้ํามัน พลังงานปิโตรเลียม ในความเป็นจริง น้ํามัน ก๊าซธรรมชาติ และถ่านหินเกิดขึ้นจากซากพืชและสัตว์ที่สะสมและฝังอยู่ใต้พื้นดินเป็นเวลาหลายร้อยล้านปี และเปลี่ยนสภาพตามธรรมชาติให้เป็นฟอสซิลซึ่งเป็นที่มาของน้ํามันดิบ ก๊าซธรรมชาติ และถ่านหิน เชื้อเพลิงชนิดนี้จึงเรียกว่าเชื้อเพลิงฟอสซิล

ในทางวิทยาศาสตร์ พืช สัตว์ และร่างกายมนุษย์มีเซลล์ที่ประกอบด้วยไฮโดรเจนและคาร์บอนเป็นส่วนใหญ่ เมื่อน้ํามัน ก๊าซธรรมชาติ และถ่านหินเกิดขึ้นจากการสะสมของซากพืชและสัตว์ พวกมันจะประกอบด้วยโมเลกุลไฮโดรคาร์บอนเป็นส่วนใหญ่ เมื่อเผา ไฮโดรคาร์บอนก็เหมือนกับไม้ที่ผลิตพลังงาน แต่เชื้อเพลิงฟอสซิล เช่น น้ํามัน ก๊าซธรรมชาติ หรือถ่านหินจะให้พลังงานมากกว่า

องค์ประกอบ
ก๊าซธรรมชาติเป็นส่วนผสมของก๊าซไฮโดรคาร์บอนที่ประกอบด้วยมีเทน อีเทน โพรเพน บิวเทน ฯลฯ โดยทั่วไปองค์ประกอบหลักคือมีเทนตั้งแต่ 70% ขึ้นไป ก่อนที่จะนําไปใช้จะต้องแยกส่วนผสมของก๊าซไฮโดรคาร์บอนนี้ออกเพื่อประโยชน์สูงสุด

นอกจากก๊าซไฮโดรคาร์บอนแล้ว ก๊าซธรรมชาติอาจมีก๊าซชนิดอื่น เช่น คาร์บอนไดออกไซด์ ไฮโดรเจนซัลไฟด์ ไนโตรเจน และน้ํา ซึ่งสามารถแยกออกเพื่อใช้ต่อไปโดยกระบวนการแยกที่โรงแยกก๊าซ

การจัดหาก๊าซธรรมชาติเพื่อผลิตไฟฟ้า
ในการจัดหาก๊าซธรรมชาติเพื่อผลิตไฟฟ้า กฟผ. คํานึงถึงต้นทุนการผลิตควบคู่ไปกับคุณภาพและความปลอดภัยของระบบไฟฟ้า

การจัดหาก๊าซธรรมชาติซึ่งเป็นเชื้อเพลิงหลักในการผลิตไฟฟ้าจะต้องดําเนินการด้วยความระมัดระวังโดยผู้เชี่ยวชาญที่เข้าใจกระบวนการวางแผน การผลิตไฟฟ้า การจัดการโครงการ ตลอดจนกระบวนการจัดหาและถ่ายโอนก๊าซ อีกทั้งต้องมีความสามารถในการเจรจาเชิงพาณิชย์ การวิเคราะห์เศรษฐศาสตร์พลังงาน และสถานะทางการเงินในการซื้อ ตลอดจนโครงสร้างราคาก๊าซธรรมชาติ 

    

ถ่านหิน
ถ่านหินเป็นหินตะกอนสีน้ําตาลหรือสีน้ําตาลดําที่ติดไฟได้ ซึ่งเป็นเชื้อเพลิงแร่ชนิดหนึ่งที่มีพื้นผิวสว่างหรือหมองคล้ําและมีน้ําหนักเบา ถ่านหินประกอบด้วยคาร์บอน ไฮโดรเจน ไนโตรเจน และออกซิเจน และอาจมีองค์ประกอบหรือสารอื่นๆ เช่น ซัลเฟอร์ในปริมาณเล็กน้อย ถ่านหินที่มีปริมาณคาร์บอนสูงและมีองค์ประกอบอื่นๆ ต่ําจะสร้างความร้อนสูงขึ้นเมื่อถูกเผา และจัดว่ามีคุณภาพสูง


การจําแนกประเภทถ่านหิน
ถ่านหินจําแนกออกเป็นห้าประเภท ดังนี้
          1 พีทเป็นสารตั้งต้นของถ่านหินที่มีซากพืชเน่าเปื่อยและสามารถใช้เป็นเชื้อเพลิงได้ 
          2 ลิกไนต์มีซากพืชเหลืออยู่เล็กน้อยซึ่งมีความชื้นโดยธรรมชาติสูงและสามารถใช้เป็นเชื้อเพลิงได้ 
          3 Subbituminous เป็นถ่านหินสีดําและเหมาะสําหรับใช้ในการผลิตไฟฟ้า
          4 บิทูมินัสเป็นหินตะกอนที่มีความหนาแน่น โดยทั่วไปจะมีความแข็ง โดยมีชั้นถ่านหินสีดํามันวาวชัดเจนอยู่ภายในตะเข็บ และเหมาะสําหรับใช้ในการถลุงเหล็ก 
          5 แอนทราไซต์เป็นถ่านหินสีดํามันวาวที่มีความแวววาวแวววาว มันแตกหักด้วยการแตกหักของหอยโข่งเป็นชิ้นแหลมคมและไม่ติดไฟ

การทําเหมืองถ่านหิน
การผลิตถ่านหินหรือการขุดถ่านหินเพื่อใช้ประโยชน์เรียกว่าการทําเหมืองถ่านหิน โดยทั่วไป การทําเหมืองถ่านหินมี 2 ประเภท คือ    

เหมืองเปิด

การทําเหมืองแบบเปิดเป็นเทคนิคการทําเหมืองบนพื้นผิวซึ่งแยกแร่ธาตุออกจากหลุมเปิดในพื้นดิน เป็นวิธีที่ใช้กันมากที่สุดและไม่ต้องใช้ทุนแพง ใช้เมื่อพบแหล่งแร่หรือแร่ค่อนข้างใกล้กับพื้นผิวโลก ความลึกของหลุมขึ้นอยู่กับขนาดของพื้นที่และต้นทุน-ผลประโยชน์ของการลงทุน โดยทั่วไป ความลึกมีตั้งแต่พื้นผิวโลกไปจนถึง 500 ม. ใต้พื้นผิว

เหมืองถ่านหินใต้ดิน

ในพื้นที่ที่ตัวแร่ลึกเกินไปสําหรับเหมืองเปิด จําเป็นต้องใช้การขุดถ่านหินใต้ดินโดยการขุดอุโมงค์เพื่อใช้อุปกรณ์พิเศษในการสกัดและขนส่งถ่านหินขึ้นสู่พื้นผิวด้วยสายพานลําเลียง การทําเหมืองถ่านหินใต้ดินเกี่ยวข้องกับการลงทุนสูงและแผนการขุดอย่างระมัดระวังอย่างยิ่งเพื่อป้องกันการระเบิดของเหมืองจากการสะสมของก๊าซในตะเข็บถ่านหินและการพังทลายของหิน จําเป็นต้องศึกษาธรณีวิทยาและธรณีวิทยาวิศวกรรมของพื้นที่โดยละเอียด

นอกจากการทําเหมืองถ่านหินแล้ว ในปัจจุบัน ยังมีการศึกษาหลายชิ้นเพื่อลดผลกระทบจากการใช้ถ่านหิน เช่น การแปรสภาพเป็นแก๊สถ่านหิน ส่วนผสมของเหลวจากถ่านหินเพื่อลดมลพิษและอํานวยความสะดวกในการขนส่ง และการใช้มีเทนในชั้นถ่านหินเป็นเชื้อเพลิง 

ประโยชน์ถ่านหิน
ถ่านหินถูกนํามาใช้กันอย่างแพร่หลายเนื่องจากมีปริมาณสํารองอยู่ทั่วโลกและมีอุปทานมากมาย นอกจากนี้การทําเหมืองถ่านหินไม่ใช่ธุรกิจที่ซับซ้อน เนื่องจากมีราคาถูกกว่าน้ํามัน ถ่านหินจึงมักใช้ในอุตสาหกรรมที่เกี่ยวข้องกับการใช้หม้อไอน้ําในการผลิต เช่น การผลิตไฟฟ้า การถลุงโลหะ การผลิตปูนซีเมนต์ การบ่มยาสูบ และอุตสาหกรรมอาหาร

นอกจากนี้ ถ่านหินยังใช้ในการผลิตถ่านกัมมันต์เพื่อดูดซับกลิ่น คาร์บอนไฟเบอร์ และการทําให้ถ่านหินกลายเป็นของเหลวหรือการแปรสภาพเป็นแก๊สถ่านหิน ในการแปรสภาพเป็นแก๊สถ่านหิน สิ่งเจือปนและผลพลอยได้ที่ถูกกําจัดออกจากถ่านหินสามารถนําไปใช้เพื่อวัตถุประสงค์ต่างๆ ได้ เช่น ซัลเฟอร์สําหรับทํากรดซัลฟิวริกและยิปซั่ม แอมโมเนียสําหรับปุ๋ยทางการเกษตร เถ้าสําหรับวัสดุก่อสร้าง เป็นต้น

หินน้ํามัน
หินน้ํามัน เป็นหินตะกอนเนื้อละเอียดที่ก่อตัวเมื่อหลายล้านปีก่อนจากอินทรียวัตถุและตะกอนที่ฝังอยู่ในพื้นที่ชุ่มน้ํา เป็นสีน้ําตาลหรือสีน้ําตาลเข้มหินน้ํามันมีสารประกอบที่เรียกว่าเคโรเจนซึ่งสามารถสกัดน้ํามันและไฮโดรคาร์บอนได้โดยการให้ความร้อนที่ 500μC ผลิตภัณฑ์กลั่นสามารถใช้เพื่อวัตถุประสงค์เดียวกันกับผลิตภัณฑ์ที่ได้จากน้ํามันดิบ

หินน้ํามันส่วนใหญ่พบทางภาคเหนือของประเทศไทยโดยเฉพาะในแหล่งแม่สอดซึ่งปัจจุบันเป็นแหล่งหินน้ํามันที่ใหญ่ที่สุดของประเทศ จากการสํารวจในช่วงปี พ.ศ.2517–1983 มีการค้นพบแหล่งหินน้ํามัน 9 แห่ง โดยมีปริมาณสํารองรวมไม่น้อยกว่า 11,000 ล้านเมตริกตัน

ประโยชน์จากหินน้ํามัน   
1 หินน้ํามันสามารถบด พ่น และเผาในเตาอบที่ออกแบบมาเป็นพิเศษ พลังงานที่ได้จากการเผาไหม้สามารถนําไปใช้ในการผลิตไฟฟ้าได้
2 สามารถสกัดน้ํามันจากหินน้ํามันมาใช้ได้ 
3 ผลพลอยได้จากหินน้ํามันที่ถูกเผาเช่นเดียวกับข้อ 1 สามารถพัฒนาเป็นวัสดุก่อสร้างได้ เช่น ส่วนผสมในซีเมนต์หรืออิฐ

ปัจจุบันหินน้ํามันยังไม่มีการใช้กันอย่างแพร่หลายในอุตสาหกรรม อย่างไรก็ตาม หลังจากวิกฤตการณ์น้ํามันในปี พ.ศ.2516 ได้มีการให้ความสําคัญกับหินน้ํามันเป็นพลังงานทดแทนมากขึ้น ในการผลิตไฟฟ้า กฟผ. ร่วมกับกรมทรัพยากรธรณีกําลังทําการศึกษาความเป็นไปได้ในการใช้หินน้ํามันในการผลิตไฟฟ้า

ส่วนการสํารวจและประเมินทรัพยากรของ กฟผ. อยู่ระหว่างการสํารวจแหล่งหินน้ํามันตามมติคณะรัฐมนตรีเมื่อวันที่ 11 ธันวาคม 2550 ซึ่งให้ความเห็นชอบตามข้อเสนอของกระทรวงพลังงาน ดังนี้

1 การจัดสรรพื้นที่ 104 กม2 ในบ้านห้วยกระโลก อําเภอแม่สอด จังหวัดตาก เพื่อเป็นพื้นที่สํารวจเพื่อพัฒนาแหล่งหินน้ํามัน

2 กรมเชื้อเพลิงธรรมชาติ และ กฟผ. จะร่วมกันดําเนินการสํารวจและจัดทําแนวทางการพัฒนาหินน้ํามันในพื้นที่ที่กําหนดเป็นเวลา 4 ปี นับจากวันที่คณะรัฐมนตรีให้ความเห็นชอบ

การผลิตถ่านหินและไฟฟ้า
ปัจจุบันปริมาณสํารองถ่านหินในท้องถิ่นเพื่อใช้ในการผลิตไฟฟ้าค่อนข้างจํากัด แหล่งถ่านหินที่พัฒนาแล้วจะไม่สามารถรับมือกับความต้องการในอนาคตได้อย่างเพียงพอ นอกจากนี้ยังมีข้อจํากัดในด้านคุณภาพอีกด้วย แหล่งที่พัฒนาขึ้นใหม่ไม่คุ้มทุน

ดังนั้น หาก กฟผ. มีแผนก่อสร้างโรงไฟฟ้าใหม่ตามแผนพัฒนากําลังผลิตไฟฟ้า ก็เป็นไปได้ว่า กฟผ. ต้องนําเข้าถ่านหินเพื่อตอบสนองความต้องการอายุการใช้งานของโรงไฟฟ้า เนื่องจากมีปริมาณสํารองทั่วโลกจํานวนมาก กฟผ. จึงสามารถเลือกใช้ถ่านหินในทรัพย์สินที่ต้องการได้ จากสถิติการส่งออกของโลกในปี 2546-2550 ประเทศที่มีศักยภาพในการผลิตถ่านหินเพื่อการส่งออกอันดับต้นๆ คือ ประเทศในภูมิภาคเอเชียแปซิฟิก เช่น ออสเตรเลีย อินโดนีเซีย และจีน ที่ตั้งของประเทศเหล่านี้อยู่ไม่ไกลจากประเทศไทยโดยเฉพาะอินโดนีเซียซึ่งค่าขนส่งจะค่อนข้างต่ํากว่าประเทศอื่นๆ

ถ่านหินที่เหมาะสมสําหรับการผลิตไฟฟ้าคือถ่านหินคุณภาพดีที่มีค่าความร้อนสูงและมีปริมาณสิ่งเจือปนค่อนข้างต่ํา ดังนั้นถ่านหินที่เหมาะสมสําหรับการผลิตไฟฟ้าของโรงไฟฟ้าแห่งใหม่ของ กฟผ. จึงเป็นซับบิทูมินัสหรือบิทูมินัสเนื่องจากมีคุณภาพดีและมีปริมาณสํารองทั่วโลกเป็นจํานวนมาก


ปิโตรเลียม (น้ํามันดิบ)
คําว่า “petroleum” มาจากคําภาษาละติน “petra” (หิน) และ “oleum” (น้ํามัน) คําว่า “ปิโตรเลียม” ใช้เพื่ออ้างถึงน้ํามันแร่ โดยทั่วไป ปิโตรเลียม ได้แก่ คาร์บอน ไฮโดรเจน ซัลเฟอร์ และไนโตรเจน

นักวิทยาศาสตร์เชื่อว่าโลกมีต้นกําเนิดเมื่อประมาณ 4,500 ล้านปีก่อน สิ่งมีชีวิตที่ตายแล้วจํานวนมากผสมกับตะกอนอื่นๆ และตกลงสู่พื้นมหาสมุทร จากแรงกดดันทําให้ชั้นตะกอนบางส่วนกลายเป็นหินดินดาน และบางส่วนกลายเป็นหินปูนและหินทราย ซากของสิ่งมีชีวิตที่ถูกฝังหรือติดอยู่ในหินเรียกว่าฟอสซิล น้ํามันดิบและก๊าซธรรมชาติส่วนใหญ่พบในบริเวณที่มีซากสิ่งมีชีวิตหรือตะกอนฝังอยู่ อินทรียวัตถุที่ตายแล้วจะกลายเป็นน้ํามันดิบและก๊าซธรรมชาติโดยอุณหภูมิสูง แบคทีเรีย (จุลินทรีย์) การแผ่รังสี หรือกระบวนการอื่นๆ

การจําแนกประเภทของน้ํามันดิบ
น้ํามันดิบมีหลายประเภทที่มีความถ่วงจําเพาะต่างกัน รวมถึงชื่อและคุณสมบัติต่างกัน โดยทั่วไปน้ํามันดิบจะจําแนกออกเป็น 3 ประเภท ดังนี้

1  น้ํามันดิบฐานยางมะตอย หรือน้ํามันดิบแนฟเทนิกเบส พบได้ทั่วไปในตะวันออกกลาง อ่าวเม็กซิโก และเวเนซุเอลา มีลักษณะเป็นของเหลวเหนียวและมีความหนืดสูง น้ํามันดิบแอสฟัลต์–เบส เช่น น้ํามันเชื้อเพลิง ให้สารตกค้างจากการกลั่นที่สูงกว่า ง่ายสําหรับการขนส่งเนื่องจากไม่แข็งตัว สารตกค้างจากการกลั่นส่วนใหญ่เป็นวัสดุแอสฟัลต์ติก เชื่อกันว่าการก่อตัวของน้ํามันดิบฐานแอสฟัลต์นั้นมาจากสิ่งมีชีวิตที่ตายแล้วบนพื้นมหาสมุทร

2  น้ํามันดิบพาราฟินเบส เป็นน้ํามันดิบเกรดดีกว่าที่มีค่า API สูง (แรงโน้มถ่วงของสถาบันปิโตรเลียมอเมริกัน) ให้ผลผลิตเบนซีน น้ํามันหล่อลื่น และน้ํามันก๊าดสูงขึ้น น้ํามันดิบพาราฟินเบสให้ขี้ผึ้งพาราฟินจากการกลั่น ขนส่งได้ยากขึ้นเนื่องจากน้ํามันแข็งตัวที่อุณหภูมิต่ํากว่า 30μC ในประเทศไทย น้ํามันดิบที่พบในแหล่งน้ํามันสิริกิติ์ในจังหวัดกําแพงเพชรจัดอยู่ในประเภทนี้

3  น้ํามันดิบผสมเบส เป็นน้ํามันดิบที่มีคุณสมบัติระหว่างน้ํามันดิบแอสฟัลต์–เบสกับน้ํามันดิบพาราฟินเบส เชื่อกันว่าเกิดจากซากสิ่งมีชีวิตที่อาศัยอยู่บนพื้นดินซึ่งเคยเป็นทะเลโบราณ หลังจากกระบวนการกลั่น น้ํามันจะให้ขี้ผึ้งแอสฟัลต์และ/หรือพาราฟิน

นอกจากนี้การจําแนกประเภทแต่ละประเภทยังมีสูตรและคุณสมบัติทางเคมีที่แตกต่างกัน น้ํามันดิบแอสฟัลต์–เบสให้ค่าออกเทนสูงในการกลั่น ในขณะที่น้ํามันดิบพาราฟินเบสให้ดัชนีความหนืดสูงกว่า อย่างไรก็ตาม ด้วยความก้าวหน้าทางเทคโนโลยีของอุตสาหกรรมการกลั่นน้ํามัน ทําให้สามารถบําบัดด้วยสารเติมแต่งเพื่อให้ได้คุณสมบัติที่ต้องการ          

ในทางการค้า น้ํามันดิบจําแนกได้เป็น 3 ประเภท คือ น้ํามันดิบเบา, น้ํามันดิบปานกลาง และ น้ํามันดิบหนัก ตามแรงโน้มถ่วง API ซึ่งเป็นมาตราส่วนแรงโน้มถ่วงที่ใช้กันทั่วไปในการค้าโลกที่พัฒนาโดย สถาบันปิโตรเลียมแห่งอเมริกา (The American Petroleum Institute)

การจัดหาน้ํามันเพื่อผลิตไฟฟ้า
ในการจัดหาน้ํามันเพื่อการผลิตไฟฟ้าในฐานะรัฐวิสาหกิจ กฟผ. ต้องปฏิบัติตามหลักเกณฑ์และระเบียบว่าด้วยการจัดซื้อจัดจ้างของ กฟผ. มติคณะรัฐมนตรี และกฎหมายที่เกี่ยวข้อง
