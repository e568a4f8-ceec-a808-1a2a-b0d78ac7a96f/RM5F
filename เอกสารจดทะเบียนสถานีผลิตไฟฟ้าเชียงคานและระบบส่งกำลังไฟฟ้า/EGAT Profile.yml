EGAT Profile
         

EGAT is a state-owned enterprise under the supervision of Ministry of Energy and Ministry of Finance. The principal mission of EGAT is electricity generation, electricity acquisition, and electricity sales to the Metropolitan Electricity Authority (MEA), the Provincial Electricity Authority (PEA), a umber of direct customers by law, and neighboring countries. EGAT is also responsible for other related businesses as stipulated by EGAT Act.

Core Business in Electricity
Electricity Generation
Electricity is generated from 51 EGAT power plants countrywide. With a total installed capacity of 16,235.02 MW, EGAT power plants consist of 3 thermal power plants, 6 combined cycle power plants, 30 hydropower plants, 10 renewable energy power plants (wind, solar, and geothermal), 1 diesel power plants, and 1 other power plant.          

Electricity Purchase
In addition to operating its own power plants, EGAT also purchases bulk electricity from 12 Independent Power Producers (IPPs) totaling 18,158.50 MW, from Small Power Producers (SPPs) totaling 9,333.69 MW, and from neighboring countries, namely Lao PDR and Malaysia totaling 6,234.90 MW.

Electricity Transmission
EGAT transmits electricity generated by its own power plants and electricity purchased from private power producers through its own grid network covering all parts of the country. EGAT’s transmission lines comprise different voltages ranging from 500 kV, 230 kV, 132 kV, 115 kV, and 69 kV. EGAT sells electricity to its direct customers and to MEA and PEA to distribute electricity to their retail customers countrywide. Moreover, EGAT also sells electricity to the power utilities of neighboring countries, namely Lao PDR at 115 kV and 22 kV lines and Malaysia at 300 kV HVDC lines.

Other Businesses
EGAT Related Business
        EGAT has conducted business transactions in line with its strategy to generate income from its capabilities and resources. With over 50 years of expertise and experience in the electricity sector, EGAT is entrusted by domestic and international organizations to deliver high-quality, one-stop electricity services across two main categories: 1) Power plant and transmission system business covering engineering and construction of power plants and transmission systems; power plant operation and maintenance, and transmission system maintenance for EGAT’s customers consisting of IPPs and SPPs; and telecommunications, and 2) Innovative energy solutions business covering innovative by-products from electricity generation, EGAT Smart Energy Solutions, and EGAT EV Business Solutions. 

Engineering and Construction of Power Plants and Transmission System Business: EGAT has expertise in developing all types of power projects ranging from concept proposal, feasibility study, subcontractor selection, engineering, project management, to testing and commissioning, as well as synchronization and commercial operation for both domestic and international power plants. 

In 2025, EGAT provided engineering consultancy services for private power plant projects in Thailand, including ground-mounted solar power plants with Battery Energy Storage System (BESS), industrial waste-to-energy power plants, and industrial refuse-derived fuel production facilities. These services support the development of the renewable energy sector in line with the government’s energy transition policy. 
Power Plant Operation and Maintenance Business: EGAT has expertise in comprehensive power plant operation and maintenance. With professional specialists, modern equipment and technologies, and operations that comply with international standards, the services cover both power plant operation and routine maintenance as well as general maintenance. 
EGAT has continuously provided operation and maintenance services to leading domestic and international power plants under long-term contracts. In addition to managing the existing long-term contracts, in 2025, EGAT successfully expanded its customer base by securing new contracts for major maintenance services and additional engineering consultancy services during power plant operations. These services support both domestic and international power plants, contributing to enhancing energy stability and security for Thailand. 
Transmission System Maintenance Business: EGAT provides technical consultancy services for power plants newly connected to the grid, as well as those upgrading their linking systems. The services also include scheduled maintenance of transmission lines, substation equipment, and communication and protection systems for private power plants. Besides, EGAT offers transformer oil sampling and testing services for power plant and industrial customers, along with related services such as preventive maintenance and corrective and improvement maintenance. 
Telecommunications Business: EGAT has provided telecommunications services through optical fiber installed along its high-voltage transmission system. EGAT has been granted a telecommunications license (Type 3) and International Private Leased Circuit (IPLC) from the National Broadcasting and Telecommunications Commission. EGAT’s optical fiber network spans more than 700,000 core-kilometers, covering over 260 substations. The optical fiber network is installed on high-voltage transmission lines, using Optical Ground Wire (OPGW) that is enclosed within steel and aluminum for high reliability. The services offered include dark fiber, domestic and international bandwidth, and Internet Protocol Multiprotocol Label Switching (IP MPLS) services for the public and private sectors. 

In recent years, investments and expansion in the data center industry at both national and regional levels have led to a significant surge in demand for telecommunications networks with high capacity, reliability, and security. EGAT has therefore continuously adapted and developed its telecommunications network in response to the needs of data center customers, cloud service providers, and major digital service providers; while preparing its infrastructure to support long-term growth, as well. 

EGAT supports national development by expanding telecommunications infrastructure to accommodate technologies such as 5G, Internet of Things (IoT), and advanced digital systems. EGAT has also been integrating telecommunications infrastructure with digital platforms such as Internet Data Center (IDC), Big Data Analytics, cloud computing, and edge computing, coupled with applying Artificial Intelligence (AI). These efforts aim at supporting the government’s policy of digital economy and sustainably strengthening the country’s competitiveness in the digital economy era.
 
EGAT Smart Energy Solutions: EGAT Smart Energy Solutions focuses on leveraging over 50 years of EGAT’s expertise in the energy industry to develop and deliver comprehensive energy management products and services, covering the entire project lifecycle, including feasibility and financial viability studies, design, installation, licensing, and maintenance. The business emphasizes promoting the use of renewable energy, clean energy, and related energy innovations, such as solar power generation systems and Energy Storage Systems (ESS). Energy management platforms and maintenance management systems are also applied to enhance energy efficiency and sustainably meet the needs of businesses and Thai society. 

In 2025, EGAT carried out energy management projects in continuous collaboration with government agencies, such as the Mass Rapid Transit Authority of Thailand (MRTA) and the Thai Credit Guarantee Corporation (TCG), to drive the country toward Carbon Neutrality, while also supporting the development of the Smart Campus Project on energy by installing solar power generation systems for schools to reduce expenses and instill in youth an understanding of sustainable energy conservation and environmental stewardship. In addition, new services have been developed to meet the needs of the private sector, including hotels, factories, restaurants, and energy users seeking clean and efficient energy solutions, while also reducing operating costs. 

EGAT has also organized collaborative activities with customers and business partners to promote its smart energy solutions, such as the Government Savings Bank and the Thai Chamber of Commerce, aiming at providing knowledge of energy management to increase energy efficiency, reduce operating costs, and support the transition toward sustainable clean energy usage.  
EGAT EV Business Solutions: EGAT EV Business Solutions are operated in line with the low-carbon strategy that promotes the transition to electric vehicles (EVs), focusing on strengthening the country’s EV ecosystem in the full rage. EGAT supports and cooperates in the development of EV charging infrastructure by providing services of charging stations, EV applications, and EV charging station management systems. In 2025, services of EGAT EV Business Solutions were developed and delivered as follows:  
1. EGAT expanded the “EleX by EGAT” EV charging stations nationwide to a total of 305 stations, both operated by EGAT and partners such as PT gas stations, Sahapat Group, Home Product Center Public Co., Ltd., BMW (Thailand) Co., Ltd., Sathorn Thani Building, and Central Pattana Public Co., Ltd. In addition, the development of large-scale EV station hubs was initiated to facilitate more customers in the future, including at EGAT Learning Center – Thap Sakae in Prachuap Khiri Khan Province, EleX by EGAT PT in Nakhon Chai Si 11, and PT GIGA EV in Lat Phrao-Wang Hin. 
2. EGAT provided the application “EleXA” to facilitate EV users in locating and reserving charging stations, initiating charging orders, making payments, and accessing other services, such as trip planner and roaming connectivity with other charging networks. The application was expanded to cover more than 450 charging stations under “EleXA Network.” In 2025, EleXA received the FIRI Special Award, a Special Prize on Stage, from The First Institute of Inventors and Researchers in I.R. Iran. 
3. EGAT provided the EV charging network operator platform “BackEN EV,” supporting private operators and investors in developing commercial EV charging stations, while facilitating efficient and fast operation and management. EGAT has also officially appointed authorized distributors of the BackEN EV. 
4. EGAT offered the end-to-end service of EGAT EV Total Solution, including site survey, consultation, layout design, station installation, station management, and customer service for EV users. 
5. EGAT provided the services under EV Experts business, comprising academic and technical knowledge development through EGAT EV Academy, professional certification for EV charging station technicians, Intelligence Maintenance Platform as a Service (iMPS), and electrical and safety testing, all of which are certified by EGAT. 
By-Product Business: EGAT has continuously advanced its by-product innovation business in alignment with the Circular Economy strategy, transforming into a circular economy organization while contributing to the nation’s Carbon Neutrality goal. The initiative promotes efficient resource utilization and maximizes value creation under the “Zero Waste to Landfill” concept by transforming by-products from power generation at the Mae Moh Power Plant and mining operations into sustainable innovations (Sustainovations). For instance, lignite fly ash can be used as a supplementary cementitious material for construction, with its use in 2025 reducing carbon dioxide emissions by approximately 738,000 metric tons, equivalent to planting around 61 million trees. Besides, synthetic gypsum is utilized in the production of cement, fiber cement, engineered wood, and soil conditioners, helping reduce the depletion of natural resources. Furthermore, EGAT Humic, derived from Mae Moh mining operations, received a silver medal at the 49th International Exhibition of Inventions Geneva, representing a sustainable innovation that enhances soil nutrients and crop production, reduces costs for farmers, supports low-carbon agriculture, and contributes to long-term sustainability in the agricultural sector. 

EGAT has pushed ahead with its innovation development by transforming by-products from electricity generation and mining into value-added products in collaboration with leading academic institutions in Thailand and experts in related fields. In 2025, six projects were implemented, as follows: 
Design of alkali-activated fly ash concrete mix proportions and development of porous geopolymer concrete products from high-calcium fly ash for capturing CO2 from flue gas of Mae Moh Power Plant 
Value enhancement of synthetic gypsum through Carbon Capture, Utilization, and Storage and feasibility study of synthetic gypsum storage facility 
Utilization of flue gas to improve bottom ash for reducing moisture, absorbing CO2, and supporting commercial use 
Application of EGAT Humic to increase quality of economic crop production 
 EGAT Group

EGAT has invested in electricity generation and energy-related businesses in the following 8 companies:

Subsidiary Companies
RATCH Group Public Company Limited (RATCH)
   Nature of Business

RATCH was established as a holding company on March 7, 2000. RATCH gets dividends from its subsidiaries and joint ventures as main revenue.

The company focuses mainly on investing, developing, and joining with business partners in different projects both in Thailand and abroad. The investments are focused on the following areas:

Electricity generation business comprising baseload and renewable power plants, both domestically and internationally
Related business and others covering infrastructure system development such as transportation system, telecommunications network, waterworks system, and investments in the new S-Curve industry
As of December 31, 2025, RATCH had a total installed capacity of 9,586.24 MW comprising 4,237.11 MW from domestic projects and 5,349.13 MW from international projects.

Shareholding

As of December 31, 2025, RATCH had a total registered capital of 22,192.31 million Baht, of which 21,750 million Baht was issued and paid up, equivalent to 2,175 million shares. Its ownership structure was composed of 45% stakes held by EGAT and 55% stakes held by the general public. 

EGAT International Company Limited (EGATi)
   Nature of Business

EGATi was established by EGAT on December 18, 2007. The objective is to represent EGAT in international investments in order to acquire electricity back to Thailand and expand investment opportunities in electricity business and EGAT’s related businesses to create added value and contribute to EGAT’s other businesses and Thailand. 

At present, EGATi has four commercial projects in operation, namely Nam Ngiep 1 Hydropower in Lao PDR, Adaro Coal Mine in Indonesia, Solar Power Plant in Taiwan, and Battery Energy Storage System (BESS) in Taiwan. The generating capacity according to the share is 117.95 MW. The other four projects which are in the process of development/request for investment are Venus Thermal Power Plant in Vietnam, Nam Ngum 3 Hydropower Plant in Lao PDR, and Renewable Power Plant and BESS in Taiwan. The installed capacity according to the share is 454.05 MW. 

As of December 31, 2025, EGATi had a total installed capacity of 572 MW from international projects. 

Shareholding

As of December 31, 2025, EGATi had a total registered capital of 12,197.4 million Baht which was issued and paid up. The number of shares was 1,219.74 million, of which 99.99% were held by EGAT. 

EGAT Diamond Service Company Limited (EDS)
   Nature of Business

EDS was established on December 15, 2009 through the co-investment between EGAT, Mitsubishi Power Asia Pacific Pte. Ltd. (MPW-AP), Mitsubishi Corporation (MC), and RATCH. The objective of the company is to provide refurbishment work for hot gas path parts of gas turbines in 18 countries, namely Thailand, Malaysia, Singapore, Lao PDR, Myanmar, Vietnam, Cambodia, Brunei, Australia, New Zealand, India, Pakistan, Bangladesh, Sri Lanka, Bhutan, Nepal, Afghanistan, and Maldives. The Gas Turbine Refurbishment Service Center located in Navanakorn Industrial Estate, Pathum Thani Province started its commercial operation in May 2011. 

On November 15, 2022, the Cabinet approved the proposal to expand the scope of business; from the refurbishment of hot gas path parts of gas turbine and the operation and maintenance of power plants to include maintenance service, manufacturing of parts relating to electrical energy industry, and power plant operation. 

At present, EDS provides maintenance services and manufactures parts, components, and equipment for gas turbine power plants, the power industry, and other related industries. Newly launched business operations include the production of DC fast chargers under the brand FlexxFast by EDS, as well as installation and after-sales services.   

Shareholding

As of December 31, 2025, EDS had a total registered capital of 623 million Baht which was issued and paid up. The number of shares was 6.23 million, of which 45%, 30%, 15%, and 10% were held by EGAT, MPW-AP, MC, and RATCH, respectively. 

Associated Company
Electricity Generating Public Company Limited (EGCO)
   Nature of Business

EGCO was established by EGAT as a holding company on May 12, 1992. Its revenues are mainly from dividends of subsidiaries and joint ventures.  

EGCO focuses mainly on electricity business domestically and internationally as well as energy-related businesses. The business of EGCO can be categorized into two groups as follows:   

Electricity business covering the following countries: Thailand, Lao PDR, the Philippines, Indonesia, South Korea, Taiwan, and the USA, with power generation using diverse fuel types 
Energy-related businesses such as operation and maintenance service, power plant management service, coal mining business, natural gas acquisition and wholesale business, clean energy project development business, online platform service, oil pipeline business, solar panel performance testing service, and infrastructure and public utility business 
As of December 31, 2025, EGCO had a total installed capacity according to the share of 7,139.25 MW, consisting of 3,097.03 MW from domestic projects and 4,042.22 MW from international projects. 

Shareholding

As of December 31, 2025, EGCO had a total registered capital of 5,300 million Baht, of which 5,264.65 million Baht was issued and paid up. The company had a total of 526.465 million shares held by EGAT (25.41%), TEPDIA Generating B.V. (23.94%), and the general public (50.65%). 

Joint Venture

District Cooling System and Power Plant Company Limited (DCAP)
Nature of Business

DCAP is a joint venture registered as a company on April 2, 2003 by EGAT, PTT Public Co., Ltd. (PTT), and MEA. The objective of the company is to generate and sell electricity and cooling water to Suvarnabhumi International Airport. At present, to support the Green Airport policy of Suvarnabhumi International Airport, the company focuses on developing clean power plants by initiating a solar power generation within the Suvarnabhumi International Airport area. 

As of December 31, 2025, DCAP had a total generating capacity of 98.90 MW and a total cooling water producing capacity of 53,000 RT. 

Shareholding

As of December 31, 2025, DCAP had a total registered capital of 1,670 million Baht which was issued and paid up. The number of shares was 167 million, of which 35%, 35%, and 30% were held by EGAT, PTT, and MEA, respectively. 

 INNOPOWER Company Limited
Nature of Business

INNOPOWER is a joint venture registered as a company on September 13, 2021 by EGAT, EGCO, and RATCH. The objective of the company is to enhance research and innovation within EGAT Group and through collaborations with partner companies, while expanding their commercial applications. It also invests in funds/startups in the energy industry. At present, in striving to become a decarbonization partner, the company operates three business units as follows: 

Energy business: Future energy; grid modernization; solar engineering, procurement, and construction (Solar EPC); and solar power purchase agreement (Solar PPA) 
EV business: One-stop EV charger distribution and EV bus fleet 
Environmental business: Renewable Energy Certificate (REC) trading, EV carbon credit, and greenhouse gas reporting 
Moreover, INNOPOWER has established a subsidiary in Singapore to set up an investment fund for capital raising in international startups specializing in CarbonTech and EmissionTech, as well as fund management. It has also established a subsidiary in Thailand to conduct business in innovation development and digital technology, including platform development tailored to the needs of EGAT’s new business units. 

Shareholding

As of December 31, 2025, INNOPOWER had a total registered capital of 1,900 million Baht which was issued and paid up. The number of shares was 19 million, of which 40%, 30%, and 30% were held by EGAT, EGCO, and RATCH, respectively. 

PE LNG Company Limited (PE LNG)d
Nature of Business

PE LNG was founded on June 16, 2023 by PTTLNG Co., Ltd. (PTTLNG). On April 30, 2024, EGAT entered into a 50% shareholding in the company to develop the LNG Receiving Terminal (2nd terminal), which operates LNG unloading, storage, and regasification, with a total capacity of 7.5 million tons per year. 

Shareholding

As of December 31, 2025, PE LNG had a total registered capital of 28,799.29 million Baht which was issued and paid up. The number of shares was 2,879.93 million. Its ownership structure was composed of EGAT and PTTLNG in the proportion of 50% and 50% stakes, respectively. 

Investment
InnoSpace (Thailand) Company Limited
Nature of Business

InnoSpace was founded by the cooperation of the public and private sectors on January 14, 2019. The objective of the company is to serve as a national startup platform in promoting and developing the startup economy in Thailand in full range to drive the country toward a sustainable innovation-based economy. EGAT has invested in InnoSpace since August 19, 2021. At present, the company focuses on investing in and developing startups in the medical industry, food industry, and 4.0 industry. 

Shareholding

As of December 31, 2025, InnoSpace had a total registered capital of 835.01 million Baht, of which 417.50 million Baht was issued and paid up. The number of shares was 835,010. Its ownership structure was composed of EGAT and other partners in the proportion of 11.98% and 88.02% stakes, respectively. 

