Acer Swift Go 14 AI
ตัวเครื่องที่พกพาสะดวก พร้อมหน้าจอขนาด 14 นิ้ว ที่ให้ความคมชัดและสีสันที่สวยงาม เป็นเพื่อนร่วมงานที่สมบูรณ์แบบสำหรับการทำงานนอกสถานที่และการเดินทาง



ขุมพลัง AI รุ่นล่าสุด
ขับเคลื่อนด้วยโปรเซสเซอร์ Intel Core Ultra 5 228V ช่วยเร่งความเร็วในการประมวลผลงาน AI โดยเฉพาะ ทำให้ฟีเจอร์อัจฉริยะต่าง ๆ บน Windows 11 ทำงานได้อย่างรวดเร็วและประหยัดพลังงาน



กราฟิก Intel Arc ประสิทธิภาพสูง
เพลิดเพลินกับการแสดงผลที่คมชัดและลื่นไหลด้วยชิปกราฟิกในตัว Intel Arc Graphics ที่พร้อมรองรับการทำงานด้านมัลติมีเดีย การสร้างสรรค์คอนเทนต์เบื้องต้น และการเล่นเกมที่ต้องการกราฟิกปานกลางได้อย่างมีประสิทธิภาพ



พร้อมใช้งานด้วย Windows 11 Home
ติดตั้ง Windows 11 Home มาให้พร้อมใช้งาน เพื่อมอบอินเทอร์เฟซที่ทันสมัยและเครื่องมือที่ขับเคลื่อนด้วย AI ช่วยให้การทำงานประจำวันของคุณง่ายและมีประสิทธิภาพมากขึ้น

 

คำถามที่พบบ่อย
คำว่า "AI" ในชื่อรุ่นหมายถึงอะไร และมีประโยชน์อย่างไร?
หมายถึงการที่ตัวเครื่องมาพร้อมกับชิป Intel Core Ultra ซึ่งมีหน่วยประมวลผล NPU (Neural Processing Unit) โดยเฉพาะ NPU นี้ทำหน้าที่เร่งความเร็วงานที่เกี่ยวข้องกับ AI และ Machine Learning เช่น การประมวลผลภาพ การเบลอพื้นหลังวิดีโอ และการทำงานของ Microsoft Copilot ทำให้ CPU หลักทำงานเบาลงและประหยัดพลังงานมากขึ้นครับ
Intel Arc Graphics ที่มาพร้อมกับ Core Ultra มีความสามารถด้านใดบ้าง?
เป็นชิปกราฟิกแบบรวมเหมาะสำหรับ งานตัดต่อวิดีโอเบาๆ และการเรนเดอร์ภาพ, การทำงานกราฟิก 2D/3D ทั่วไป, เล่นเกมออนไลน์หรือเกม 3D ระดับเริ่มต้น (Casual Gaming) ที่การตั้งค่าความละเอียดกลางๆ ครับ
