== Performance rewrite (and support for Translate extension) ==

I have been putting together a version of [[Da:Map Features]] (which is the language version that takes longest to generate and hits the most resource limits) to avoid the link processing bottleneck with some Lua. Using the data items to find documentation has the additional bonus that the links can be updated as documentation uses the Translate extension, one page at a time if wanted. The demonstration page is at [[Performance test/Da:Map Features]]. [[User:Wynndale|Andrew]] ([[User talk:Wynndale|talk]]) 19:18, 24 July 2022 (UTC)
=== Implementation ===
: The top page and Danish templates only exist to use the generic templates. The generic templates differ from the existing ones in that the lines:
: <code><nowiki>| [[{{{amenity:key|{{LL|1=key:amenity}}}}} | amenity]]</nowiki></code><br/>
: <code><nowiki>| [[{{{restaurant:value|{{LL|1=Tag:amenity=restaurant}}}}} | restaurant]]</nowiki></code>
: are replaced by:
: <code><nowiki>| {{ keylink | amenity }}</nowiki></code><br/>
: <code><nowiki>| {{ valuelink | amenity | restaurant }}</nowiki></code>
: The value column is left unchanged when it isn’t a link to a documentation page.
: The Lua code in [[Module:Taglink]] runs much faster than {{tl|LL}} and it could also be used in {{tl|Tag}}. [[User:Wynndale|Andrew]] ([[User talk:Wynndale|talk]]) 07:52, 26 July 2022 (UTC)
::Why it would be used in tag where it simply linking wiki pages? [[User:Mateusz Konieczny|Mateusz Konieczny]] ([[User talk:Mateusz Konieczny|talk]]) 12:47, 28 July 2022 (UTC)
: The Tag template supports documentation in multiple languages. It could be used to follow pages using the Translate extension if they are created with the extension’s native …/xx page naming convention. [[User:Wynndale|Andrew]] ([[User talk:Wynndale|talk]]) 21:05, 28 July 2022 (UTC)
=== Issues ===
Hello, I encountered some ''<span class="error">Too many OpenStreetMap Wiki entities accessed.</span>'' on [[DE:Map Features]]. Is it something like an API call limit exhaustion? --[[User:Chris2map|Chris2map]] ([[User talk:Chris2map|talk]]) 19:49, 19 August 2022 (UTC)

I just came here to say exactly this! Whatever is happening is still a problem. It's showing up on [[Key:maxlength|maxlength]] but only on [[Map_Features#restrictions]], not on the [[Template:Map_Features:restrictions|template page]]. --[[User:Ellehan|Ellehan]] ([[User talk:Ellehan|talk]]) 17:28, 8 October 2022 (UTC)
:Maybe we can switch to more direct linking without piles of random template magic and data items? [[User:Mateusz Konieczny|Mateusz Konieczny]] ([[User talk:Mateusz Konieczny|talk]]) 19:05, 17 November 2022 (UTC)

::<p>{{ping|Mateusz Konieczny}} Each page has a maximum quota of “expensive” operations. You can view the HTML source code of a page  to see its usage against the quota in a comment towards the end of the page. Accessing a data item that isn’t the page’s linked data item is considered “expensive”, but so is testing whether another page exists, which the old {{tl|LL}}-based version did in abundance in a quest to eliminate redlinks. Eventually, once the Translate extension is installed, we’ll be able to link to [[Special:MyLanguage]] for each of these links without counting against the expensive call quota.<p>In the meantime, we could try replacing the whole page with a series of {{tl|taglist}}s, which use JavaScript to build the tables independently of MediaWiki. It’s quite a roundabout approach, driven by taginfo scraping individual pages. Or more simply, we could replace the {{tl|keylink}}s and {{tl|valuelink}}s with basic wikilinks that are allowed to be redlinks. We can add a little unconditional “<small>(en)</small>” link afterwards as a fallback.<p>Taking a step back, what we’re running up against is the limit of trying to cram the whole wiki onto one page – a fool’s errand, if you ask me. I think it’s high time we split up this page into multiple pages by topic, along with optimizing the structure and metadata of individual tag description pages to improve the quality of search results.<p>&nbsp;&ndash;&nbsp;[[User:Minh Nguyen|Minh <span style="font-variant: small-caps;">Nguyễn</span>]]&nbsp;<sup>[[User talk:Minh Nguyen|<span style="display: inline-block;">&#x1f4ac;</span>]]</sup> 15:36, 18 November 2022 (UTC)
::: The EWG know about Map Features; it’s just that we’ve been pursuing other work in the wiki and elsewhere more vigorously. In the specific case of taglists English map features use the extensively and doesn’t get the message, but other languages hit the problem that, because Taginfo scrapes wiki pages instead of using data items, it doesn’t return descriptions in any language where there isn’t a long form page for the tag. [[User:Wynndale|Andrew]] ([[User talk:Wynndale|talk]]) 17:47, 18 November 2022 (UTC)
::: Personally I never ever used map features page - do we have info how and why people use it? Are there people using it? (to be clear, I am not claiming that everyone is using Wiki in the same way as me, but I would be interested in learning how people treating this page as useful are using it) [[User:Mateusz Konieczny|Mateusz Konieczny]] ([[User talk:Mateusz Konieczny|talk]]) 17:51, 18 November 2022 (UTC)

::::<p>{{ping|Mateusz Konieczny}} It's probably a few different things. Often, people giving introductory presentations to OSM point newcomers at this page as an entry point to the wiki's vast repertoire of documented tags. Apart from that, there are many contexts in which more experienced mappers need to refer to a tag while not mapping, such as during a tagging discussion. Some people prefer single-page documentation that's compatible with the browser's find in page command; it's a matter of taste. But I don't think any of these reasons necessarily ties us to the current approach. Breaking up this page into a small set of pages by theme wouldn't greatly inconvenience people who prefer to see documentation in one place, and it would give us room to document far more features without running into these limits.<p>Separately, I've [https://github.com/openstreetmap/id-tagging-schema/issues/646 proposed] a standalone preset browser based on id-tagging-schema that could take the place of this page while promoting consistency between various editors and the wiki. In principle, it could be implemented as a gadget or user script that takes over this page in the same manner as a taglist. Something oriented around presets would answer questions people have more directly than something based on raw tags.<p>&nbsp;&ndash;&nbsp;[[User:Minh Nguyen|Minh <span style="font-variant: small-caps;">Nguyễn</span>]]&nbsp;<sup>[[User talk:Minh Nguyen|<span style="display: inline-block;">&#x1f4ac;</span>]]</sup> 08:18, 19 November 2022 (UTC)

