== Britocentric? ==

I suppose it's refreshing to some to see something not Americentric for once, but the nomenclature being used in OSM is egregiously Britocentric. Terms like "primary highway, secondary highway" are patently Britain-specific. Likewise the "link" road types. "Living street" has no meaning outside Europe, from what I can tell. And apparently Britain has no such thing as "daycare" or "preschool", I suppose they call it something else, but I've no idea what.

I could go on, but could there be maybe some guidance for people outside the UK who basically have to wing it with the Britocentric terms used for map features? Or work on universalising them, perhaps. - [[User:KTyler|KTyler]] 05:51, 10 May 2012 (BST)

: After 8 years, by chance you arrive on the project and want to change what is widely used and accepted all around the world. The tags are key/value pairs which can be added by editors presets (the icons on Potlatch or the presets menu in JOSM). You can translate those presets to your local language/wording if you like (OSM editors are all open sources) as they are already translated into German, French, Russian, etc. Create a US centric version of the features names if you like. Important is only that the meaning of the tags remain consistent over the continents, that a highway=primary is more important than a highway=secondary, etc. Note that many countries created a specific wiki page to explain how the UK centric terminology has to be used with the local practices. See [[United States roads tagging]] for instance. Also the [[Map Features]] wiki page has been translated in many languages and reworked for local habits, sometimes adding specific local features, sometimes removing features which do not exist locally (like your example of the 'living_street'. --[[User:Pieren|Pieren]] 12:48, 10 May 2012 (BST)

: There could be a page listing ''commonly used'' tags that are, or can be, unintuitive for [[wikipedia:American English]] natives, purely because of the words used. Just so that they're not limited to searching, which can list lots of unrelated pages. For the lack of a better page title, I'd go for [[wikipedia:British English]]. [[User:Alv|Alv]] 07:29, 11 May 2012 (BST)

: Unfortunately language and country are not the same thing, unless you are proposing an American English language tag. (And a [[wikipedia:Canadian English]], and an Australian, etc.) What I'm saying is that just because everyone has put up with (or more like, it seems, struggled with) the Britocentrisms as the square pegs in their round holes, doesn't mean that the project shouldn't endeavor for terms that are more universal. Sure, it's obvious that a "primary highway" is more "important" than a "secondary highway", but those terms apparently have specific defined meaning in the UK -- elsewhere, afaik, they do not. Outside UK, what makes a road secondary and not primary? Do we just make it up as we go along? Or arbitrarily wing it? Seems like that's an invitation for a globally inconsistent map. - [[User:KTyler|KTyler]] 20:40, 12 June 2012 (BST)

::I do agree that the UK system of road classification is odd, and indeed possibly quaint, however it is probably no more odd than any other. I think it is useful therefore to maintain a single version of English for use for the main tags and values within the database, and for historic reasons that is British English.  That is not a reason however not to try to make the documentation in the wiki more understandable to more people, in particular to those more familiar use [[wikipedia:North American English]], although there are other dialects in use for some terms in English as used in Australia and indeed in India. As a simple way to show the amount of variation between the two versions of English, consider the following and notice the diversity of terms used:

::* [[Wikipedia:Carriageway]]"''A single carriageway road (North American English: undivided highway) has one carriageway with 1, 2 or more lanes together with any associated footways (North American English: sidewalk) and road verges (North American English: tree lawn, boulevard, etc.). A dual carriageway road (North American English: divided highway) has two roadways separated by a central reservation (North American English: median).''"

::* [[wikipedia:road verge]] "''A road verge, (also verge, city grass, devil's strip, nature strip, parking strip, planting strip, sidewalk buffer, tree belt, tree lawn, utility strip, parkway etc.) is a narrow strip of grass or plants and sometimes also trees typically located beside the carriageway (roadway)''"

::* [[wikipedia:Sidewalk]] "''A sidewalk, or pavement, footpath, footway, and sometimes platform, is a path along the side of a road.''"

::As it happens I am currently working on the [[Highways]] article on the OSM wiki and will explore how to make it a little more approachable for people from other places. Regarding the classes of road used in different places, this article is useful [[Highway:International equivalence]].

::-- [[User:PeterIto|PeterIto]] 22:40, 12 June 2012 (BST)

::: I appreciate the links to [[United States roads tagging]] and [[Highway:International equivalence]]. It's not entirely obvious that such pages exist, IMO. :) - [[User:KTyler|KTyler]] 09:56, 13 June 2012 (BST)

::::Great. I have also just added [[United States roads tagging]] to the 'see also' list in the highways article. [[User:PeterIto|PeterIto]] 10:23, 13 June 2012 (BST)



