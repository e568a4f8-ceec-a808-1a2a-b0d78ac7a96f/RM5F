::: Which tags appear in a taglist is controllable by the user. That was one of my most important design goals for the taglist: You can get all tags with as specific key if you want to, but you can also just list specific tags. The mechanism behind this doesn't decide, the community does. As for the missing translations, this can, and should be, fixed (see [[Talk:Taginfo/Taglists#Translation]]. I am just not sure what the best way would be to do this, technically and for the users, and welcome any input. I will add a "rendering" column to the taglists once that information is in the info box template. Currently the information is just not there, so taginfo can't get to it. The biggest question, in my opinion, concerns the description. I am not a big fan of having a "short description" and a "long description" or something like this. It just makes keeping things up to date more difficult and using the descriptions more difficult for any kind of program, because you always have to ask yourself, which one to use, what to do if there is only one etc. I think there should be only one concise description used everywhere. For more information, you can always click through to the wiki page. But this is certainly something which can be debated and taginfo can be changed if necessary. There is a different problem there: Taginfo currently doesn't work well if the description contains anything other than plain text. Markup or even links sometimes don't work. I think we should discourage the use of markup or links in those description texts because it makes it basically impossible to use the descriptions outside the wiki context. If I want to, say, show those descriptions in an editor, the editor would have to understand mediawiki markup (or taginfo would have to understand it and translate somehow). I think it is much better if we always require plain text and add extra information like wikipedia links into a different field in the info box. [[User:Joto|Joto]] ([[User talk:Joto|talk]]) 09:52, 5 September 2016 (UTC)

