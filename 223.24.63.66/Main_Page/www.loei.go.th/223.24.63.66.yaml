== Converting the amenity table to Taglist ==

I have prepared a Taglist-based version of {{tl|Map Features:amenity}}, following the recipe at [[Taginfo/Taglists/Wiki project]]: see [[User:MiMoHo/Map Features amenity taglist draft]].

It is a strict 1:1 conversion: the same 10 subsections and the same 137 values as the current hand-maintained table, with <code>with_rendering=true</code> and translatable section headers kept as template parameters. I checked all 137 values against taginfo — every one has a documented wiki page and usage count ≥ 1, so no entry would be lost by the switch. The only thing that cannot be reproduced is the final "user defined" row, which I would replace with a short sentence linking to the full taginfo value list. Which tags are listed stays exactly as it is now; that question is deliberately out of scope here.

Rationale: the hand-maintained table regularly lags behind newly documented tags, while the Taglist version stays current automatically for descriptions and images.

I am aware that the leisure table was converted back from Taglist to a hand-maintained table in March 2024, and healthcare similarly earlier. If there are reasons that apply to amenity as well, I would like to hear them before deploying. Otherwise I plan to switch the template around '''18 July 2026''', following the documented procedure (first creating {{tl|Generic:Map Features:amenity}} as a fallback so translated pages keep working). --[[User:MiMoHo|MiMoHo]] ([[User talk:MiMoHo|talk]]) 21:01, 4 July 2026 (UTC)
