== Reimagining Map Features ==

I propose to tackle the varying quality of this page in different languages by changing Map Features to a single multilingual page that outputs its text in the user’s preferred interface language.

The tag tables can be generated from [[Taginfo/Taglists]]. For the best results it should be possible to set the description of each tag in each language ahead of writing a long-form documentation page.

The introduction becomes a translatable <code><nowiki>{{int:…}}</nowiki></code> string, the message for each language transcluding a template of the actual introduction.

The section headings and table headers also become <code><nowiki>{{int:…}}</nowiki></code> messages.

--[[User:Wynndale|Andrew]] ([[User talk:Wynndale|talk]]) 11:47, 5 July 2019 (UTC)

:Generating the tables from taginfo taglists is a good idea. But <code><nowiki>{{int:…}}</nowiki></code> would require the translations to live in the MediaWiki: namespace, which is only editable by administrators. While that's reasonable for widely used templates, elements like the introduction to this page are only relevant to a single page. If we rely on taginfo taglists, then there's not as much to translate manually as part of the page anyways. &ndash;&nbsp;[[User:Minh Nguyen|Minh <span style="font-variant: small-caps;">Nguyễn</span>]]&nbsp;<sup>[[User talk:Minh Nguyen|<span style="display: inline-block;">&#x1f4ac;</span>]]</sup> 22:06, 6 July 2019 (UTC)

