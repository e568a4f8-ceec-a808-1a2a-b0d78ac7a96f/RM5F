== Places and parts of addresses in Spain ==

I have been updating some of the places I visited in Spain.  It’s not hard to map the elements of a [https://www.spanishexamples.com/spanish-reference-resource/example-spanish-address/ Spanish address] to those in the table.  But I am not completely sure about matching administrative labels.  Provinces fits Spanish provinces OK, but it isn't clear whether a Spanish “autonomous community” (contains provinces) should be a region.  There are regions smaller than provinces but larger than municipalities, such as [http://www.turismotierraestella.com/es/localizacion/ Tierra Estella]

And Spanish municipalities may not be the municipality in the table.  But I am not sure whether they fit “district” or “county.”  They typically include a village or city of the same name, but they may contain other villages.  Some of them are already listed as admin level 8, which seems too small.

There are also ''comarcas'', ''mancomunidades'', ''merindades'', and possibly more.  Spanish Wikipedia calls “Tierra Estella” a ''merindad''.
[[User:Happy Hobo|伟思礼]] ([[User talk:Happy Hobo|talk]]) 07:20, 21 February 2021 (UTC)

