== Best practice for “User defined” table rows ==

I am trying to improve the “User defined” rows at the bottom of the tables in all languages. My first draft of a specification, largely based on existing practice, is:

Each table on this page has a row at the bottom labelled “User defined” on the English-language page and specified by the <tt>Proposed_features:value2</tt> and <tt>Proposed_features:desc</tt> template arguments. The description should mention [[Taginfo]] and should link to <tt><nowiki>//taginfo.openstreetmap.org/keys/<key>#values</nowiki></tt>, for instance <tt>//taginfo.openstreetmap.org/keys/highway#values</tt>, preferably using [[WikiProject Cleanup#Protocol-relative_URLs|protocol-relative URLs]]*. Any references to Tagwatch need to be removed because because this service has closed down. Note that there are repeated rows on the page and each one needs to be edited separately.

* If there are links to [[Taginfo/Sites|single-country instances of Taginfo]] they should use the <tt><nowiki>http://</nowiki></tt> protocol prefix because no local instance has properly configured https access.

--[[User:Wynndale|Andrew]] ([[User talk:Wynndale|talk]]) 21:53, 30 April 2014 (UTC)

: I'm currently playing with a template {{Keystat|highway}} ([[Template:Keystat]]) for the "User defined" rows and maybe other use cases like proposals, ... . Haven't added a lang variable yet and haven't thought about the http/https nor about language specific [[Taginfo]] links. Unfortunately we have fixed the most occurrences of Tagwatch to Taginfo already. Using a Template makes it easier if the syntax of the url links to taginfo changes in the future. --[[User:Werner2101|Werner2101]] ([[User talk:Werner2101|talk]]) 11:02, 27 May 2014 (UTC)

